<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>几何空战 v2.2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 2px solid #0ff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 60px rgba(0, 255, 255, 0.05);
      /* 固定逻辑宽高，由JS scaleCanvas()控制视觉缩放 */
      width: 480px;
      height: 720px;
      /* 移除max限制，避免与JS scale双重叠加 */
      /* 固定画布，防止触摸拖动页面 */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameCanvas {
      display: block;
      background: linear-gradient(180deg, #0a0a1a 0%, #0f0f2a 50%, #1a0a2a 100%);
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      color: #0ff;
      font-size: 14px;
      text-shadow: 0 0 10px #0ff;
      pointer-events: none;
    }
    .ui-panel {
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 15px;
      border: 1px solid rgba(0, 255, 255, 0.3);
    }
    .stat { margin: 3px 0; }
    .hp-bar, .energy-bar, .shield-bar {
      width: 150px;
      height: 8px;
      background: rgba(0, 255, 255, 0.2);
      margin-top: 5px;
      position: relative;
    }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #ff0080, #ff00ff); }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #00ff88); }
    .shield-fill { height: 100%; background: linear-gradient(90deg, #ffaa00, #ffff00); }
    #startScreen, #gameOverScreen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 20, 0.95);
      color: #0ff;
      text-shadow: 0 0 20px #0ff;
    }
    #gameOverScreen { display: none; }
    h1 { font-size: 48px; margin-bottom: 10px; letter-spacing: 8px; }
    .subtitle { font-size: 18px; color: #ff00ff; margin-bottom: 40px; }
    .controls {
      text-align: left;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 40px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 20px;
    }
    .controls span { color: #ff00ff; }
    button {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 15px 50px;
      font-size: 20px;
      font-family: inherit;
      cursor: pointer;
      text-shadow: 0 0 10px #0ff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      transition: all 0.3s;
    }
    button:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
    }
    .final-score { font-size: 36px; margin: 20px 0; color: #ff00ff; }
    .mode-select {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }
    .mode-btn {
      background: transparent;
      border: 2px solid rgba(0, 255, 255, 0.3);
      color: #0ff;
      padding: 10px 25px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0.6;
    }
    .mode-btn:hover { opacity: 0.8; background: rgba(0, 255, 255, 0.1); }
    .mode-btn.selected {
      opacity: 1;
      border-color: #0ff;
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }
    .credits {
      margin-top: 40px;
      font-size: 12px;
      color: rgba(0, 255, 255, 0.5);
      letter-spacing: 2px;
    }
    #cooldownHint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #0ff;
      font-size: 12px;
      opacity: 0.7;
      pointer-events: none;
    }
    /* ========== 移动端控件 ========== */
    #mobileControls {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    @media (hover: none) and (pointer: coarse) {
      #mobileControls { display: block; }
      #cooldownHint { display: none; }
      .desktop-only { display: none; }
      .mobile-only { display: block !important; }
    }
    #joystickArea {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    #joystickBase {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid rgba(0, 255, 255, 0.4);
      position: relative;
    }
    #joystickKnob {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.5);
      border: 2px solid rgba(0, 255, 255, 0.8);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
    #actionButtons {
      position: absolute;
      bottom: 30px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .actionBtn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid rgba(0, 255, 255, 0.5);
      color: #0ff;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      text-shadow: 0 0 8px #0ff;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
      transition: background 0.1s;
    }
    .actionBtn:active, .actionBtn.active {
      background: rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
    #btnFire {
      width: 65px;
      height: 65px;
      font-size: 18px;
      background: rgba(255, 0, 128, 0.2);
      border-color: rgba(255, 0, 128, 0.5);
      color: #ff0080;
      text-shadow: 0 0 8px #ff0080;
      box-shadow: 0 0 12px rgba(255, 0, 128, 0.3);
    }
    #btnFire:active, #btnFire.active {
      background: rgba(255, 0, 128, 0.5);
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.7);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="480" height="720"></canvas>
    <div id="ui">
      <div class="ui-panel">
        <div class="stat">生命 <span id="hpText">100</span></div>
        <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
        <div class="stat" style="margin-top:8px">能量 <span id="energyText">100</span></div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width:100%"></div></div>
        <div class="stat" style="margin-top:8px">护盾 <span id="shieldText">0</span></div>
        <div class="shield-bar"><div class="shield-fill" id="shieldFill" style="width:0%"></div></div>
        <div class="stat" style="margin-top:8px">火力 <span id="weaponText">1</span></div>
      </div>
      <div class="ui-panel" style="text-align:right">
        <div class="stat">关卡 <span id="levelText">1</span></div>
        <div class="stat">波次 <span id="waveText">1</span></div>
        <div class="stat" style="font-size:18px">得分 <span id="scoreText">0</span></div>
      </div>
    </div>
    <div id="cooldownHint">[SHIFT]闪避 | [空格]激光 | [Q]时缓</div>
    <!-- 移动端虚拟控件 -->
    <div id="mobileControls">
      <div id="joystickArea">
        <div id="joystickBase"><div id="joystickKnob"></div></div>
      </div>
      <div id="actionButtons">
        <div id="btnSlow" class="actionBtn">缓</div>
        <div id="btnLaser" class="actionBtn">⚡</div>
        <div id="btnFire" class="actionBtn">火</div>
        <div id="btnDodge" class="actionBtn">闪</div>
      </div>
    </div>
    <div id="startScreen">
      <h1>几何空战</h1>
      <div class="subtitle">GEOMETRIC WARFARE</div>
      <div class="mode-select">
        <button id="modeEasy" class="mode-btn">简单模式<br><small style="font-size:10px;opacity:0.7">普通敌机不射击 · 得分×0.5</small></button>
        <button id="modeNormal" class="mode-btn selected">标准模式<br><small style="font-size:10px;opacity:0.7">全员射击 · 满分</small></button>
      </div>
      <div class="controls desktop-only">
        <span>↑↓←→</span> 或 <span>WASD</span> 移动<br>
        <span>Z</span> 或 <span>J</span> 射击<br>
        <span>SHIFT</span> 闪避冲刺 (消耗能量)<br>
        <span>空格</span> 激光特殊技 (消耗能量)<br>
        <span>Q</span> 时间减速 (消耗护盾)
      </div>
      <div class="controls mobile-only" style="display:none">
        左侧摇杆移动（自动射击）<br>
        右侧按钮释放技能
      </div>
      <div style="display:flex;justify-content:center;align-items:center">
        <button id="startBtn">开始任务</button>
      </div>
      <div class="credits">几何空战 · v2.2<br>余风清韵 & WorkBuddy</div>
    </div>
    <div id="gameOverScreen">
      <h1>任务失败</h1>
      <div class="final-score">得分：<span id="finalScore">0</span></div>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

<script>
// ========== 音效系统 ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  switch(type) {
    case 'shoot':
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case 'explosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case 'hit':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'laser':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
      break;
    case 'dodge':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'powerup':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      osc.frequency.setValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.setValueAtTime(0.1, now + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case 'gameover':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(300, now + 0.2);
      osc.frequency.setValueAtTime(200, now + 0.4);
      osc.frequency.setValueAtTime(100, now + 0.6);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.setValueAtTime(0.15, now + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
      break;
    case 'victory':
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, now + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.2);
        o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.2);
      });
      break;
  }
}

// ========== 游戏配置 ==========
const CONFIG = {
  WIDTH: 480,
  HEIGHT: 720,
  PLAYER_SPEED: 6,
  BULLET_SPEED: 12,
  DODGE_SPEED: 10,
  DODGE_COST: 25,
  LASER_COST: 30,
  LASER_DURATION: 1.5,    // 秒（原版90帧 ≈ 1.5秒@60fps）
  SLOW_COST: 1,
  SLOW_DURATION: 3.0,     // 秒
  INVINCIBLE_TIME: 1.5   // 秒
};

// ========== 关卡配置 ==========
const LEVELS = [
  {
    name: "都市防线",
    waves: [
      { enemies: [{type:'diamond', count:5}, {type:'triangle', count:3}], spawnDelay: 30 },
      { enemies: [{type:'square', count:4}, {type:'diamond', count:4}], spawnDelay: 25 },
      { enemies: [{type:'pentagon', count:2}, {type:'triangle', count:5}], spawnDelay: 20 },
      { enemies: [{type:'hexagon', count:1}, {type:'square', count:6}], spawnDelay: 15 },
      { enemies: [{type:'diamond', count:8}, {type:'triangle', count:6}], spawnDelay: 10 }
    ],
    bgSpeed: 2
  },
  {
    name: "钢铁风暴",
    waves: [
      { enemies: [{type:'triangle', count:6}, {type:'square', count:6}], spawnDelay: 20 },
      { enemies: [{type:'pentagon', count:4}, {type:'diamond', count:8}], spawnDelay: 18 },
      { enemies: [{type:'hexagon', count:2}, {type:'triangle', count:10}], spawnDelay: 15 },
      { enemies: [{type:'pentagon', count:6}, {type:'square', count:8}], spawnDelay: 12 },
      { enemies: [{type:'hexagon', count:4}, {type:'pentagon', count:4}, {type:'diamond', count:10}], spawnDelay: 10 }
    ],
    bgSpeed: 3,
    enemySpeedMult: 1.3,
    enemyShootMult: 0.7
  },
  {
    name: "混沌领域",
    waves: [
      { enemies: [{type:'pentagon', count:6}, {type:'hexagon', count:3}], spawnDelay: 18 },
      { enemies: [{type:'hexagon', count:5}, {type:'pentagon', count:8}], spawnDelay: 15 },
      { enemies: [{type:'hexagon', count:8}, {type:'triangle', count:12}], spawnDelay: 12 },
      { enemies: [{type:'hexagon', count:6}, {type:'pentagon', count:6}, {type:'diamond', count:10}], spawnDelay: 10 },
      { enemies: [{type:'boss', count:1}], spawnDelay: 60, isBossWave: true }
    ],
    bgSpeed: 4,
    enemySpeedMult: 1.5,
    enemyShootMult: 0.6
  },
  {
    name: "深渊回旋",
    waves: [
      { enemies: [{type:'hexagon', count:6}, {type:'pentagon', count:8}], spawnDelay: 15 },
      { enemies: [{type:'hexagon', count:8}, {type:'pentagon', count:6}, {type:'triangle', count:8}], spawnDelay: 12 },
      { enemies: [{type:'hexagon', count:10}, {type:'square', count:10}], spawnDelay: 10 },
      { enemies: [{type:'hexagon', count:8}, {type:'pentagon', count:8}, {type:'diamond', count:12}], spawnDelay: 8 },
      { enemies: [{type:'boss2', count:1}], spawnDelay: 60, isBossWave: true }
    ],
    bgSpeed: 5,
    enemySpeedMult: 1.7,
    enemyShootMult: 0.5
  },
  {
    name: "虚空裂隙",
    waves: [
      { enemies: [{type:'pentagon', count:8}, {type:'hexagon', count:5}], spawnDelay: 14 },
      { enemies: [{type:'hexagon', count:8}, {type:'pentagon', count:6}, {type:'square', count:8}], spawnDelay: 11 },
      { enemies: [{type:'hexagon', count:10}, {type:'pentagon', count:8}, {type:'triangle', count:10}], spawnDelay: 9 },
      { enemies: [{type:'hexagon', count:8}, {type:'pentagon', count:10}, {type:'diamond', count:12}], spawnDelay: 7 },
      { enemies: [{type:'boss3', count:1}], spawnDelay: 60, isBossWave: true }
    ],
    bgSpeed: 6,
    enemySpeedMult: 1.9,
    enemyShootMult: 0.4
  }
];

// ========== 敌机类型 ==========
const ENEMY_TYPES = {
  diamond:  { size: 20, hp: 1,  speed: 3,   score: 100,  color: '#ff0080', sides: 4, rotation: Math.PI/4 },
  triangle: { size: 25, hp: 2,  speed: 2.5, score: 150,  color: '#ff4400', sides: 3, rotation: -Math.PI/2 },
  square:   { size: 22, hp: 2,  speed: 2,   score: 120,  color: '#ffaa00', sides: 4, rotation: 0 },
  pentagon: { size: 30, hp: 4,  speed: 1.8, score: 300,  color: '#aa00ff', sides: 5, rotation: 0 },
  hexagon:  { size: 40, hp: 8,  speed: 1.2, score: 600,  color: '#00ffaa', sides: 6, rotation: 0 },
  boss:     { size: 60, hp: 200, speed: 0.8, score: 5000,  color: '#ff0000', sides: 8, rotation: 0, isBoss: true },
  boss2:    { size: 70, hp: 300, speed: 0.6, score: 10000, color: '#ff6600', sides: 7, rotation: 0, isBoss: true, spinShot: true },
  boss3:    { size: 75, hp: 400, speed: 0.5, score: 15000, color: '#00ff99', sides: 9, rotation: 0, isBoss: true, roseShot: true }
};

// ========== 游戏状态 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'start';
let gameMode = 'normal';
let score = 0;
let level = 1;
let wave = 1;
let waveTimer = 0;
let enemySpawnTimer = 0;
let currentWave = null;
let waveIndex = 0;

let player = {
  x: CONFIG.WIDTH / 2,
  y: CONFIG.HEIGHT - 100,
  size: 30,
  hp: 100,
  maxHp: 100,
  energy: 100,
  maxEnergy: 100,
  shield: 0,
  invincible: 0,      // 已废弃，统一用 invincibleTime（秒）
  invincibleTime: 0,  // 无敌剩余时间（秒）
  shooting: false,
  lastShotTime: 0,   // 上次射击时间
  shootTimer: 0,
  shootingLaser: false,
  laserEndTime: 0,    // 毫秒（激光结束时间戳）
  laserDamageTime: 0, // 上次激光伤害时间
  dodging: false,
  dodgeTimer: 0,     // 秒（闪避持续）
  slowTime: false,
  slowEndTime: 0,     // 毫秒（时缓结束时间戳）
  weaponLevel: 1
};

let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let powerups = [];

const keys = {};

// ========== 绘制函数 ==========
function drawPlayer() {
  const p = player;
  const t = Date.now() / 1000;

  ctx.save();
  ctx.translate(p.x, p.y);

  // 护盾
  if (p.shield > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, p.size + 10, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 255, 0, ${0.3 + Math.sin(t * 5) * 0.2})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20;
    ctx.stroke();
  }

  // 闪避特效
  if (p.dodging) {
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(-p.dodgeVx * (i + 1) * 5, -p.dodgeVy * (i + 1) * 5);
      ctx.globalAlpha = 0.3 - i * 0.1;
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.lineTo(-p.size * 0.8, p.size * 0.6);
      ctx.lineTo(p.size * 0.8, p.size * 0.6);
      ctx.closePath();
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;

  // 外发光层
  ctx.beginPath();
  ctx.moveTo(0, -p.size);
  ctx.lineTo(-p.size * 0.8, p.size * 0.8);
  ctx.lineTo(0, p.size * 0.4);
  ctx.lineTo(p.size * 0.8, p.size * 0.8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
  ctx.fill();
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 核心层
  ctx.beginPath();
  ctx.moveTo(0, -p.size * 0.7);
  ctx.lineTo(-p.size * 0.5, p.size * 0.5);
  ctx.lineTo(0, p.size * 0.2);
  ctx.lineTo(p.size * 0.5, p.size * 0.5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0, 200, 255, 0.3)';
  ctx.fill();

  // 机头高光
  ctx.beginPath();
  ctx.moveTo(0, -p.size);
  ctx.lineTo(-p.size * 0.2, -p.size * 0.3);
  ctx.lineTo(p.size * 0.2, -p.size * 0.3);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // 引擎火焰
  const flameSize = 8 + Math.sin(t * 20) * 4;
  ctx.beginPath();
  ctx.moveTo(-p.size * 0.3, p.size * 0.5);
  ctx.lineTo(0, p.size * 0.5 + flameSize);
  ctx.lineTo(p.size * 0.3, p.size * 0.5);
  ctx.fillStyle = `rgba(255, 0, 128, ${0.5 + Math.random() * 0.5})`;
  ctx.shadowColor = '#ff0080';
  ctx.shadowBlur = 15;
  ctx.fill();

  // 侧翼装饰
  ctx.beginPath();
  ctx.moveTo(-p.size * 0.8, p.size * 0.8);
  ctx.lineTo(-p.size * 1.2, p.size * 0.3);
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.size * 0.8, p.size * 0.8);
  ctx.lineTo(p.size * 1.2, p.size * 0.3);
  ctx.stroke();

  ctx.restore();

  // 激光
  if (p.shootingLaser) {
    ctx.save();
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
    ctx.fillRect(p.x - 8, 0, 16, p.y);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(p.x - 3, 0, 6, p.y);
    ctx.restore();
  }
}

function drawEnemy(enemy) {
  const type = ENEMY_TYPES[enemy.type];
  const t = Date.now() / 1000;

  ctx.save();
  ctx.translate(enemy.x, enemy.y);
  ctx.rotate(enemy.rotation + t * 0.5);

  ctx.shadowColor = type.color;
  ctx.shadowBlur = 15 + Math.sin(t * 3) * 5;

  // Boss外观
  if (type.isBoss) {
    // Boss外圈
    ctx.beginPath();
    for (let i = 0; i < type.sides; i++) {
      const angle = (i / type.sides) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(angle) * enemy.size;
      const py = Math.sin(angle) * enemy.size;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = type.color;
    ctx.lineWidth = 4;
    ctx.stroke();
    // 无填充，保持背景原样

    // Boss内圈（boss2用金色）
    ctx.beginPath();
    ctx.arc(0, 0, enemy.size * 0.6, 0, Math.PI * 2);
    ctx.strokeStyle = type.spinShot ? '#ffcc00' : '#ff6600';
    ctx.lineWidth = 3;
    ctx.stroke();

    // boss2 旋转炮臂
    if (type.spinShot) {
      const spinA = enemy.spinAngle || 0;
      for (let k = 0; k < 4; k++) {
        const armAngle = spinA + (k / 4) * Math.PI * 2;
        const ax = Math.cos(armAngle) * enemy.size;
        const ay = Math.sin(armAngle) * enemy.size;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(ax, ay);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ax, ay, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
    }

    // boss3 波浪光环
    if (type.roseShot) {
      for (let k = 1; k <= 3; k++) {
        const ringPhase = t * 3 - k * 0.5;
        const alpha = Math.max(0, Math.sin(ringPhase)) * 0.5;
        ctx.beginPath();
        ctx.arc(0, 0, enemy.size * 0.6 + k * 18, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 255, 153, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00ff99';
        ctx.shadowBlur = 8;
        ctx.stroke();
      }
    }

    // 核心
    ctx.beginPath();
    ctx.arc(0, 0, enemy.size * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = type.roseShot ? '#00ff99' : type.spinShot ? '#ff6600' : '#ff0000';
    ctx.shadowColor = type.roseShot ? '#00ff99' : type.spinShot ? '#ff6600' : '#ff0000';
    ctx.shadowBlur = 20;
    ctx.fill();

    // 脉冲效果
    const pulse = Math.sin(t * 5) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(0, 0, enemy.size * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    ctx.fill();
  } else {
    // 普通敌机
    ctx.beginPath();
    for (let i = 0; i < type.sides; i++) {
      const angle = (i / type.sides) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(angle) * enemy.size;
      const py = Math.sin(angle) * enemy.size;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = type.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = type.color + '22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, enemy.size * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = type.color;
    ctx.fill();
  }

  ctx.restore();

  // Boss血条
  if (type.isBoss) {
    const hpRatio = enemy.hp / enemy.maxHp;
    const barWidth = 100;
    const barHeight = 8;
    const barX = enemy.x - barWidth / 2;
    const barY = enemy.y - enemy.size - 20;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
    const hpColor = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.25 ? '#ffff00' : '#ff0000';
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
    ctx.fillStyle = '#ff0000';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    ctx.fillText('BOSS', enemy.x, barY - 8);
  }
}

function drawBullet(bullet) {
  ctx.save();
  const glow = bullet.isPlayer ? 15 : 8;
  ctx.shadowColor = bullet.color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = bullet.color;
  ctx.beginPath();
  ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(bullet.x - bullet.size/3, bullet.y - bullet.size/3, bullet.size/3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBackground() {
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
  ctx.lineWidth = 1;
  const offset = (Date.now() / 50) % 50;
  for (let y = offset; y < CONFIG.HEIGHT; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(CONFIG.WIDTH, y);
    ctx.stroke();
  }
  for (let x = 0; x < CONFIG.WIDTH; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, CONFIG.HEIGHT);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0, 255, 255, 0.03)';
  for (let y = 0; y < CONFIG.HEIGHT; y += 4) {
    ctx.fillRect(0, y, CONFIG.WIDTH, 2);
  }
}

// ========== 游戏逻辑 ==========
function spawnEnemy(type) {
  const enemyType = ENEMY_TYPES[type];
  const levelConfig = LEVELS[level - 1] || LEVELS[0];
  const speedMult = levelConfig.enemySpeedMult || 1;
  const shootMult = levelConfig.enemyShootMult || 1;

  const enemy = {
    type: type,
    x: enemyType.isBoss ? CONFIG.WIDTH / 2 : Math.random() * (CONFIG.WIDTH - 60) + 30,
    y: enemyType.isBoss ? -80 : -50,
    size: enemyType.size,
    hp: enemyType.hp,
    maxHp: enemyType.hp,
    speed: enemyType.speed * speedMult,
    score: enemyType.score,
    rotation: enemyType.rotation,
    lastShotTime: 0,
    shootInterval: enemyType.isBoss ? 1.0 * shootMult : 2.0 * shootMult, // 秒
    moveDir: 1,
    startX: enemyType.isBoss ? CONFIG.WIDTH / 2 : 0
  };

  if (enemyType.spinShot) enemy.spinAngle = 0;
  if (enemyType.roseShot)  enemy.roseAngle = 0;
  enemies.push(enemy);
}

function spawnBullet(x, y, vx, vy, isPlayer = true) {
  bullets.push({
    x, y, vx, vy,
    size: isPlayer ? 4 : 5,
    damage: isPlayer ? 1 : 10,
    color: isPlayer ? '#00ffff' : '#ff4466',
    isPlayer
  });
}

function spawnParticle(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 3 + 1,
      color: color,
      life: 1
    });
  }
}

const POWERUP_TYPES = {
  hp:     { color: '#ff0066', symbol: '+',  desc: '生命' },
  energy: { color: '#00ffff', symbol: '⚡', desc: '能量' },
  shield: { color: '#ffff00', symbol: '◆', desc: '护盾' },
  weapon: { color: '#ff00ff', symbol: '★', desc: '火力' }
};

function dropPowerup(x, y) {
  if (Math.random() > 0.3) return;
  const rand = Math.random();
  let type;
  if      (rand < 0.50) type = 'hp';
  else if (rand < 0.75) type = 'energy';
  else if (rand < 0.92) type = 'shield';
  else                  type = 'weapon';
  powerups.push({ x, y, type, size: 15, vy: 2 });
}

function dropBossPowerups(x, y) {
  // Boss 击败后掉落全部4种道具，扇形散开并下落
  const types = ['hp', 'energy', 'shield', 'weapon'];
  types.forEach((type, i) => {
    // 从 30° 到 150° 的扇形（向左下到向右下）
    const angle = (30 + i * 40) * Math.PI / 180;
    const speed = 2.5;
    powerups.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      type,
      size: 18
    });
  });
}

function drawPowerup(p) {
  const type = POWERUP_TYPES[p.type];
  ctx.save();
  ctx.shadowColor = type.color;
  ctx.shadowBlur = 10;
  ctx.fillStyle = type.color;
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(type.symbol, p.x, p.y);
  ctx.restore();
}

function updatePowerups(dt) {
  powerups.forEach(p => {
    p.x += (p.vx || 0) * dt;
    p.y += (p.vy || 0) * dt;
    // 重力：垂直速度逐渐增大，向下加速
    if (p.vy > 0) p.vy = Math.min(p.vy + 0.05 * dt, 4);
    // 水平阻力
    p.vx *= Math.pow(0.98, dt);
  });
  powerups = powerups.filter(p => p.y < CONFIG.HEIGHT + 20 && p.x > -20 && p.x < CONFIG.WIDTH + 20);

  powerups = powerups.filter(p => {
    const dx = p.x - player.x;
    const dy = p.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < player.size + p.size) {
      if (p.type === 'hp') {
        player.hp = Math.min(player.maxHp, player.hp + 1);
        spawnParticle(p.x, p.y, '#ff0066', 8);
      } else if (p.type === 'energy') {
        player.energy = Math.min(player.maxEnergy, player.energy + 30);
        spawnParticle(p.x, p.y, '#00ffff', 8);
      } else if (p.type === 'shield') {
        player.shield = Math.min(3, player.shield + 1);
        spawnParticle(p.x, p.y, '#ffff00', 8);
      } else if (p.type === 'weapon') {
        player.weaponLevel = Math.min(4, (player.weaponLevel || 1) + 1);
        spawnParticle(p.x, p.y, '#ff00ff', 12);
      }
      playSound('powerup');
      return false;
    }
    return true;
  });
}

function updatePlayer(dt, timestamp) {
  const p = player;
  const timeScale = p.slowTime ? 0.3 : 1;

  if (p.slowTime && timestamp >= p.slowEndTime) {
    p.slowTime = false;
  }

  if (!p.shootingLaser && p.energy < p.maxEnergy) p.energy += 0.1 * dt;
  if (p.invincibleTime > 0) p.invincibleTime -= dt;


  if (p.dodging) {
    p.x += p.dodgeVx * dt;
    p.y += p.dodgeVy * dt;
    p.dodgeTimer -= dt;
    if (p.dodgeTimer <= 0) p.dodging = false;
  } else {
    if (keys['ArrowLeft']  || keys['KeyA']) p.x -= CONFIG.PLAYER_SPEED * timeScale * dt;
    if (keys['ArrowRight'] || keys['KeyD']) p.x += CONFIG.PLAYER_SPEED * timeScale * dt;
    if (keys['ArrowUp']    || keys['KeyW']) p.y -= CONFIG.PLAYER_SPEED * timeScale * dt;
    if (keys['ArrowDown']  || keys['KeyS']) p.y += CONFIG.PLAYER_SPEED * timeScale * dt;
    // 移动端虚拟摇杆（摇杆偏移量归一化为方向向量）
    if (joystick.active && (joystick.dx !== 0 || joystick.dy !== 0)) {
      const speed = CONFIG.PLAYER_SPEED * timeScale;
      p.x += joystick.dx / joystick.maxDist * speed * dt;
      p.y += joystick.dy / joystick.maxDist * speed * dt;
    }
  }

  p.x = Math.max(p.size, Math.min(CONFIG.WIDTH - p.size, p.x));
  p.y = Math.max(p.size, Math.min(CONFIG.HEIGHT - p.size, p.y));

  // 射击（基于真实时间，与帧率无关）
  if (keys['KeyZ'] || keys['KeyJ']) {
    if (!p.lastShotTime) p.lastShotTime = timestamp;
    if (timestamp - p.lastShotTime >= 133) {
      p.lastShotTime = timestamp;
      const wl = p.weaponLevel || 1;
      const spread = 15;
      if (wl === 1) {
        spawnBullet(p.x, p.y - p.size, 0, -CONFIG.BULLET_SPEED);
      } else if (wl === 2) {
        spawnBullet(p.x - spread, p.y - p.size, 0, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x + spread, p.y - p.size, 0, -CONFIG.BULLET_SPEED);
      } else if (wl === 3) {
        spawnBullet(p.x, p.y - p.size, 0, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x - spread, p.y - p.size + 5, -1, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x + spread, p.y - p.size + 5, 1, -CONFIG.BULLET_SPEED);
      } else {
        spawnBullet(p.x, p.y - p.size, 0, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x - spread, p.y - p.size, -0.5, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x + spread, p.y - p.size, 0.5, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x - spread * 2, p.y - p.size, -1, -CONFIG.BULLET_SPEED);
        spawnBullet(p.x + spread * 2, p.y - p.size, 1, -CONFIG.BULLET_SPEED);
      }
      playSound('shoot');
    }
  }

  // 激光（持续时间和伤害均基于真实时间戳）
  if (p.shootingLaser) {
    if (timestamp >= p.laserEndTime) {
      p.shootingLaser = false;
    } else {
      if (!p.laserDamageTime) p.laserDamageTime = timestamp;
      if (timestamp - p.laserDamageTime >= 16.67) {
        p.laserDamageTime = timestamp;
        enemies.forEach(e => {
          if (Math.abs(e.x - p.x) < 15) {
            e.hp -= 2;
            if (Math.random() < 0.3) spawnParticle(e.x, e.y, '#ff0000', 2);
          }
        });
      }
    }
  }
}

function updateEnemies(dt, timestamp) {
  const timeScale = player.slowTime ? 0.3 : 1;

  enemies.forEach(enemy => {
    const type = ENEMY_TYPES[enemy.type];

    if (type.isBoss) {
      enemy.x += enemy.moveDir * 2 * timeScale * dt;
      enemy.y += enemy.speed * timeScale * dt;
      if (enemy.x <= enemy.size + 20 || enemy.x >= CONFIG.WIDTH - enemy.size - 20) {
        enemy.moveDir *= -1;
      }
      if (enemy.y > 120) enemy.y = 120;
      if (type.spinShot) {
        enemy.spinAngle = (enemy.spinAngle || 0) + 0.03 * timeScale * dt;
      }
      if (type.roseShot) {
        enemy.roseAngle = (enemy.roseAngle || 0) + 0.04 * timeScale * dt;
      }
    } else {
      enemy.y += enemy.speed * timeScale * dt;
    }

    // 简单模式下普通敌机不射击，Boss照常射击
    const canShoot = gameMode === 'normal' || type.isBoss;
    if (canShoot) {
      if (!enemy.lastShotTime) enemy.lastShotTime = timestamp;
      const elapsed = timestamp - enemy.lastShotTime;
      const intervalMs = enemy.shootInterval * 1000;
      if (elapsed >= intervalMs) {
        enemy.lastShotTime = timestamp;
        if (type.spinShot) {
          const baseAngle = enemy.spinAngle || 0;
          for (let k = 0; k < 8; k++) {
            const a = baseAngle + (k / 8) * Math.PI * 2;
            const speed = 5 + Math.random() * 1.5;
            enemyBullets.push({
              x: enemy.x + Math.cos(a) * enemy.size,
              y: enemy.y + Math.sin(a) * enemy.size,
              vx: Math.cos(a) * speed,
              vy: Math.sin(a) * speed,
              size: 7,
              color: '#ff6600',
              isPlayer: false
            });
          }
          enemyBullets.push({ x: enemy.x,      y: enemy.y + enemy.size, vx: 0,  vy: 5, size: 8, color: '#ff6600', isPlayer: false });
          enemyBullets.push({ x: enemy.x - 30, y: enemy.y + enemy.size, vx: -1, vy: 5, size: 6, color: '#ff6600', isPlayer: false });
          enemyBullets.push({ x: enemy.x + 30, y: enemy.y + enemy.size, vx: 1,  vy: 5, size: 6, color: '#ff6600', isPlayer: false });
        } else if (type.roseShot) {
          const baseAngle = enemy.roseAngle || 0;
          for (let k = 0; k < 5; k++) {
            const a = baseAngle + (k - 2) * 0.6;
            const speed = 4.5;
            const bx = enemy.x + Math.cos(a) * (enemy.size + 10);
            const by = enemy.y + Math.sin(a) * (enemy.size + 10);
            enemyBullets.push({
              x: bx, y: by,
              vx: Math.sin(baseAngle + k) * 2.5,
              vy: speed,
              size: 7,
              color: '#00ff99',
              isPlayer: false,
              wavePhase: baseAngle + k,
              waveTime: 0
            });
          }
        } else if (type.isBoss) {
          enemyBullets.push({ x: enemy.x,      y: enemy.y + enemy.size, vx: 0,  vy: 5, size: 8, color: '#ff4466', isPlayer: false });
          enemyBullets.push({ x: enemy.x - 30, y: enemy.y + enemy.size, vx: -1, vy: 5, size: 6, color: '#ff4466', isPlayer: false });
          enemyBullets.push({ x: enemy.x + 30, y: enemy.y + enemy.size, vx: 1,  vy: 5, size: 6, color: '#ff4466', isPlayer: false });
        } else {
          enemyBullets.push({
            x: enemy.x,
            y: enemy.y + enemy.size,
            vx: (player.x - enemy.x) * 0.02,
            vy: 4,
            size: 5,
            color: '#ff4466',
            isPlayer: false
          });
        }
      }
    }
  });

  enemies = enemies.filter(e => {
    if (ENEMY_TYPES[e.type].isBoss) return e.y < CONFIG.HEIGHT + 100;
    return e.y < CONFIG.HEIGHT + 50;
  });
}

function updateBullets(dt) {
  const timeScale = player.slowTime ? 0.3 : 1;
  bullets.forEach(b => {
    b.x += b.vx * timeScale * dt;
    b.y += b.vy * timeScale * dt;
  });
  bullets = bullets.filter(b => b.y > -10 && b.y < CONFIG.HEIGHT + 10);

  enemyBullets.forEach(b => {
    if (b.wavePhase !== undefined) {
      b.waveTime = (b.waveTime || 0) + 0.15 * dt;
      b.x += Math.sin(b.waveTime) * 2 * dt;
    }
    b.x += b.vx * timeScale * dt;
    b.y += b.vy * timeScale * dt;
  });
  enemyBullets = enemyBullets.filter(b => b.y < CONFIG.HEIGHT + 10);
}

function updateParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= 0.03 * dt;
    p.size *= Math.pow(0.97, dt);
  });
  particles = particles.filter(p => p.life > 0).slice(-200);
}

function checkCollisions() {
  const p = player;
  if (p.invincibleTime > 0 || p.invincible > 0) return;

  // 玩家子弹 vs 敌机
  bullets.forEach(bullet => {
    enemies.forEach(enemy => {
      if (enemy.hp <= 0) return;
      const dx = bullet.x - enemy.x;
      const dy = bullet.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < enemy.size * 0.8 + bullet.size) {
        enemy.hp -= bullet.damage;
        if (enemy.hp <= 0) {
          const scoreGain = Math.round(enemy.score * (gameMode === 'easy' ? 0.5 : 1));
          score += scoreGain;
          spawnParticle(enemy.x, enemy.y, ENEMY_TYPES[enemy.type].color, 15);
          playSound('explosion');
          if (ENEMY_TYPES[enemy.type].isBoss) {
            dropBossPowerups(enemy.x, enemy.y);
          } else {
            dropPowerup(enemy.x, enemy.y);
          }
        }
        spawnParticle(bullet.x, bullet.y, '#00ffff', 3);
        bullet.damage = 0;
      }
    });
  });
  bullets = bullets.filter(b => b.damage > 0);
  enemies = enemies.filter(e => e.hp > 0);

  // 敌机子弹 vs 玩家
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const bullet = enemyBullets[i];
    const dx = bullet.x - p.x;
    const dy = bullet.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < p.size * 0.7) {
      if (p.shield > 0) {
        p.shield--;
        spawnParticle(p.x, p.y, '#ffff00', 10);
        playSound('hit');
      } else {
        p.hp -= 20;
        p.weaponLevel = Math.max(1, (p.weaponLevel || 1) - 1);
        p.invincible = 0;
        p.invincibleTime = 90 / 60;  // 秒（统一用时间戳）
        playSound('hit');
      }
      enemyBullets.splice(i, 1);
    }
  }

  // 敌机 vs 玩家
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (enemy.hitPlayer) continue;
    const dx = enemy.x - p.x;
    const dy = enemy.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const collisionDist = enemy.size * 0.6 + p.size * 0.5;
    if (dist < collisionDist) {
      enemy.hitPlayer = true;
      enemies.splice(i, 1);
      spawnParticle(enemy.x, enemy.y, ENEMY_TYPES[enemy.type].color, 10);
      playSound('explosion');
      if (ENEMY_TYPES[enemy.type].isBoss) {
        dropBossPowerups(enemy.x, enemy.y);
      } else {
        dropPowerup(enemy.x, enemy.y);
      }
      if (p.shield > 0) {
        p.shield--;
        playSound('hit');
      } else {
        p.hp -= 25;
        p.weaponLevel = Math.max(1, (p.weaponLevel || 1) - 1);
        p.invincibleTime = 90 / 60;  // 秒
        playSound('hit');
      }
    }
  }
}

function updateWaves(dt, timestamp) {
  if (!currentWave) {
    if (waveIndex >= LEVELS[level - 1].waves.length) {
      levelComplete();
      return;
    }
    const waveData = LEVELS[level - 1].waves[waveIndex];
    currentWave = {
      ...waveData,
      spawnedCount: 0,
      spawnDelayMs: (waveData.spawnDelay || 30) * (1000 / 60),  // 转毫秒
      nextSpawnTime: timestamp  // 真实时间戳
    };
  }

  const enemyList = currentWave.enemies;
  const totalToSpawn = enemyList.reduce((sum, e) => sum + e.count, 0);

  if (currentWave.spawnedCount < totalToSpawn && timestamp >= currentWave.nextSpawnTime) {
    currentWave.nextSpawnTime = timestamp + currentWave.spawnDelayMs;
    let count = 0;
    for (const e of enemyList) {
      count += e.count;
      if (currentWave.spawnedCount < count) {
        spawnEnemy(e.type);
        currentWave.spawnedCount++;
        break;
      }
    }
  }

  if (currentWave.spawnedCount >= totalToSpawn && enemies.length === 0) {
    waveIndex++;
    wave = waveIndex + 1;
    currentWave = null;
  }
}

function levelComplete() {
  if (level >= LEVELS.length) {
    gameState = 'gameover';
    const screen = document.getElementById('gameOverScreen');
    screen.querySelector('h1').textContent = '任务完成！';
    screen.querySelector('h1').style.color = '#00ff88';
    screen.querySelector('.final-score').innerHTML = '最终得分：' + score;
    screen.style.display = 'flex';
    playSound('victory');
  } else {
    level++;
    waveIndex = 0;
    wave = 1;
    currentWave = null;
    enemies = [];
    enemyBullets = [];
    bullets = [];
    for (let i = 0; i < 50; i++) {
      spawnParticle(Math.random() * CONFIG.WIDTH, Math.random() * CONFIG.HEIGHT, '#00ff88', 1);
    }
  }
}

function gameOver() {
  gameState = 'gameover';
  const screen = document.getElementById('gameOverScreen');
  screen.querySelector('h1').textContent = '任务失败';
  screen.querySelector('h1').style.color = '#ff0066';
  screen.style.display = 'flex';
  document.getElementById('finalScore').textContent = '得分：' + score;
  playSound('gameover');
}

function updateUI() {
  document.getElementById('hpText').textContent = Math.max(0, Math.floor(player.hp));
  document.getElementById('hpFill').style.width = (player.hp / player.maxHp * 100) + '%';
  document.getElementById('energyText').textContent = Math.floor(player.energy);
  document.getElementById('energyFill').style.width = (player.energy / player.maxEnergy * 100) + '%';
  document.getElementById('shieldText').textContent = player.shield;
  document.getElementById('shieldFill').style.width = (player.shield / 3 * 100) + '%';
  document.getElementById('weaponText').textContent = player.weaponLevel || 1;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('levelText').textContent = level;
  document.getElementById('waveText').textContent = wave;
}

// ========== 游戏循环 ==========
let lastTime = 0;
let gameTimestamp = 0;
let currentTimestamp = 0; // 全局时间戳，keydown/游戏循环共用

function gameLoop(timestamp) {
  if (gameState !== 'playing') {
    lastTime = timestamp || performance.now();
    requestAnimationFrame(gameLoop);
    return;
  }

  const dt = lastTime ? Math.min((timestamp - lastTime) / 16.667, 3) : 1;
  lastTime = timestamp;
  gameTimestamp += dt * 16.667; // 累积游戏时间（毫秒）
  currentTimestamp = timestamp; // 同步给全局，供 keydown 使用

  if (player.hp <= 0) {
    gameOver();
    return;
  }

  updateWaves(dt, timestamp);
  updatePlayer(dt, timestamp);
  updateEnemies(dt, timestamp);
  updateBullets(dt);
  updateParticles(dt);
  updatePowerups(dt);
  checkCollisions();
  updateUI();

  // 完全不透明背景，彻底清除残留
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  drawBackground();

  bullets.forEach(drawBullet);
  enemyBullets.forEach(drawBullet);
  enemies.forEach(drawEnemy);
  powerups.forEach(drawPowerup);
  particles.forEach(drawParticle);

  if (player.invincibleTime <= 0 || Math.floor(player.invincibleTime / 0.1) % 2 === 0) {
    drawPlayer();
  }

  if (player.slowTime) {
    const alpha = 0.15 + Math.sin(Date.now() / 200) * 0.05;
    ctx.strokeStyle = `rgba(0, 200, 255, ${alpha})`;
    ctx.lineWidth = 12;
    ctx.strokeRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    const remain = Math.max(0, (player.slowEndTime - timestamp) / 1000).toFixed(1);
    ctx.save();
    ctx.fillStyle = 'rgba(0,200,255,0.8)';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 10;
    ctx.fillText(`时缓 ${remain}s`, CONFIG.WIDTH / 2, CONFIG.HEIGHT - 15);
    ctx.restore();
  }

  requestAnimationFrame(gameLoop);
}

// ========== 输入处理 ==========
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gameState !== 'playing') return;

  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    if (player.energy >= CONFIG.DODGE_COST && !player.dodging) {
      player.energy -= CONFIG.DODGE_COST;
      player.dodging = true;
      player.dodgeTimer = 15;  // 4*15=60px≈2倍机身宽
      player.invincibleTime = 20 / 60;
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
      if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
      if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
      if (keys['ArrowDown'] || keys['KeyS']) dy = 1;
      if (dx === 0 && dy === 0) dy = -1;
      const len = Math.sqrt(dx * dx + dy * dy);
      player.dodgeVx = dx / len * CONFIG.DODGE_SPEED;
      player.dodgeVy = dy / len * CONFIG.DODGE_SPEED;
      playSound('dodge');
    }
  }

  if (e.code === 'Space') {
    if (player.energy >= CONFIG.LASER_COST && !player.shootingLaser) {
      player.energy -= CONFIG.LASER_COST;
      player.shootingLaser = true;
      player.laserEndTime = currentTimestamp + CONFIG.LASER_DURATION * 1000;
      playSound('laser');
    }
  }

  if (e.code === 'KeyQ') {
    if (player.shield >= CONFIG.SLOW_COST && !player.slowTime) {
      player.shield -= CONFIG.SLOW_COST;
      player.slowTime = true;
      player.slowEndTime = currentTimestamp + CONFIG.SLOW_DURATION * 1000;
      playSound('dodge');
    }
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

// ========== 画布自适应缩放 ==========
function scaleCanvas() {
  const container = document.getElementById('gameContainer');
  // 获取实际视口（考虑移动端安全区域）
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  // 计算填满视口所需的scale（无上限，小屏缩小显示，大屏保持原始大小）
  const scaleX = maxW / 480;
  const scaleY = maxH / 720;
  const scale = Math.min(scaleX, scaleY);
  container.style.transform = `scale(${scale})`;
}

// 页面加载和窗口变化时重新缩放
window.addEventListener('resize', scaleCanvas);
scaleCanvas(); // 初始缩放

// ========== 游戏控制 ==========
function startGame() {
  scaleCanvas();
  initAudio();
  gameState = 'playing';
  score = 0;
  level = 1;
  wave = 1;
  waveIndex = 0;
  currentWave = null;

  player = {
    x: CONFIG.WIDTH / 2,
    y: CONFIG.HEIGHT - 100,
    size: 30,
    hp: 100,
    maxHp: 100,
    energy: 100,
    maxEnergy: 100,
    shield: 0,
    invincible: 0,      // 已废弃
    invincibleTime: 0,   // 秒（统一无敌计时）
    shooting: false,
    lastShotTime: 0,
    shootTimer: 0,
    shootingLaser: false,
    laserEndTime: 0,
    laserDamageTime: 0,
    dodging: false,
    dodgeTimer: 0,
    slowTime: false,
    slowEndTime: 0,
    weaponLevel: 1
  };

  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  lastTime = 0;
  gameTimestamp = 0;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';

  requestAnimationFrame(gameLoop);
}

const modeBtns = document.querySelectorAll('.mode-btn');
modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    modeBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    gameMode = btn.id === 'modeEasy' ? 'easy' : 'normal';
  });
});

document.getElementById('startBtn').addEventListener('click', () => startGame());
document.getElementById('restartBtn').addEventListener('click', () => startGame());

// ========== 移动端触摸处理 ==========
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
const btnFire = document.getElementById('btnFire');
const btnLaser = document.getElementById('btnLaser');
const btnDodge = document.getElementById('btnDodge');
const btnSlow = document.getElementById('btnSlow');

const joystick = {
  active: false,
  touchId: null,
  baseX: 60, baseY: 60,
  maxDist: 35,
  dx: 0, dy: 0  // 始终初始化，防止undefined
};

// 虚拟摇杆
joystickArea.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!joystick.active) {
    const touch = e.changedTouches[0];
    joystick.active = true;
    joystick.touchId = touch.identifier;
    joystick.baseX = 60;
    joystick.baseY = 60;
    // 触摸摇杆即自动开火
    keys['KeyZ'] = true;
  }
}, { passive: false });

joystickArea.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.touchId) {
      const rect = joystickArea.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > joystick.maxDist) {
        dx = dx / dist * joystick.maxDist;
        dy = dy / dist * joystick.maxDist;
      }
      joystick.dx = dx;
      joystick.dy = dy;
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
  }
}, { passive: false });

joystickArea.addEventListener('touchend', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.touchId) {
      joystick.active = false;
      joystick.touchId = null;
      joystick.dx = 0;
      joystick.dy = 0;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      keys['KeyZ'] = false;
    }
  }
}, { passive: false });

// 射击（长按连射）
btnFire.addEventListener('touchstart', e => {
  e.preventDefault();
  btnFire.classList.add('active');
  keys['KeyZ'] = true;
}, { passive: false });

btnFire.addEventListener('touchend', e => {
  e.preventDefault();
  btnFire.classList.remove('active');
  keys['KeyZ'] = false;
}, { passive: false });

// 激光
btnLaser.addEventListener('touchstart', e => {
  e.preventDefault();
  btnLaser.classList.add('active');
  if (gameState === 'playing' && player.energy >= CONFIG.LASER_COST && !player.shootingLaser) {
    player.energy -= CONFIG.LASER_COST;
    player.shootingLaser = true;
    player.laserEndTime = currentTimestamp + CONFIG.LASER_DURATION * 1000;
    playSound('laser');
  }
}, { passive: false });

btnLaser.addEventListener('touchend', e => {
  e.preventDefault();
  btnLaser.classList.remove('active');
}, { passive: false });

// 闪避
btnDodge.addEventListener('touchstart', e => {
  e.preventDefault();
  btnDodge.classList.add('active');
  if (gameState === 'playing' && player.energy >= CONFIG.DODGE_COST && !player.dodging) {
    player.energy -= CONFIG.DODGE_COST;
    player.dodging = true;
    player.dodgeTimer = 15;
    player.invincibleTime = 20 / 60;
    // 摇杆方向，若未使用摇杆则默认向上
    let dx = joystick.dx || 0;
    let dy = joystick.dy || -1;
    if (dx === 0 && dy === 0) dy = -1;
    const len = Math.sqrt(dx * dx + dy * dy);
    player.dodgeVx = dx / len * CONFIG.DODGE_SPEED;
    player.dodgeVy = dy / len * CONFIG.DODGE_SPEED;
    playSound('dodge');
  }
}, { passive: false });

btnDodge.addEventListener('touchend', e => {
  e.preventDefault();
  btnDodge.classList.remove('active');
}, { passive: false });

// 时缓
btnSlow.addEventListener('touchstart', e => {
  e.preventDefault();
  btnSlow.classList.add('active');
  if (gameState === 'playing' && player.shield >= CONFIG.SLOW_COST && !player.slowTime) {
    player.shield -= CONFIG.SLOW_COST;
    player.slowTime = true;
    player.slowEndTime = currentTimestamp + CONFIG.SLOW_DURATION * 1000;
    playSound('dodge');
  }
}, { passive: false });

btnSlow.addEventListener('touchend', e => {
  e.preventDefault();
  btnSlow.classList.remove('active');
}, { passive: false });
</script>
