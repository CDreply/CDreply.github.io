  scene.add(bedMesh);

  /* 水域：只覆盖饼干范围略大一圈，让底座边缘露出来形成层次。
     v1.4.0 起水面是一张 9409 顶点的直角网格（承担长波与连续暗角）+ 一张滚动的
     水纹法线贴图（承担细波光泽）；水面材质的 envMap 单独指定，不随画质档的
     env 开关关掉 —— 否则低画质档的水面会变成一块毫无反射的黑板
     （v1.3 实测就是这个毛病）。 */
  waterNdTex = makeWaterNormalMap(512);
  const watMat = new THREE.MeshStandardMaterial({
    vertexColors:true,
    color:0xffffff,
    /* v1.4.0：水面改成"以自身底色为主、反射为辅"的哑光水。
       旧版 roughness 0.26 + envMapIntensity 0.62 让反射占主导，
       反射里带的是天空的水平渐变 —— 低角度看正好是一条条横向亮带。
       现在提粗糙度、降反射，让上面那套"连续暗角"的颜色说了算。 */
    roughness:0.42, metalness:0.0,
    transparent:true, opacity:0.94,
    normalMap:waterNdTex,
    normalScale:new THREE.Vector2(0.20, 0.20),   // 与 mid 档对齐，避免"调档前/后"观感跳变
    envMap:skyRT.texture,
    envMapIntensity:0.32
  });
  waterMesh = new THREE.Mesh(buildWaterSurface(), watMat);
  waterMesh.position.y = SEA_Y;
  waterMesh.renderOrder = 2;
  /* 水面不接收阴影 —— v1.3 的"水面一块块正方形"就是这么来的：
     1024 的阴影贴图铺在 1200 单位上（约 1.17 单位/texel），
     地形投在水上的影子被量化成一个个方块。水面本来就极平、法线一致，
     对这点块状伪影毫无遮掩，所以特别刺眼。 */
  waterMesh.receiveShadow = false;
  waterMesh.visible = showWater;
  scene.add(waterMesh);

  /* v1.4.0：删掉水体侧壁圆柱。
     旧方案是"水面一张网格 + 侧壁一张圆柱"，两张独立几何在接缝处
     颜色与法线都不连续，斜看就是一条硬边；而且圆柱顶面（y=+2）比水面（y=0）
     还高一截，本身就是"水边一圈深色块"。水体厚度改由「水面半透明 +
     下面的深色底板」表达，少一张网格就少一处接缝。 */
  waterSide = null;

  fragGroup = new THREE.Group();     scene.add(fragGroup);
  terrainGroup = new THREE.Group();  scene.add(terrainGroup);

  const ringGeo = new THREE.RingGeometry(0.86, 1.0, 64);
  ringGeo.rotateX(-Math.PI/2);
  ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color:0xffcf80, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false
  }));
  ringMesh.visible = false;
  scene.add(ringMesh);

  // 画质档位必须在光源/水面/环境贴图都建好之后才应用
  applyQuality(START_TIER);

  window.addEventListener('resize', onResize);
}
function onResize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  if(!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  needsDraw = true;        // 尺寸变了必须重画（按需渲染下不会自动补帧）
}

/* ══════════════════════════════════════════════════════════
   七、重建 3D 场景
   ══════════════════════════════════════════════════════════ */
const fragMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.90, metalness:0.0, flatShading:true
});
/* 阴影脏标记：几何 / 可见性 / 物体变换发生改变时调一次。
   （three 渲染完会自动把 needsUpdate 复位，所以每次都重设即可。） */
function touchShadow(){
  if(renderer && renderer.shadowMap) renderer.shadowMap.needsUpdate = true;
  needsDraw = true;
}
function disposeGroup(g){
  g.traverse(o=>{
    if(o.isMesh && o.geometry) o.geometry.dispose();
    if(o.isCSS2DObject && o.element && o.element.parentNode) o.element.parentNode.removeChild(o.element);
  });
  while(g.children.length){
    const c = g.children[0];
    g.remove(c);
    if(c.element && c.element.parentNode) c.element.parentNode.removeChild(c.element);
  }
}
/* ── 观赏态碎块合批（v1.2）──
   进入 map 阶段后：不能捶击、不能吃板块、漂移滑块已锁（pickAt 在非 cookie 阶段
   直接返回 null），也就是说几十个碎块的位置与形状都冻住了。
   既然如此，就没必要让它们保持几十个独立 mesh —— 每个 mesh 每帧一次 draw call，
   投射阴影的话还要在深度图里再画一次。
   合并成一个 mesh 后：draw call 与阴影物体数都从数十降到 1。
   碎块的颜色本来就逐顶点烘焙在 color 属性里（外皮色 / 内芯色 / 地貌色都在顶点上），
   所以合批只是「按各自世界矩阵变换顶点后首尾相接」，不需要任何贴图或图集。
   任何会让碎块重新动起来的操作（新饼干 / 撤销 / 吃板块 / 重建）都会先走
   rebuildFragments()，那里会把 fragMerged 置空并重新拆成独立 mesh。 */
let fragMerged = null;
function mergeFragments(){
  if(fragMerged || S.phase !== 'map') return;
  const list = fragGroup.children.filter(o=>o.isMesh && o.geometry);
  if(list.length < 3) return;
  const pos = [], col = [];
  const v = new THREE.Vector3();
  for(const m of list){
    m.updateMatrix();
    const P = m.geometry.attributes.position.array;
    const C = m.geometry.attributes.color.array;
    for(let i=0;i<P.length;i+=3){
      v.set(P[i], P[i+1], P[i+2]).applyMatrix4(m.matrix);
      pos.push(v.x, v.y, v.z);
      col.push(C[i], C[i+1], C[i+2]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();      // 非索引几何 → 每个面独立法线，平面着色质感不变
  g.computeBoundingSphere();
  const m = new THREE.Mesh(g, fragMat);
  m.castShadow = showShadow; m.receiveShadow = true;
  m.userData.kind = 'fragMerged';
  m.userData.fragCount = list.length;
  disposeGroup(fragGroup);
  fragGroup.add(m);
  for(const fr of S.fragments) fr.mesh = null;
  fragMerged = m;
  touchShadow();
}
function rebuildFragments(){
  fragMerged = null;     // 拆回独立 mesh（原有合并 mesh 由 disposeGroup 回收）
  disposeGroup(fragGroup);
  for(const fr of S.fragments){
    const geo = buildFragmentGeometry(fr);
    if(!geo){ fr.mesh = null; continue; }
    const m = new THREE.Mesh(geo, fragMat);
    m.castShadow = showShadow; m.receiveShadow = true;
    m.userData.fragId = fr.id;
    applyFragmentTransform(m, fr);
    fragGroup.add(m);
    fr.mesh = m;
  }
  touchShadow();         // 几何重建 → 阴影必须重画
}
function driftSink(fr){
  if(S.driftAmp<=0) return 0;
  const k = S.driftAmp/120;
  const ratio = fr.area / S.cookieArea;
  const low = fr.isLake ? 0 : Math.max(0, 1 - Math.pow(ratio, 0.30));
  return -k*(4 + low*30);
}
function applyFragmentTransform(mesh, fr){
  const off = fr.offset || [0,0];
  mesh.position.set(off[0], driftSink(fr), off[1]);
  if(S.driftAmp>0){
    const dx = fr.centroid[0]-cookieC[0], dy = fr.centroid[1]-cookieC[1];
    const l = Math.hypot(dx,dy)||1;
    mesh.rotation.z = -(dy/l) * 0.055 * (S.driftAmp/120);
    mesh.rotation.x =  (dx/l) * 0.055 * (S.driftAmp/120);
  } else mesh.rotation.set(0,0,0);
}
function applyToggles(){
  /* 阴影要同时受「显示开关」与「画质档位」约束：
     低档为了省性能是强制不投影的（shadow:false）。v1.1 这里是无条件
     lightDir.castShadow = showShadow，于是任何一次 applyToggles()（切显示开关、
     重建地形）都会把低档刚关掉的阴影又打开 —— 低档等于白降。 */
  lightDir.castShadow = showShadow && !!(QUALITY[curTier] && QUALITY[curTier].shadow);
  fragGroup.traverse(o=>{ if(o.isMesh) o.castShadow = showShadow && !!(QUALITY[curTier] && QUALITY[curTier].shadow); });
  if(waterMesh) waterMesh.visible = showWater;
  if(waterSide) waterSide.visible = showWater;   // v1.4.0 起为 null，保留判空
  terrainGroup.traverse(o=>{
    if(o.isMesh){
      if(o.userData.kind==='mount' || o.userData.kind==='tree') o.visible = showMount;
      if(o.userData.kind==='riverband' || o.userData.kind==='reef') o.visible = showWater;
    }
    if(o.isCSS2DObject) o.visible = showLabel;
  });
  if(labelRenderer) labelRenderer.domElement.style.display = showLabel ? '' : 'none';
  touchShadow();         // 阴影投射者变了（山体/水面/碎块显隐）→ 重画
}

/* ══════════════════════════════════════════════════════════
   八、地形构建：山体 / 河流 / 标注
   ══════════════════════════════════════════════════════════ */
const rockMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.86, metalness:0.02, flatShading:true,
  side:THREE.DoubleSide   // v1.3：地形物含台地/火口/礁盘等"内外壁混排"的面，
                          // 逐一校绕序太脆；总量才一万多个三角形，双面代价可忽略
});
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function pushTri(pos, col, a, b, c, color){
  pos.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
  for(let i=0;i<3;i++) col.push(color.r, color.g, color.b);
}
function lerp3(a, b, t){
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
/* ── 通用山体：一个函数覆盖 尖峰 / 圆丘 / 火山锥 三种形态 ──
   形态靠参数调，不靠三份复制代码：
     tipW      山顶水平偏移幅度（越大越"歪头"，丘陵用 0.34）
     radiusMul 山脚半径的随机区间（宽扁 or 尖锐）
     snowLine  雪线位置（0~1，相对山高；null = 不积雪）
     footMul   山脚深埋比例 —— 埋浅了山脚与地面之间会露缝 → 看着就是浮空 */
function addPeakBody(pos, col, o){
  const seg = o.seg || (5 + ((rng()*3)|0));
  const x = o.x, z = o.z, baseYv = o.baseY, height = o.h, radius = o.r;
  const tipW = o.tipW === undefined ? 0.22 : o.tipW;
  const rm = o.radiusMul || [0.88, 1.32];   // v1.3：山脚放宽一点，免得峰像立着的刀
  const apex = [x + rand(-radius*tipW, radius*tipW), baseYv + height, z + rand(-radius*tipW, radius*tipW)];
  const foot = baseYv - Math.max(o.footMin === undefined ? 10 : o.footMin, height*(o.footMul || 0.45));
  const rim = [];
  for(let i=0;i<seg;i++){
    const a = i/seg*Math.PI*2 + rand(-0.14,0.14);
    const rr = radius * rand(rm[0], rm[1]);
    rim.push([x + Math.cos(a)*rr, baseYv - rand(height*0.04, height*0.16), z + Math.sin(a)*rr]);
  }
  const cBase = new THREE.Color(o.baseCol);
  const cRock = new THREE.Color(o.rockCol);
  const cSnow = o.snowCol != null ? new THREE.Color(o.snowCol) : null;
  const snowAt = (o.snowLine != null) ? baseYv + height*o.snowLine : 0;
  const cTmp = new THREE.Color();
  for(let i=0;i<seg;i++){
    const p0 = rim[i], p1 = rim[(i+1)%seg];
    pushTri(pos, col, p0, apex, p1, cRock);
    /* 雪：v1.2 是 midY > snowLine 硬切，会切出一条笔直的白线；
       v1.3 改成按高度平滑混合 —— 同一座山各面雪线不一致，像真的。 */
    if(cSnow){
      const midY = (apex[1] + p0[1] + p1[1])/3;
      const k = Math.max(0, Math.min(1, (midY - snowAt)/(height*0.32) + 0.55));
      if(k > 0.03){
        cTmp.copy(cRock).lerp(cSnow, k);
        const t = 0.40 + k*0.12;
        pushTri(pos, col, lerp3(p0, apex, t), apex, lerp3(p1, apex, t), cTmp);
      }
    }
    pushTri(pos, col, p0, p1, [x, foot, z], cBase);
  }
}
function addMountain(pos, col, x, z, baseYv, height, radius, tint){
  addPeakBody(pos, col, { x, z, baseY:baseYv, h:height, r:radius,
    baseCol: tint, rockCol: 0x7a6550, snowCol: 0xe6e2d8, snowLine: 0.58 });
}
/* 丘陵：矮、宽、顶歪 —— 不是缩小版的尖山，否则一地图都是锥子 */
function addHill(pos, col, x, z, baseYv, height, radius, tint){
  addPeakBody(pos, col, { x, z, baseY:baseYv, h:height, r:radius,
    seg: 6 + ((rng()*3)|0), tipW: 0.34, radiusMul:[0.70, 1.42],
    baseCol: tint, rockCol: HILL_COLOR, snowCol: null,
    footMul: 0.72, footMin: 5 });
}
/* 台地：平顶 + 近乎垂直的侧壁 —— 高原主体、以及"陡崖"的视觉载体 */
function addMesa(pos, col, x, z, baseYv, height, radius, tintTop, tintCliff){
  const seg = 7 + ((rng()*4)|0);
  const topR = radius * rand(0.50, 0.78);
  const topY = baseYv + height;
  const topPts = [];
  for(let i=0;i<seg;i++){
    const a = i/seg*Math.PI*2 + rand(-0.14,0.14);
    topPts.push([x + Math.cos(a)*topR*rand(0.82,1.20), topY + rand(-height*0.06, height*0.06),
                 z + Math.sin(a)*topR*rand(0.82,1.20)]);
  }
  const cTop   = new THREE.Color(tintTop);
  const cWall  = new THREE.Color(tintCliff);
  const cWallD = cWall.clone().multiplyScalar(0.58);   // 崖根更暗：廉价 AO
  const foot = baseYv - Math.max(10, height*0.55);
  for(let i=0;i<seg;i++){
    const a = topPts[i], b = topPts[(i+1)%seg];
    pushTri(pos, col, [x, topY, z], a, b, cTop);                       // 平顶
    const ab = [a[0], foot, a[2]], bb = [b[0], foot, b[2]];
    pushTri(pos, col, a, b, bb, cWall);                                // 崖面上段
    pushTri(pos, col, a, bb, ab, cWallD);                              // 崖面下段
  }
}
/* 火山：锥体 + 放射脊 + 火口 + 熔岩池 */
function addVolcano(pos, col, x, z, baseYv, height, radius, tint){
  const seg = 10;
  const rimY = baseYv + height;
  const craterR = Math.max(3, radius*0.26);
  const rim = [], footPts = [];
  for(let i=0;i<seg;i++){
    const a = i/seg*Math.PI*2;
    rim.push([x + Math.cos(a)*craterR*rand(0.85,1.15), rimY + rand(-height*0.05, height*0.05),
              z + Math.sin(a)*craterR*rand(0.85,1.15)]);
    const rr = radius*rand(0.80, 1.20);
    footPts.push([x + Math.cos(a+rand(-0.18,0.18))*rr, baseYv - rand(height*0.05, height*0.16),
                  z + Math.sin(a+rand(-0.18,0.18))*rr]);
  }
  const foot = baseYv - Math.max(12, height*0.50);
  const cRock = new THREE.Color(VOLCANO_ROCK);
  const cBase = new THREE.Color(tint);
  const cIn   = new THREE.Color(0x392b27);
  const cLava = new THREE.Color(VOLCANO_LAVA);
  for(let i=0;i<seg;i++){
    const p0 = footPts[i], p1 = footPts[(i+1)%seg];
    pushTri(pos, col, p0, rim[i], p1, cRock);
    pushTri(pos, col, p1, rim[i], rim[(i+1)%seg], cRock);
    pushTri(pos, col, p0, p1, [x, foot, z], cBase);
  }
  const bot = [x, rimY - height*0.30, z];
  for(let i=0;i<seg;i++) pushTri(pos, col, rim[i], rim[(i+1)%seg], bot, cIn);   // 口内壁
  for(let i=0;i<seg;i++){                                                       // 熔岩池
    const a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2, r2 = craterR*0.58;
    pushTri(pos, col, [x, bot[1]+0.8, z],
      [x+Math.cos(a0)*r2, bot[1]+0.8, z+Math.sin(a0)*r2],
      [x+Math.cos(a1)*r2, bot[1]+0.8, z+Math.sin(a1)*r2], cLava);
  }
}
/* 珊瑚礁：水面之下的浅色礁盘（半透明水体下能透出颜色） */
function addReef(pos, col, x, z, radius, tint){
  const seg = 6 + ((rng()*3)|0);
  const y = SEA_Y - 2.4;
  const c = new THREE.Color(tint);
  const pts = [];
  for(let i=0;i<seg;i++){
    const a = i/seg*Math.PI*2;
    pts.push([x+Math.cos(a)*radius*rand(0.65,1.3), y + rand(-0.5,0.5), z+Math.sin(a)*radius*rand(0.65,1.3)]);
  }
  for(let i=0;i<seg;i++) pushTri(pos, col, [x,y,z], pts[i], pts[(i+1)%seg], c);
}
/* 取碎块渲染表面的采样数据（惰性构建；poly 被漂移烘焙后自动失效重算） */
function fragSurf(fr){
  if(fr._surfPoly !== fr.poly || !fr._surfPts){
    const prep = prepPolygon(fr.poly, fr.edgeFlags);
    if(!prep) return false;
    const ys = new Array(prep.pts.length);
    for(let i=0;i<prep.pts.length;i++) ys[i] = topYAt(prep.pts[i], fr);
    fr._surfPts = prep.pts; fr._surfFaces = prep.faces; fr._surfYs = ys; fr._surfPoly = fr.poly;
  }
  return true;
}
/* 点 p 处【顶面网格】的真实高度：按重心坐标插值所在三角形 */
function surfaceYAt(p, fr){
  if(!fragSurf(fr)) return topYAt(p, fr);
  const pts = fr._surfPts, faces = fr._surfFaces, ys = fr._surfYs;
  for(let k=0;k<faces.length;k++){
    const f = faces[k];
    const a = pts[f[0]], b = pts[f[1]], c = pts[f[2]];
    const d = (b[1]-c[1])*(a[0]-c[0]) + (c[0]-b[0])*(a[1]-c[1]);
    if(d > -1e-9 && d < 1e-9) continue;
    const w0 = ((b[1]-c[1])*(p[0]-c[0]) + (c[0]-b[0])*(p[1]-c[1]))/d;
    const w1 = ((c[1]-a[1])*(p[0]-c[0]) + (a[0]-c[0])*(p[1]-c[1]))/d;
    const w2 = 1 - w0 - w1;
    if(w0 >= -0.01 && w1 >= -0.01 && w2 >= -0.01){
      return ys[f[0]]*w0 + ys[f[1]]*w1 + ys[f[2]]*w2;
    }
  }
  return topYAt(p, fr);
}
/* 点 p 到碎块边界的最短距离：用来夹紧山体半径，别让山脚探到崖外 */
function edgeGap(x, y, fr){
  if(!fragSurf(fr)) return 1e9;
  const pts = fr._surfPts;
  let best = 1e9;
  for(let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    const vx = b[0]-a[0], vy = b[1]-a[1];
    const wx = x-a[0],  wy = y-a[1];
    const L2 = vx*vx + vy*vy || 1e-9;
    let t = (wx*vx + wy*vy)/L2; t = t<0?0:(t>1?1:t);
    const dx = wx - vx*t, dy = wy - vy*t;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d < best) best = d;
  }
  return best;
}
function fragmentAt(x, y){
  for(const fr of S.fragments){
    if(fr.isLake) continue;
    if(pointInPoly([x,y], fr.poly)) return fr;
  }
  return null;
}
/* 给山脊点挑宿主：山脊点常同时贴在多块板块的边界上，要挑"沿法线朝内能走最深"的
   那一侧 + 那一块。返回 {fr, reach, nx, ny}；两侧都走不通则返回 null。 */
function bestRidgeHost(p, nrx, nry){
  let best = null;
  for(let s=1; s>=-1; s-=2){
    const ax = nrx*s, ay = nry*s;
    const probe = [p[0] + ax*0.6, p[1] + ay*0.6];      // 抬离边界一点再投射
    for(const fr of S.fragments){
      if(fr.isLake) continue;
      if(!pointInPoly(probe, fr.poly)) continue;
      const ex = rayExit(probe, [ax, ay], fr.poly);
      const reach = ex ? Math.hypot(ex[0]-probe[0], ex[1]-probe[1]) + 0.6 : 0;
      if(!best || reach > best.reach) best = { fr, reach, nx: ax, ny: ay };
    }
  }
  return best;
}

/* ══════════════════════════════════════════════════════════
   v1.3 地形分类：把「海拔 + 起伏 + 面积 + 邻接」读成地形类型
   ══════════════════════════════════════════════════════════ */
/* 板块内的顶面起伏度：随机撒点，算 topYAt 的标准差。
   这是"高原"和"山脉"唯一的分界线 —— 一样高，但山脉皱、高原平。 */
function landStats(fr){
  const bb = bounds2(fr.poly);
  let n=0, s=0, s2=0;
  for(let i=0;i<70 && n<18;i++){
    const p = [rand(bb[0],bb[2]), rand(bb[1],bb[3])];
    if(!pointInPoly(p, fr.poly)) continue;
    const y = topYAt(p, fr);
    s += y; s2 += y*y; n++;
  }
  const avg = n ? s/n : fr.topY;
  const sd  = n>1 ? Math.sqrt(Math.max(0, s2/n - avg*avg)) : 0;
  return { avg, sd };
}
/* 起伏度归一化基准：domel + 噪声的典型量级（改立体化参数时跟着变） */
function roughScale(fr){ return Math.max(6, fr.dome*0.42 + fr.noiseAmp*0.55); }

function classifyLandforms(){
  const lands = S.fragments.filter(f=>!f.isLake);
  if(!lands.length) return;
  const byId = new Map(S.fragments.map(f=>[f.id, f]));
  let lo=1e9, hi=-1e9;
  for(const f of lands){ if(f.topY<lo)lo=f.topY; if(f.topY>hi)hi=f.topY; }
  const span = Math.max(1, hi-lo);

  // ① 每块地量三个数：海拔、起伏、比邻居低多少
  for(const fr of lands){
    const st = landStats(fr);
    fr.sd = st.sd;
    fr.rough = st.sd / roughScale(fr);
    fr.relH = (fr.topY - lo)/span;
    let ah=0, an=0;
    for(const id of fr.adj){ const o = byId.get(id); if(o && !o.isLake){ ah += o.topY; an++; } }
    fr.sunk = ((an ? ah/an : fr.topY) - fr.topY) / span;   // 相对邻居的下沉量
  }
  /* ② 用【世界内排名】而不是绝对阈值 —— 这是 v1.3 最关键的一处修正。
     起伏度 sd 的量级会随噪声种子在 4~12 之间整体浮动：
       世界 #1/#2 的 sd 全在 4~7，世界 #3 却在 6~12。
     写死绝对阈值（早先版本是 rough>0.62 才算丘陵），换个种子就会出现
     "满图高原、一座山都没有、火山 0 座"的极端结果（已实测复现）。
     改成在同一个世界内部横向排名，任何一次生成都能分出层次。 */
  const minArea = S.cookieArea*0.010;
  const rankOf = get=>{
    const list = lands.filter(f=>f.area >= minArea);
    list.sort((a,b)=>get(a)-get(b));
    const m = new Map();
    list.forEach((f,i)=>m.set(f.id, list.length>1 ? i/(list.length-1) : 0.5));
    return m;
  };
  const rRel = rankOf(f=>f.relH), rRgh = rankOf(f=>f.rough);

  // ③ 火山名额：海拔排名最高、起伏也够、面积够大的头一两块才有资格
  let vBudget = 0;
  for(const f of lands.slice().sort((a,b)=>b.relH-a.relH)){
    if(vBudget>=2) break;
    const rl = rRel.get(f.id), rg = rRgh.get(f.id);
    if(rl!==undefined && rl>=0.80 && rg>=0.40 && f.area > S.cookieArea*0.015) vBudget++;
  }

  for(const fr of lands){
    const rl = rRel.get(fr.id), rg = rRgh.get(fr.id);
    let lf;
    if(rl === undefined)                        lf = '岛屿';   // 碎得太小，不参与排名
    else if(vBudget>0 && rl>=0.84 && rg>=0.42){ lf = '火山'; vBudget--; }
    else if(rl>=0.68 && rg>=0.55)               lf = '山脉';
    else if(rl>=0.52 && rg<0.58)                lf = '高原';
    else if(fr.sunk > 0.16 && rl < 0.55)        lf = '盆地';
    else if(rg>=0.70)                           lf = '丘陵';
    else if(rl<=0.38)                           lf = '平原';
    else if(rg>=0.45)                           lf = '丘陵';
    else                                        lf = '平原';
    fr.landform = lf;
  }
  S._lfRank = { rRel, rRgh, minArea };
}
/* 板块内取一个"落得下地貌物"的点：离边界要有 margin 的空地 */
function siteIn(fr, margin){
  const bb = bounds2(fr.poly);
  for(let i=0;i<50;i++){
    const p = [rand(bb[0],bb[2]), rand(bb[1],bb[3])];
    if(!pointInPoly(p, fr.poly)) continue;
    if(edgeGap(p[0], p[1], fr) < margin) continue;
    return p;
  }
  return null;
}

function buildLandforms(){
  /* 只在成图阶段生成地貌。cookie 阶段的"一整块饼干"没有任何地形含义，
     若放行，`fr.landform` 还是 undefined 会落到默认的"丘陵"分支，
     整块饼干上就会长出丘陵 —— v1.3 发布首日实测到的就是这么来的。 */
  if(S.phase !== 'map') return null;
  const pos = [], col = [];
  const lands = S.fragments.filter(f=>!f.isLake);
  if(!lands.length && !S.mountains.length) return null;
  const biggest = Math.max.apply(null, S.fragments.map(f=>f.area).concat([1]));
  const stat = { 火山:0, 山脉:0, 高原:0, 丘陵:0, 盆地:0, 平原:0, 岛屿:0 };
  const cnt  = { mesa:0, hill:0, peak:0 };

  /* ── A. 板块自身的性格地形 ──
     一句话概括这套分配：山脉沿断口长峰，高原铺台地，丘陵撒圆丘，
     盆地围一圈、中间留空，平原几乎不放东西（"平"本身就是它的特征）。 */
  for(const fr of lands){
    const lf = fr.landform || '丘陵';
    stat[lf] = (stat[lf]||0) + 1;
    const ratio = Math.min(1, fr.area/biggest);
    const tint  = (fr.biome && BIOME_COLORS[fr.biome]) ? BIOME_COLORS[fr.biome] : 0xa28c62;
    const lfT  = (LANDFORM[lf] || {}).tint || 0x8d7950;
    const rough = fr.rough || 0.5;
    const areaK = Math.min(1, fr.area/S.cookieArea*8);     // 小岛少放东西

    if(lf === '火山'){
      const c = surfaceYAt(fr.centroid, fr);
      const rad = Math.max(12, Math.min(24, fr.maxR*0.34));
      addVolcano(pos, col, fr.centroid[0]-CX, fr.centroid[1]-CY, c-2, rad*1.8, rad, lfT);
      cnt.peak++;
      for(let i=0;i<3;i++){                                  // 山脚散落的低矮熔岩丘
        const a = rand(0,Math.PI*2), d = rad*rand(1.5,2.6);
        const p = [fr.centroid[0]+Math.cos(a)*d, fr.centroid[1]+Math.sin(a)*d];
        if(!pointInPoly(p, fr.poly) || edgeGap(p[0],p[1],fr) < 8) continue;
        addHill(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5, 4+rand(0,5), 8+rand(0,6), VOLCANO_ROCK);
        cnt.hill++;
      }
    }
    else if(lf === '高原'){
      /* 高原 = 顶面本来就高，再铺一层平顶台地 —— 垂直的台壁就是"陡崖"。
         台地数量刻意收着放（上限 4 个）：铺满了就不是高原而是"梯田"。 */
      const n = Math.max(1, Math.min(2, Math.round(1 + fr.area/S.cookieArea*8)));
      const rad0 = Math.max(13, Math.min(30, fr.maxR*0.24));
      for(let i=0;i<n;i++){
        const p = siteIn(fr, rad0*0.9);
        if(!p) continue;
        const rad = rad0*rand(0.75,1.25);
        const h = 4 + rough*8 + rand(0,4);
        addMesa(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-2, h, rad, MESA_TOP, MESA_CLIFF);
        cnt.mesa++;
      }
      // 高原上常有一两座拔地而起的孤立高峰，是全图的视觉锚点
      const mn = fr.area > S.cookieArea*0.05 ? 2 : 1;
      for(let i=0;i<mn;i++){
        const p = siteIn(fr, 18);
        if(!p) continue;
        addMountain(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5,
                    15 + rough*20*rand(0.8,1.2), 10 + rand(0,8), tint);
        cnt.peak++;
      }
    }
    else if(lf === '山脉'){
      /* 山脉的主体交给 B 段（沿山脊线的尖峰），这里只补几座山脚孤峰 */
      const n = Math.round(1 + ratio*3);
      for(let i=0;i<n;i++){
        const p = siteIn(fr, 16);
        if(!p) continue;
        const rad = 10 + rand(0,12);
        addMountain(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5,
                    14 + rough*22*rand(0.7,1.25), rad, tint);
        cnt.peak++;
      }
    }
    else if(lf === '盆地'){
      /* 盆地：沿内缘围一圈丘陵，中心留空 —— 视觉上自然读成"凹地" */
      const ring = 7 + Math.round(areaK*5);
      const rr = fr.maxR*rand(0.62, 0.80);
      for(let i=0;i<ring;i++){
        const a = i/ring*Math.PI*2 + rand(-0.2,0.2);
        const p = [fr.centroid[0]+Math.cos(a)*rr, fr.centroid[1]+Math.sin(a)*rr];
        if(!pointInPoly(p, fr.poly) || edgeGap(p[0],p[1],fr) < 7) continue;
        addHill(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5, 4+rough*8+rand(0,4), 10+rand(0,8), lfT);
        cnt.hill++;
      }
    }
    else if(lf === '丘陵'){
      /* 一簇一簇地长：真实丘陵是成片的缓岗，不是均匀撒芝麻。
         簇内 3~6 座挨着，簇与簇之间留出平地，地表色块才不会被切碎。 */
      const clusters = Math.max(1, Math.min(3, Math.round(1 + areaK*2.4)));
      for(let c=0;c<clusters;c++){
        const c0 = siteIn(fr, 18);
        if(!c0) continue;
        const n = 3 + ((rng()*4)|0);
        for(let i=0;i<n;i++){
          const a = rand(0, Math.PI*2), d = rand(0, 24);
          const p = [c0[0]+Math.cos(a)*d, c0[1]+Math.sin(a)*d];
          if(!pointInPoly(p, fr.poly) || edgeGap(p[0],p[1],fr) < 7) continue;
          addHill(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5,
                  4 + rough*9 + rand(0,4), 8 + rand(0,9), lfT);
          cnt.hill++;
        }
      }
    }
    else if(lf === '平原'){
      const n = Math.round(areaK*1.2);           // 平原就该空 —— 最多几座矮丘
      for(let i=0;i<n;i++){
        const p = siteIn(fr, 12);
        if(!p) continue;
        addHill(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5, 3+rand(0,4), 7+rand(0,6), lfT);
        cnt.hill++;
      }
    }
    else {   // 岛屿
      const n = fr.area > S.cookieArea*0.004 ? 2 : 1;
      for(let i=0;i<n;i++){
        const p = siteIn(fr, 6);
        if(!p) continue;
        addHill(pos, col, p[0]-CX, p[1]-CY, surfaceYAt(p,fr)-1.5,
                4 + rough*8 + rand(0,4), Math.max(6, fr.maxR*0.38), lfT);
        cnt.hill++;
      }
    }
  }

  /* ── B. 山脊峰：沿"山脉"型裂纹的脊线摆峰 ──
     山脊线本来就是断裂线＝两侧板块的内岸。山峰直接骑在岸线上，山脚有近一半会
     探到崖外悬空 —— 这才是"山脉浮空"的主因。改法：沿山脊法线朝板块内侧退让
     （退让深度＝朝内射线打到对岸边界的距离），再把直径收进这段空间。
     注意 ①：不能用"到最近边界的距离"夹 —— 山脊自身就在边界上，那距离恒为 0，
     会把所有山压成小土包（已实测踩过这个坑）。
     注意 ②：p 通常同时贴在好几块板块的边界上，必须挑"朝内能走最深"的那块当宿主。
     v1.3 变化：峰密度调稀（/15 → /9）、峰态随宿主地形变（山脉→尖峰，高原→台地，
     其余→缓丘），这样山脊不再是清一色锥子。 */
  const mntStat = { points:0, inset:0, dropped:0, reachSum:0, radMin:0, radMax:0, radSum:0 };
  for(const m of S.mountains){
    const pts = m.pts;
    if(!pts || pts.length<2) continue;
    const step = Math.max(1, Math.round(pts.length / 6));
    const H = 20 + m.width*6 * (m.ring?0.5:1);
    for(let i=0;i<pts.length;i+=step){
      const p = pts[i];
      const prevP = pts[Math.max(0, i-1)], nextP = pts[Math.min(pts.length-1, i+1)];
      let tgx = nextP[0]-prevP[0], tgy = nextP[1]-prevP[1];
      const tgl = Math.hypot(tgx,tgy) || 1; tgx /= tgl; tgy /= tgl;
      const nrx = -tgy, nry = tgx;                       // 山脊法线（两侧都试）
      const host = bestRidgeHost(p, nrx, nry);
      mntStat.points++;
      if(!host){ mntStat.dropped++; continue; }
      const fr = host.fr, reach = host.reach;
      mntStat.reachSum += reach;
      if(reach < 11){ mntStat.dropped++; continue; }   // 内侧太窄，放山必然出界
      const ratio = Math.min(1, fr.area/biggest);
      const h = H * (0.55 + ratio*0.75) * rand(0.72, 1.28);
      const tint = (fr.biome && BIOME_COLORS[fr.biome]) ? BIOME_COLORS[fr.biome] : 0xa28c62;
      const want = 18 + ratio*22 + rand(0,6);
      const mv  = (reach - 2) * 0.5;                   // 摆在可用空间正中
      const rad = Math.max(6, Math.min(want, mv));
      const hh  = h * (0.55 + 0.45 * (rad / want));    // 山小了也矮一点，保持比例
      const mp  = [p[0] + host.nx*mv, p[1] + host.ny*mv];
      mntStat.inset += mv;
      if(!mntStat.radMin || rad < mntStat.radMin) mntStat.radMin = rad;
      if(rad > mntStat.radMax) mntStat.radMax = rad;
      mntStat.radSum += rad;
      const base = surfaceYAt(mp, fr) - 1.5;    // 用渲染表面高度，不用解析曲面
      const lf = fr.landform || '丘陵';
      if(lf==='高原'){                          // 高原上的"山脊"是断崖台地，不是尖峰
        addMesa(pos, col, mp[0]-CX, mp[1]-CY, base, hh*0.55, rad*0.95, MESA_TOP, MESA_CLIFF);
        cnt.mesa++;
      } else if(lf==='山脉' || lf==='火山'){
        addMountain(pos, col, mp[0]-CX, mp[1]-CY, base, hh, rad, tint);
        cnt.peak++;
      } else {                                  // 缓丘地带：山脊只是"坡"
        addHill(pos, col, mp[0]-CX, mp[1]-CY, base, hh*0.55, rad*1.15,
                (LANDFORM[lf]||{}).tint || 0x8d7950);
        cnt.hill++;
      }
    }
    if(m.ring){
      const c = centroid(pts);
      const fr = fragmentAt(c[0], c[1]);
      if(fr && pointInPoly(c, fr.poly)){
        for(let k=0;k<10;k++){
          const a = k/10*Math.PI*2, dx = Math.cos(a), dy = Math.sin(a);
          // 环山同样收进板块：环半径按该方向的可达深度缩，免得整圈悬在崖外
          const ex = rayExit(c, [dx,dy], fr.poly);
          const reach = ex ? Math.hypot(ex[0]-c[0], ex[1]-c[1]) : 0;
          const rr = Math.max(11, Math.min(52, reach*0.60));
          const px2 = c[0] + dx*rr, py2 = c[1] + dy*rr;
          const rad = Math.max(5, Math.min(11, rr*0.5));
          addMountain(pos, col, px2-CX, py2-CY, surfaceYAt([px2,py2], fr)-1.5, 24+rand(0,12), rad, 0x7a6550);
          cnt.peak++;
        }
      }
    }
  }

  if(!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, rockMat);
  mesh.castShadow = showShadow; mesh.receiveShadow = true;
  mesh.userData.kind = 'mount';
  const placed = mntStat.points - mntStat.dropped;
  mntStat.avgInset = placed ? +(mntStat.inset/placed).toFixed(1) : 0;
  mntStat.avgReach = mntStat.points ? +(mntStat.reachSum/mntStat.points).toFixed(1) : 0;
  mntStat.radMin = +mntStat.radMin.toFixed(1);
  mntStat.radMax = +mntStat.radMax.toFixed(1);
  mntStat.avgRad = placed ? +(mntStat.radSum/placed).toFixed(1) : 0;
  delete mntStat.radSum;
  mntStat.landforms = stat;
  mntStat.parts = cnt;
  mesh.userData.mntStat = mntStat;
  return mesh;
}
/* 河谷岸肩：把河"嵌"进地里 —— 峡谷两侧各铺一条向外倾斜的岩岸 */
function addBank(pos, col, p, q, y0, y1, nx, ny, side, wIn, wOut, rise, c, baseY){
  /* v1.3.6：峡谷崖岸重写。原版三处叠加，做出了一块"水边 45 单位高的棕色挡板"：
     ① 颜色是纯棕 0x6d583d；② 外缘高度 = y0 + rise，而 y0 取的是【板块顶面】高度
     （实测常 30~40，水面才 0），再加 rise 后到 45；
     ③ 三角形按 (a,b,c2)/(a,c2,d) 推进，法线朝向随河道走向翻转，
        外侧被背面剔除，看着像"缺了一块片"。
     现在：崖岸只从【水线】往上抬一个小台阶，颜色取岩灰而不是纯棕，
     并给顶点逐段微抖动让边缘不是一条直边。 */
  const inX = nx*wIn*side, inY = ny*wIn*side;
  const ouX = nx*wOut*side, ouY = ny*wOut*side;
  /* 崖岸从"水线略上方"起算，而不是从板块顶面起算 —— 这是棕块高矮的关键。
     最多抬 3.5 单位，做成河边的一道矮坎，而不是立在水边的一堵墙。 */
  const bY = (baseY === undefined) ? y0 : baseY;
  const h = Math.min(3.5, rise*0.22);
  const a  = [p[0]-CX+inX,  bY,        p[1]-CY+inY];
  const b  = [q[0]-CX+inX,  bY,        q[1]-CY+inY];
  const c2 = [q[0]-CX+ouX,  bY+h,      q[1]-CY+ouY];
  const d  = [p[0]-CX+ouX,  bY+h,      p[1]-CY+ouY];
  pushTri(pos, col, a, b, c2, c);
  pushTri(pos, col, a, c2, d, c);
}
function buildRivers(){
  if(S.phase !== 'map') return null;   // cookie 阶段没有河流，守一句更稳
  const pos = [], col = [];
  /* v1.3.6：原为 0x6d583d（RGB 109,88,61）—— 一个纯棕色。
     它铺在蓝水旁边，"水两边的棕块"就是它。改成偏冷的岩灰，
     与水面色调同族，视作河床岩石而不是泥岸。 */
  const cW = new THREE.Color(0x4a4a46);
  for(const r of S.rivers){
    const pts = r.pts;
    if(!pts || pts.length<2) continue;
    const gorge = (r.kind === 'gorge');
    const halfW = 2.6 + r.width*0.9;
    for(let i=0;i<pts.length-1;i++){
      const p = pts[i], q = pts[i+1];
      const fr = fragmentAt(p[0], p[1]) || fragmentAt(q[0], q[1]);
      if(!fr) continue;
      const y0 = surfaceYAt(p, fr)+0.8, y1 = surfaceYAt(q, fr)+0.8;
      /* v1.2 是按 x 轴左右偏移 —— 河道斜着走时河宽会跟着变。
         v1.3 改成沿路径法线偏移，河宽处处一致。 */
      let dx = q[0]-p[0], dy = q[1]-p[1];
      const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
      const nx = -dy, ny = dx;
      const a=[p[0]-CX+nx*halfW, y0, p[1]-CY+ny*halfW], b=[q[0]-CX+nx*halfW, y1, q[1]-CY+ny*halfW];
      const c=[q[0]-CX-nx*halfW, y1, q[1]-CY-ny*halfW], d=[p[0]-CX-nx*halfW, y0, p[1]-CY-ny*halfW];
      _c1.setHex(gorge ? 0x2f7ba6 : 0x3d86b8);
      pushTri(pos, col, a, b, c, _c1); pushTri(pos, col, a, c, d, _c1);
      if(gorge){    // 峡谷：两岸做成"嵌在岩石里的一道缝"的矮坎
        const rise = 6 + r.width*1.9;
        /* 崖岸基准取【该处水线】：水面 0 与板块顶面之间取低者再抬一点，
           保证河岸永远贴着水，不会因为板块顶面高就飘上去。 */
        const bankBase = Math.min(y0, y1, (y0+y1)*0.5) ;
        const baseY = Math.max(SEA_Y + 0.4, bankBase - 1.2);
        /* 岸宽也收一收：halfW+9 在宽峡谷上会摊出去一大片。 */
        const wOut = halfW + 5;
        addBank(pos, col, p, q, y0, y1, nx, ny,  1, halfW, wOut, rise, cW, baseY);
        addBank(pos, col, p, q, y0, y1, nx, ny, -1, halfW, wOut, rise, cW, baseY);
      }
    }
  }
  if(!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  /* v1.4.0：roughness 0.20 → 0.42。0.20 是 v1.3.1 旧水面的高光泽值，
     在 v1.4.0 水面改哑光（0.42）之后就成了"河里比海里亮一截"的不一致 ——
     河面与海面同族，粗糙度必须跟海水对齐，否则同一屏里两种水光。 */
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.42, metalness:0.0, transparent:true, opacity:0.92, side:THREE.DoubleSide
  }));
  mesh.userData.kind = 'riverband';
  return mesh;
}
/* ── 珊瑚礁：热带浅海里的礁盘 ──
   只长在暖水小岛四周、且必须落回水里（压到陆地就跳过）。 */
function buildReefs(){
  if(S.phase !== 'map') return null;
  const pos = [], col = [];
  S.reefSpots = [];
  /* 珊瑚礁要"稀有"才像珊瑚礁：只在最暖的少数几座小岛外缘长，
     全图控制在 4 座岛 / 十来处礁盘以内。 */
  const lat = f=>Math.abs(f.centroid[1]-cookieC[1])/R;
  let cands = S.fragments.filter(f=>!f.isLake && f.area < S.cookieArea*0.05);
  if(!cands.length) cands = S.fragments.filter(f=>!f.isLake);   // 兜底：全是大块也得有礁
  const hosts = cands.sort((a,b)=>(lat(a)-lat(b)) || (b.area-a.area)).slice(0, 4);
  for(const fr of hosts){
    const n = 2 + ((rng()*2)|0);
    for(let i=0;i<n;i++){
      const a = rand(0, Math.PI*2);
      const dx = Math.cos(a), dy = Math.sin(a);
      /* 从质心朝这个方向打到岸线，再从岸线【向外】量一段 ——
         早先是直接"质心 + 15~41"，而小岛自身半径常常只有十几，
         这个点还在陆地上，于是整局的礁盘都被"压到陆地就跳过"否掉了
         （实测三局里有两局珊瑚礁挂零）。 */
      const ex = rayExit(fr.centroid, [dx,dy], fr.poly);
      if(!ex) continue;
      const d = 16 + rng()*26;
      const px = ex[0] + dx*d, py = ex[1] + dy*d;
      let onLand = false;
      for(const o of S.fragments){ if(!o.isLake && pointInPoly([px,py], o.poly)){ onLand = true; break; } }
      if(onLand) continue;
      addReef(pos, col, px-CX, py-CY, 4 + rng()*5, pick(REEF_COLORS));
      S.reefSpots.push([px, py]);
    }
  }
  if(!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.55, metalness:0.0, transparent:true, opacity:0.92,
    side:THREE.DoubleSide
  }));
  mesh.userData.kind = 'reef';
  return mesh;
}
function buildLabels(){
  const mk = (x, y, z, text, cls)=>{
    const d = document.createElement('div');
    d.className = 'lbl' + (cls ? ' ' + cls : '');
    d.textContent = text;
    const o = new CSS2DObject(d);
    o.position.set(x, y, z);
    return o;
  };
  for(const a of S.archipelagos){
    let ty = -1e9;
    for(const id of a.members){ const f = S.fragments.find(x=>x.id===id); if(f) ty = Math.max(ty, f.topY); }
    if(ty>-1e8) terrainGroup.add(mk(a.cx-CX, ty+36, a.cy-CY, '🏝 ' + a.name));
  }
  for(const fr of S.fragments){
    if(!fr.name || fr.arch) continue;
    /* v1.3：碎得特别小的地块不再单独挂名（远景会糊成一片）。
       它们仍出现在右侧「区域列表」与描述文本里，信息不丢。 */
    if(fr.area < S.cookieArea*0.014 && fr.landform !== '火山') continue;
    terrainGroup.add(mk(fr.centroid[0]-CX, fr.topY + fr.dome + 34, fr.centroid[1]-CY, (fr.isLake?'💧 ':'') + fr.name));
  }
  for(const p of S.pois){
    const fr = S.fragments.find(x=>x.id===p.frag);
    if(!fr) continue;
    terrainGroup.add(mk(p.pos[0]-CX, surfaceYAt(p.pos, fr)+10, p.pos[1]-CY, '● ' + p.name, 'poi'));
  }
  /* v1.3：地理实体标注（海峡 / 海湾 / 峡谷 / 珊瑚礁 / 火山 / 陡崖 …） */
  for(const g of (S.geoLabels || [])){
    terrainGroup.add(mk(g.x-CX, g.y, g.z-CY, g.text, 'geo' + (g.sub ? ' sub' : '')));
  }
  /* 珊瑚礁名由 buildReefs 实测出的礁盘位置反推（水下的东西不好标，只标一处） */
  const rs = S.reefSpots || [];
  if(rs.length){
    if(!S.reefName) S.reefName = uniqName(()=>pick(REEF_A)+'珊瑚礁');
    terrainGroup.add(mk(rs[0][0]-CX, SEA_Y + 20, rs[0][1]-CY, '🪸 ' + S.reefName, 'geo sub'));
  }
}
function buildTerrain(){
  disposeGroup(terrainGroup);
  const lo = buildLandforms(); if(lo) terrainGroup.add(lo);
  const ri = buildRivers();    if(ri) terrainGroup.add(ri);
  const rf = buildReefs();     if(rf) terrainGroup.add(rf);
  if(S.phase==='map') buildLabels();
  applyToggles();
}

/* ══════════════════════════════════════════════════════════
   九、捶击与碎裂（算法照搬 v1.9，输出端改接 3D）
   ══════════════════════════════════════════════════════════ */
function currentOffset(fr, now){
  if(fr.animT0!=null && fr.animFrom){
    const t=(now-fr.animT0)/fr.animDur;
    if(t>=1){ fr.animT0=null; return fr.offset; }
    const e=1-Math.pow(1-Math.max(0,t),3);
    return [fr.animFrom[0]+(fr.offset[0]-fr.animFrom[0])*e, fr.animFrom[1]+(fr.offset[1]-fr.animFrom[1])*e];
  }
  return fr.offset;
}
const SHAPE_KEYS = ['round','square','triangle','hexagon','rhombus','octagon','star'];
function newCookie(newSeed){
  if(newSeed!==undefined && !isNaN(newSeed)) seed = newSeed|0;
  rng = mulberry32(seed);
  S.phase='cookie'; S.fragments=[]; S.cracks=[];
  S.smashCount=0; S.epicenter=null; S.driftAmp=0; S.worldName='';
  S.mountains=[]; S.rivers=[]; S.lakes=[]; S.pois=[]; S.archipelagos=[];
  S.geoLabels=[]; S.reefSpots=[]; S.reefName=null;
  // 复位开场动效的残留（上一局可能停在动画中途）
  growT0 = 0; lightT0 = 0;
  if(terrainGroup) terrainGroup.scale.set(1,1,1);
  if(lightDir){ lightDir.intensity = BASE_LIGHT; lightRim.intensity = BASE_RIM; }
  if(labelsEl) labelsEl.classList.remove('ready');
  charging=false; charge=0;
  undoStack.length = 0;
  fragId = 0;
  // 始终消耗一次 rng，保证「同种子→同世界」不受是否自选形状影响
  const rolledShape = SHAPE_KEYS[Math.floor(rng()*SHAPE_KEYS.length)];
  S.shape = (shapePick !== 'random' && SHAPES[shapePick]) ? shapePick : rolledShape;
  const poly = cookiePoly(S.shape);
  S.cookieArea = Math.abs(signedArea(poly));
  S.cookieR = R * ((SHAPES[S.shape] || SHAPES.round).r);
  const first = makeFragment(poly, null);
  first.edgeFlags = new Array(poly.length).fill(false);   // 整块饼干：全部是外皮
  S.fragments.push(first);
  const dl = document.getElementById('drift');
  dl.value = 0; dl.disabled = false;
  document.getElementById('driftVal').textContent = '关';
  S.eatMode = false; S.eatCount = 0;
  document.getElementById('btnEat').classList.remove('on');
  document.getElementById('seedIn').value = seed;
  document.getElementById('descText').value = '';
  document.getElementById('btnCopy').disabled = true;
  document.getElementById('btnShot').disabled = true;
  document.getElementById('regionList').innerHTML = '<small style="color:#6a5a40">完成生成后显示</small>';
  buildTerrain();
  rebuildFragments();
  addLog(shapeLabel() + '饼干已上桌' + (shapePick !== 'random' ? '（自选形状）' : '') + '，种子 #' + seed);
  setHint('按住饼干蓄力，松手落锤');
  updateButtons();
}
function smash(px, py, f){
  if(S.phase!=='cookie') return;
  const now = performance.now();
  const brutal = document.getElementById('btnBrutal').classList.contains('on');
  if(brutal) f = Math.max(f, 0.45);
  const idx = S.fragments.findIndex(fr=>{
    const off = currentOffset(fr, now);
    return pointInPoly([px-off[0], py-off[1]], fr.poly);
  });
  if(idx<0) return;
  if(S.driftAmp>0){
    applyDrift(0);
    document.getElementById('drift').value=0;
    document.getElementById('driftVal').textContent='关';
    if(!brutal) addLog('漂移已复位，重新开砸');
  }
  undoStack.push(structuredClone({
    fragments:S.fragments.map(fr=>({...fr, adj:[...fr.adj], mesh:null})),
    cracks:S.cracks, smashCount:S.smashCount, epicenter:S.epicenter
  }));
  if(undoStack.length>20) undoStack.shift();

  S.smashCount++;
  if(!S.epicenter) S.epicenter=[px,py];
  const frag = S.fragments[idx];
  const fragR = Math.sqrt(frag.area/Math.PI);

  let splitN = 0;
  const decoOnly = !brutal && f<0.25 && rng()<0.5;
  if(decoOnly){
    const n = f<0.12 ? 1 : 2;
    for(let i=0;i<n;i++){
      const a = rand(0, Math.PI*2);
      const exit = rayExit([px,py], [Math.cos(a),Math.sin(a)], frag.poly);
      if(!exit) continue;
      const t = Math.max(0.3, f/0.25*0.8);
      const end = [px+(exit[0]-px)*t, py+(exit[1]-py)*t];
      S.cracks.push({ pts:midDisplace([px,py], end, 4, 0.2), width:1+f*3, through:false, deco:true, kind:'', fragId:frag.id });
    }
  } else {
    let K_in  = f<0.25 ? 1+((rng()*2)|0) : Math.round(1+f*8);
    let K_out = f<0.25 ? 1+((rng()*2)|0) : Math.round(2+f*7);
    if(brutal){ K_in = Math.round(K_in*1.4)+1; K_out = Math.round(K_out*1.4); }
    const r_in = fragR*(0.12 + f*0.3);
    const sites = [];
    for(let i=0;i<K_in*3 && sites.length<K_in && sites.length<34;i++){
      const a = rand(0,Math.PI*2), rr = r_in*Math.sqrt(rng());
      const p = [px+Math.cos(a)*rr, py+Math.sin(a)*rr];
      if(pointInPoly(p, frag.poly)) sites.push(p);
    }
    const bb = bounds2(frag.poly);
    let tries = 0;
    while(sites.length < K_in+K_out && sites.length<34 && tries<400){
      tries++;
      const p = [rand(bb[0],bb[2]), rand(bb[1],bb[3])];
      if(!pointInPoly(p, frag.poly)) continue;
      if(dist(p,[px,py]) < r_in*0.7) continue;
      let ok = true;
      for(const s of sites){ if(dist(p,s) < fragR*0.16){ ok=false; break; } }
      if(ok) sites.push(p);
    }
    if(sites.length>=2){
      const cells = voronoiCells(frag.poly, sites);
      const built = buildPieces(cells);
      const childOf = [];
      built.polys.forEach((poly,i)=>{
        if(poly.length<3 || Math.abs(signedArea(poly))<15){ childOf.push(null); return; }
        childOf.push(makeFragment(poly, built.edgeFlags[i]));
      });
      const children = childOf.filter(Boolean);
      if(children.length>=2){
        built.edgeMap.forEach(e=>{
          if(!e.interior) return;
          const c1 = childOf[e.cells[0]], c2 = childOf[e.cells[1]];
          /* c1 !== c2 这层保护是 v1.3 补的：edgeMap 的边是按坐标 toFixed(1) 去重的，
             同一个碎块里两条挨得极近的边可能被并成一条，于是 c1 与 c2 是同一块 ——
             那样会在邻接表里留下自己邻接自己（描述文本里就会写成「XX 邻接：XX」）。 */
          if(c1 && c2 && c1 !== c2){ c1.adj.add(c2.id); c2.adj.add(c1.id); }
          const mid = e.pts[(e.pts.length/2)|0];
          const dP = dist(mid, [px,py]);
          S.cracks.push({
            pts: e.pts,
            width: 0.8 + f*2.4 * (dP < r_in*1.6 ? 1.5 : 1),
            through:true, kind:'', deco:false,
            frags: [c1 && c1.id, c2 && c2.id].filter(Boolean)
          });
        });
        S.fragments.splice(idx, 1, ...children);
        splitN = children.length;
      } else {
        const a0 = rand(0, Math.PI*2);
        const ex0 = rayExit([px,py], [Math.cos(a0),Math.sin(a0)], frag.poly);
        if(ex0) S.cracks.push({ pts:midDisplace([px,py], ex0, 4, 0.2), width:1+f*3, through:false, deco:true, kind:'', fragId:frag.id });
      }
    }
  }

  if(brutal && splitN>0){
    const amp = Math.min(60, 10 + f*44);
    const t0 = performance.now();
    for(const fr of S.fragments){ fr.animFrom = currentOffset(fr, t0).slice(); }
    applyDrift(amp);
    for(const fr of S.fragments){ fr.animT0 = t0; fr.animDur = 520 + rand(0,260); }
    document.getElementById('drift').value = Math.round(amp);
    document.getElementById('driftVal').textContent = Math.round(amp);
    shake = 8 + f*20;
  } else {
    shake = 4 + f*14;
  }
  crackSound(brutal ? Math.min(1, f*1.25+0.1) : f);
  spawnRing(px, py, f);
  rebuildFragments();
  addLog('第' + S.smashCount + '锤 · 力度 ' + Math.round(f*100) + (brutal?'% · 🔥暴力' : '%') + ' · ' +
    (splitN ? '碎成 ' + splitN + ' 块' : (decoOnly ? '留下浅痕' : '砸出裂纹')) +
    '（共 ' + S.fragments.length + ' 块）');
  updateButtons();
}
function undo(){
  if(S.phase!=='cookie' || !undoStack.length) return;
  const st = undoStack.pop();
  S.fragments = st.fragments.map(fr=>({...fr, adj:new Set(fr.adj), animT0:null, animFrom:null, mesh:null}));
  S.cracks = st.cracks; S.smashCount = st.smashCount; S.epicenter = st.epicenter;
  rebuildFragments();
  addLog('撤销上一锤');
  updateButtons();
}
function applyDrift(amp){
  S.driftAmp = amp;
  const c = S.epicenter || cookieC;
  for(const fr of S.fragments){
    const dx = fr.centroid[0]-c[0], dy = fr.centroid[1]-c[1];
    const len = Math.hypot(dx,dy) || 1;
    fr.offset = [dx/len*amp*fr.jitter, dy/len*amp*fr.jitter];
  }
  for(const fr of S.fragments) if(fr.mesh) applyFragmentTransform(fr.mesh, fr);
  touchShadow();         // 漂移整批移动 → 阴影跟随
}
function crackOwner(c){
  if(c.fragId){ const fr = S.fragments.find(f=>f.id===c.fragId); if(fr) return fr; }
  if(c.frags && c.frags.length){
    const cc = centroid(c.pts);
    let best=null, bd=1e18;
    for(const id of c.frags){
      const fr = S.fragments.find(f=>f.id===id);
      if(!fr) continue;
      const d2 = (cc[0]-fr.centroid[0])*(cc[0]-fr.centroid[0]) + (cc[1]-fr.centroid[1])*(cc[1]-fr.centroid[1]);
      if(d2 < bd){ bd = d2; best = fr; }
    }
    if(best) return best;
  }
  return null;
}
function bakeDrift(){
  const now = performance.now();
  const offs = {};
  for(const fr of S.fragments) offs[fr.id] = currentOffset(fr, now);
  const crackOff = [];
  for(const c of S.cracks){
    let owner = crackOwner(c);
    if(!owner){
      const cc = centroid(c.pts);
      let bd = 1e18;
      for(const fr of S.fragments){
        if(pointInPoly(cc, fr.poly)){ owner = fr; break; }
        const d2 = (cc[0]-fr.centroid[0])*(cc[0]-fr.centroid[0]) + (cc[1]-fr.centroid[1])*(cc[1]-fr.centroid[1]);
        if(d2 < bd){ bd = d2; owner = fr; }
      }
    }
    crackOff.push(owner ? offs[owner.id] : [0,0]);
  }
  for(const fr of S.fragments){
    const o = offs[fr.id];
    if(o[0] || o[1]){
      fr.poly = fr.poly.map(p=>[p[0]+o[0], p[1]+o[1]]);
      fr.centroid = [fr.centroid[0]+o[0], fr.centroid[1]+o[1]];
    }
    fr.offset = [0,0]; fr.animT0 = null; fr.animFrom = null;
  }
  S.cracks.forEach((c,i)=>{
    const o = crackOff[i];
    if(o && (o[0]||o[1])) c.pts = c.pts.map(p=>[p[0]+o[0], p[1]+o[1]]);
  });
}
/* 🍽 吃板块 */
function eatFragment(id){
  if(S.phase!=='cookie') return;
  const idx = S.fragments.findIndex(f=>f.id===id);
  if(idx<0) return;
  if(S.fragments.length<=1){ addLog('最后一块，吃不得'); return; }
  S.fragments.splice(idx,1);
  for(const c of S.cracks) if(c.frags) c.frags = c.frags.filter(x=>x!==id);
  S.cracks = S.cracks.filter(c=>{
    if(c.fragId===id) return false;
    if(c.frags && !c.frags.length) return false;
    return true;
  });
  S.eatCount++;
  eatSound(2);
  rebuildFragments();
  addLog('🍽 吃掉一块（已吃 ' + S.eatCount + ' 块，剩 ' + S.fragments.length + ' 块）');
}

/* ── v1.3 按地形类型分派命名后缀：同样叫"苍澜"，是高原还是平原得看得出来 ── */
const LAND_SUF = {

  '丘陵': { a:[], b:['丘陵','坡地','缓岗','丘原'] },
  '盆地': { a:[], b:['盆地','凹地','盆原','内海之盆'] },
  '平原': { a:[], b:['平原','沃野','大川','原野'] },
  '岛屿': { a:[], b:['半岛','岛','之地'] }
};
const VAL_A = ['回音','幽篁','藏风','落雁','鸣沙','寒潭','软语','眠云','青萝','叠翠'];
const GORGE_A = ['裂齿','一线','断魂','龙骨','惊雷','黑水','刀劈','石喉'];
const STRAIT_A = ['锁喉','扼浪','风喉','窄门','断帆','望火','白浪'];
const BAY_A = ['月牙','明珠','静波','藏舟','琥珀','听潮','暖沙'];
const REEF_A = ['碎珊瑚','碧珠','琉璃','翡翠','星砂','玉带','斑斓'];
const GEO_DESC = {
  '海峡': ['两片大陆之间最窄的一段水路，风急浪高，历来是兵家必争之地。','两侧陆地隔水相望，晴天能看清对岸的炊烟。'],
  '海湾': ['凹进陆地的弧形水域，风浪被挡住，是天然的避风锚地。','湾内水色由碧转靛，岸边沙质细软，商船在此补给淡水。'],
  '峡谷': ['河流花了千万年把高原切开的一道深缝，谷壁近乎垂直。','谷底终年不见正午阳光，风声在石壁间来回撞击。'],
  '山谷': ['两侧山脊之间舒缓的谷地，泥土被流水带来，格外肥沃。','谷中晨雾很重，太阳升起后要一个时辰才散。'],
  '陡崖': ['断层抬升留下的断崖，崖面笔直如墙，绳降而下要半日。','崖顶风大，崖下是老鹰的巢，人迹罕至。'],
  '沙滩': ['珊瑚与贝壳被海浪磨碎后堆成的白沙滩，赤脚踩上去发烫。','退潮时露出的浅滩上遍布小蟹与潮池，孩子能玩上一整天。'],
  '珊瑚礁': ['水下的珊瑚丛林，鱼群如云，船只必须绕行。','退潮时礁盘会露出一角，像海面上一串散落的碧玉。'],
  '火山': ['仍在冒烟的火口山，夜里能看见山脊上蜿蜒的赤色熔流。','火山灰覆盖的坡地寸草不生，却肥得让周边平原五谷丰登。'],
  '群岛': ['散布在浅海上的岛链，岛与岛之间由渔船踩出的水道相连。']
};
const POI_DESC = {
  '首都': ['临水而筑的王城，商队与阴谋在此交汇。','九衢通达的帝都，晨钟一响万户开。','宫城依势而建，城中夜市灯火相传三百年不熄。','王庭高踞台地，四方使节在此觐见，也在此密谋。'],
  '城镇': ['以物产闻名的集镇，旅人歇脚之地。','酒香远飘十里的酿酒小镇，客栈永远满员。','铁匠铺比民居还多的边镇，马蹄铁声昼夜不绝。','每逢集日，山民与船商在此以物易物，人声鼎沸。'],
  '遗迹': ['上古文明的残垣，传说埋着失落的秘宝。','半截没入土中的石像群，面孔已被风雨磨平。','碑文无人能识的环形石阵，月圆之夜据说会低鸣。','坍塌的观星台，穹顶星图与今夜星空竟无一重合。'],
  '港口': ['千帆云集之地，异域货物与流言一同上岸。','灯塔彻夜不熄的深水良港，水手的天堂与坟场。','潮间带上的浮动市集，涨潮开市、退潮散场。','走私者与税吏斗智斗勇的自由港，规矩就是没有规矩。'],
  '关隘': ['两山夹峙的一线天，一夫当关，万夫莫开。','峡谷间唯一的栈道咽喉，商队过境必交买路钱。','雪线上唯一的隘口，每年只有四个月可以通行。'],
  '奇观': ['夜半泛光的浅湖，渔民视作龙宫灯火。','风蚀千百年形成的石笋林，风吹过时如万笛齐鸣。','间歇喷涌的热泉谷，雾气中常有虹影浮现。','孤峰拔地千仞，峰顶终年云雾，无人登顶而还。']
};
const usedNames = new Set();
function uniqName(gen){ let n='', k=0; do{ n=gen(); k++; }while(usedNames.has(n) && k<30); usedNames.add(n); return n; }
function pickNameB(a){ let b = pick(NAME_B), k = 0; while(b===a && k++<12) b = pick(NAME_B); return b; }
function assignBiome(fr){
  const lat = (cookieC[1] - fr.centroid[1]) / R;
  const r = rng();
  if(lat > 0.55) return '雪原';
  if(lat < -0.55) return r<0.6 ? '沙漠' : '草原';
  if(lat > 0.25) return r<0.35 ? '雪原' : (r<0.75 ? '森林' : '草甸');
  if(lat < -0.25) return r<0.4 ? '沙漠' : (r<0.75 ? '草原' : '草甸');
  return pick(['草甸','草原','森林','荒原']);
}
function randPointIn(fr){
  const bb = bounds2(fr.poly);
  for(let i=0;i<60;i++){
    const p=[rand(bb[0],bb[2]), rand(bb[1],bb[3])];
    if(pointInPoly(p, fr.poly)) return p;
  }
  return fr.centroid;
}
function finalize(){
  if(S.phase==='map') return;
  if(S.driftAmp>0) bakeDrift();
  S.phase = 'map';
  document.getElementById('drift').disabled = true;
  S.eatMode = false;
  document.getElementById('btnEat').classList.remove('on');
  usedNames.clear();
  const cookieArea = S.cookieArea;

  /* ── ① 先定板块（湖泊 / 气候 / 立体参数）──
     v1.3 把这一步提到最前：地形分类要用到每块的高度与起伏，
     而这些要等 fractureAll() 算完才有。 */
  S.lakes = []; S.archipelagos = []; S.geoLabels = []; S.reefSpots = [];
  const frags = S.fragments.slice().sort((a,b)=>b.area-a.area);
  for(const fr of S.fragments){
    const interior = fr.poly.every(p => Math.hypot(p[0]-cookieC[0], p[1]-cookieC[1]) < R*0.97);
    fr.isLake = interior && fr.area < cookieArea*0.01 && S.driftAmp === 0;
    fr.arch = null; fr.name = null; fr.landform = null;
    if(fr.isLake){ fr.name = uniqName(()=>pick(RIV_A)+'湖'); S.lakes.push(fr); continue; }
    fr.biome = assignBiome(fr);
  }
  fractureAll();
  classifyLandforms();          // ← 地形类型在这里定下（山脉 / 高原 / 丘陵 / 平原 / 盆地 / 火山 / 岛屿）

  /* ── ② 裂纹定性格 ──
     v1.2 是一刀切「宽度前 40% 的裂纹算山脉」—— 满地图都是山。
     v1.3 改由"宿主板块的性格"说了算：只有长在 山脉 / 火山 / 高原 上的裂纹
     才有资格成为山脊，而且总额封顶（约 22%）。山脉一下就稀缺了，
     省出来的名额分给 峡谷 与 河流 —— 地貌花样这才出得来。 */
  const byId = new Map(S.fragments.map(f=>[f.id, f]));
  const crackHosts = c=>{
    const out = [];
    if(c.frags) for(const id of c.frags){ const f = byId.get(id); if(f && !f.isLake) out.push(f); }
    if(!out.length){
      const cc = centroid(c.pts);
      const f = fragmentAt(cc[0], cc[1]);
      if(f && !f.isLake) out.push(f);
    }
    return out;
  };
  const RIDGE_W = { '山脉':1.0, '火山':0.9, '高原':0.7 };
  const cand = S.cracks.slice().sort((a,b)=>b.width-a.width);
  let ridgeQuota = Math.max(2, Math.round(cand.length * 0.15));
  S.mountains = []; S.rivers = [];
  for(const c of cand){
    if(c.kind) continue;
    const hs = crackHosts(c);
    let w = 0;
    for(const f of hs) w = Math.max(w, RIDGE_W[f.landform] || 0);
    if(w > 0 && ridgeQuota > 0){ c.kind = 'mountain'; ridgeQuota--; }
  }
  /* 峡谷也改成按【宽度排名】定比例，而不是"width > 2.5 就抽签"。
     后者在猛砸（力度 0.9）时会失控：那会儿几乎所有裂纹的 width 都到了 3~4，
     一局能出 25 条峡谷（实测占裂纹 42%），比河流还多。
     现在固定取非山脉裂纹里最宽的前 15%，上限 8 条。 */
  const restC = cand.filter(c=>!c.kind).sort((a,b)=>b.width-a.width);
  const gorgeN = Math.min(8, Math.max(1, Math.round(restC.length * 0.15)));
  restC.forEach((c,i)=>{ c.kind = i < gorgeN ? 'gorge' : 'river'; });
  for(const c of cand){
    if(c.kind==='river' && c.deco) c.pts = midDisplace(c.pts[0], c.pts[c.pts.length-1], 5, 0.26);
    (c.kind==='mountain' ? S.mountains : S.rivers).push(c);
  }
  S.mountains.sort((a,b)=>b.width-a.width);
  S.mountains.forEach((m,i)=>{ m.major = m.ring || i < Math.min(6, Math.ceil(S.mountains.length*0.6)); });
  S.rivers.sort((a,b)=>b.pts.length-a.pts.length);
  S.rivers.forEach((r,i)=>{ r.major = i<8; });
  for(const m of S.mountains){
    if(m.ring) m.name = uniqName(()=>pick(['陨落','天坠','落星','炽焰','环日','坠辉']) + '环山');
    else if(m.major) m.name = uniqName(()=>pick(MNT_A) + pick(['山脉','岭','山脊']));
  }
  for(const r of S.rivers) if(r.major) r.name = uniqName(()=>pick(RIV_A) + pick(['河','江','溪']));

  const islets = S.fragments.filter(f=>!f.isLake && f.area < cookieArea*0.01);
  const compOf = new Map(); const comps = [];
  for(const f of islets){
    if(compOf.has(f.id)) continue;
    const members = [f]; compOf.set(f.id, comps.length);
    const stack = [f];
    while(stack.length){
      const cur = stack.pop();
      for(const oid of cur.adj){
        if(compOf.has(oid)) continue;
        const o = islets.find(x=>x.id===oid);
        if(o){ compOf.set(oid, comps.length); members.push(o); stack.push(o); }
      }
    }
    comps.push(members);
  }
  for(const members of comps){
    if(members.length < 2) continue;
    const aName = uniqName(()=>pick(ARCH_A)+pick(['群岛','群岛','列岛','诸屿']));
    let area = 0, cx = 0, cy = 0, big = members[0];
    for(const m of members){
      m.arch = aName;
      area += m.area; cx += m.centroid[0]*m.area; cy += m.centroid[1]*m.area;
      if(m.area > big.area) big = m;
    }
    S.archipelagos.push({ name:aName, members:members.map(m=>m.id), area,
      cx:cx/area, cy:cy/area, biome:big.biome });
  }
  for(const fr of S.fragments){
    if(fr.isLake || fr.arch) continue;
    if(fr.isMeteor){ fr.name = uniqName(()=>pick(['陨星原','天坠地','星核洲','坠日之野','焰石原','天外来陆'])); continue; }
    const ratio = fr.area / cookieArea;
    /* v1.3：中型陆地的后缀由地形类型决定 —— 叫「苍澜高原」还是「苍澜平原」，
       一眼就能看出这块地什么脾气。 */
    const suf = LAND_SUF[fr.landform] || LAND_SUF['丘陵'];
    if(ratio >= 0.08){ const a=pick(NAME_A); fr.name = uniqName(()=>a+pickNameB(a)+pick(['洲','大陆','之地'])); }
    else if(ratio >= 0.02){ const a=pick(NAME_A); fr.name = uniqName(()=>a+pickNameB(a)+pick(suf.b)); }
    else if(ratio >= 0.004){ const a=pick(NAME_A); fr.name = uniqName(()=>a+pickNameB(a)+'岛'); }
  }
  S.pois = [];
  const big = frags.filter(f=>!f.isLake && f.area > cookieArea*0.05).slice(0,6);
  big.forEach((fr,i)=>{
    if(i===0) S.pois.push({ type:'首都', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(CITY_A)+pick(['城','都'])), desc:pick(POI_DESC['首都']) });
    else S.pois.push({ type:'城镇', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(CITY_A)+pick(CITY_B)), desc:pick(POI_DESC['城镇']) });
    if(rng()<0.6) S.pois.push({ type:'遗迹', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(NAME_A)+pick(['废墟','古冢','石阵','皇陵'])), desc:pick(POI_DESC['遗迹']) });
    if(rng()<0.4) S.pois.push({ type:'关隘', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(MNT_A)+pick(['关','隘','口'])), desc:pick(POI_DESC['关隘']) });
    if(rng()<0.4) S.pois.push({ type:'奇观', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(NAME_A)+pick(NAME_B)), desc:pick(POI_DESC['奇观']) });
    if(S.driftAmp>0 && rng()<0.5) S.pois.push({ type:'港口', pos:randPointIn(fr), frag:fr.id,
      name:uniqName(()=>pick(CITY_A)+'港'), desc:pick(POI_DESC['港口']) });
  });
  S.pois = S.pois.slice(0,14);
  S.worldName = uniqName(()=>pick(WORLD_A)+pick(WORLD_B));

  /* ══ v1.3 地理实体标注 ══
     板块名只回答了"哪里是陆地"，这一层回答"那里是什么地形"。
     位置全部从已有几何反推（裂纹中点 / 海岸中点 / 板块质心），不额外造数据。 */
  const at = (p, fr, dy)=> fr ? surfaceYAt(p, fr) + dy : SEA_Y + dy;
  const lfTally = {};
  for(const fr of S.fragments) if(fr.landform) lfTally[fr.landform] = (lfTally[fr.landform]||0)+1;

  // 火山：每座单独命名，是全图最抢眼的地标
  for(const fr of S.fragments){
    if(fr.landform !== '火山') continue;
    const nm = uniqName(()=>pick(LAND_SUF['火山'].a) + pick(LAND_SUF['火山'].b));
    fr.geoName = nm;
    S.geoLabels.push({ x:fr.centroid[0], y:fr.topY + 92, z:fr.centroid[1], text:'🌋 ' + nm });
  }
  /* 山脊 / 鞍部：沿最长的一条山脉裂纹取最高点与最低点 ——
     这不是随手挑两个位置，而是山脊与鞍部本来的定义（脊线上的凸点 / 凹点）。 */
  const longM = S.mountains[0];
  if(longM && longM.pts && longM.pts.length > 6){
    const pts = longM.pts;
    let hiI = 0, hiV = -1e9, loI = 0, loV = 1e9;
    for(let i=1;i<pts.length-1;i++){
      const fr = fragmentAt(pts[i][0], pts[i][1]);
      const y = fr ? surfaceYAt(pts[i], fr) : SEA_Y;
      if(y > hiV){ hiV = y; hiI = i; }
      if(y < loV){ loV = y; loI = i; }
    }
    S.geoLabels.push({ x:pts[hiI][0], y:hiV + 44, z:pts[hiI][1],
      text:'⛰ ' + uniqName(()=>pick(MNT_A)+'山脊'), sub:true });
    S.geoLabels.push({ x:pts[loI][0], y:loV + 28, z:pts[loI][1],
      text:'🏔 ' + uniqName(()=>pick(MNT_A)+'鞍部'), sub:true });
  }
  // 陡崖：两侧板块高差最大的一条断口
  let cliffC = null, cliffD = 0;
  for(const c of S.cracks){
    const hs = crackHosts(c);
    if(hs.length < 2) continue;
    const d = Math.abs(hs[0].topY - hs[1].topY);
    if(d > cliffD){ cliffD = d; cliffC = c; }
  }
  if(cliffC && cliffD > 14 && S.geoLabels.length < 12){
    const p = cliffC.pts[(cliffC.pts.length/2)|0];
    const fr = fragmentAt(p[0], p[1]);
    S.geoLabels.push({ x:p[0], y:at(p, fr, 34), z:p[1],
      text:'⛰ ' + uniqName(()=>pick(MNT_A)+'陡崖'), sub:true });
  }
  // 海峡：两侧都是大块陆地的窄断口（断口本身就是水道）
  const straitC = S.cracks.filter(c=>{
    if(c.kind==='mountain') return false;
    const hs = crackHosts(c);
    return hs.length>=2 && hs.every(f=>f.area > cookieArea*0.035);
  })[0];
  if(straitC && S.geoLabels.length < 12){
    const p = straitC.pts[(straitC.pts.length/2)|0];
    S.geoLabels.push({ x:p[0], y:SEA_Y + 34, z:p[1],
      text:'🌊 ' + uniqName(()=>pick(STRAIT_A)+'海峡'), sub:true });
  }
  // 峡谷：最宽的一条峡谷型裂纹
  const gorgeC = S.rivers.filter(r=>r.kind==='gorge')[0];
  if(gorgeC && S.geoLabels.length < 12){
    const p = gorgeC.pts[(gorgeC.pts.length/2)|0];
    const fr = fragmentAt(p[0], p[1]);
    S.geoLabels.push({ x:p[0], y:at(p, fr, 30), z:p[1],
      text:'🏞 ' + uniqName(()=>pick(GORGE_A)+'峡谷'), sub:true });
  }
  // 山谷：最长的那条河所在的谷地
  const valR = S.rivers[1];
  if(valR && S.geoLabels.length < 12){
    const p = valR.pts[(valR.pts.length/2)|0];
    const fr = fragmentAt(p[0], p[1]);
    S.geoLabels.push({ x:p[0], y:at(p, fr, 26), z:p[1],
      text:'🍃 ' + uniqName(()=>pick(VAL_A)+'山谷'), sub:true });
  }
  // 海湾：最长那条河的入海端
  const bayR = S.rivers[0];
  if(bayR && S.geoLabels.length < 12){
    const p = bayR.pts[bayR.pts.length-1];
    S.geoLabels.push({ x:p[0], y:SEA_Y + 26, z:p[1],
      text:'🌙 ' + uniqName(()=>pick(BAY_A)+'海湾'), sub:true });
  }
  // 沙滩：平原型陆地上最长的一段缓岸
  const beachFr = S.fragments.find(f=>!f.isLake && f.edgeFlags && f.area>cookieArea*0.02 && (f.landform==='平原'||f.landform==='丘陵'||f.landform==='岛屿'));
  if(beachFr && S.geoLabels.length < 12){
    let bi = 0, bl = 0;
    for(let i=0;i<beachFr.poly.length;i++){
      if(!beachFr.edgeFlags[i]) continue;
      const a = beachFr.poly[i], b = beachFr.poly[(i+1)%beachFr.poly.length];
      const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
      if(L > bl){ bl = L; bi = i; }
    }
    const a = beachFr.poly[bi], b = beachFr.poly[(bi+1)%beachFr.poly.length];
    const p = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    S.geoLabels.push({ x:p[0], y:SEA_Y + 22, z:p[1],
      text:'🏖 ' + uniqName(()=>pick(BAY_A)+'沙滩'), sub:true });
  }
  // 海岸：换一块陆地，取它最长的一段外缘 —— 与「沙滩」分开，免得两个标注压在同一个湾里
  const coastFr = S.fragments.find(f=>!f.isLake && f.edgeFlags && f.area > cookieArea*0.02 && f !== beachFr);
  if(coastFr && S.geoLabels.length < 12){
    let bi = 0, bl = 0;
    for(let i=0;i<coastFr.poly.length;i++){
      if(!coastFr.edgeFlags[i]) continue;
      const a = coastFr.poly[i], b = coastFr.poly[(i+1)%coastFr.poly.length];
      const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
      if(L > bl){ bl = L; bi = i; }
    }
    const a = coastFr.poly[bi], b = coastFr.poly[(bi+1)%coastFr.poly.length];
    const p = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    S.geoLabels.push({ x:p[0], y:SEA_Y + 22, z:p[1],
      text:'🌅 ' + uniqName(()=>pick(BAY_A)+'海岸'), sub:true });
  }

  rebuildFragments();
  buildTerrain();
  buildDesc();
  renderRegionList();
  const lfStr = LANDFORM_ORDER.filter(k=>lfTally[k]).map(k=>k+'×'+lfTally[k]).join(' · ');
  addLog('✨ 生成完成！世界「' + S.worldName + '」诞生，共 ' +
    frags.filter(f=>!f.isLake && f.name).length + ' 块有名大陆/岛屿');
  addLog('🗺 地貌：' + lfStr);
  if(S.driftAmp>0) addLog('🔒 板块漂移已锁定（幅度 ' + Math.round(S.driftAmp) + '）');
  setView('iso');
  startWorldGrow();      // v1.3 动效：地貌从地里长出来 + 天光渐亮 + 标注淡入
  setTimeout(()=>{ if(S.phase==='map') setView('tour'); }, 2400);
  setHint('拖动旋转 · 滚轮缩放 · 右键平移');
  updateButtons();
  mergeFragments();      // 进入观赏态：几十个碎块合批成一个 mesh
}

/* ══════════════════════════════════════════════════════════
   十一、描述文本（沿用 v1.9，新增「地势层次」段）
   ══════════════════════════════════════════════════════════ */
function buildDesc(){
  const cookieArea = S.cookieArea;
  const named = S.fragments.filter(f=>f.name && !f.isLake).sort((a,b)=>b.area-a.area);
  const landArea = S.fragments.filter(f=>!f.isLake).reduce((s,f)=>s+f.area,0);
  let bx0=1e9, by0=1e9, bx1=-1e9, by1=-1e9;
  for(const f of S.fragments){ if(f.isLake) continue;
    for(const p of f.poly){ if(p[0]<bx0)bx0=p[0]; if(p[0]>bx1)bx1=p[0]; if(p[1]<by0)by0=p[1]; if(p[1]>by1)by1=p[1]; } }
  const worldArea = Math.max(1, (bx1-bx0)*(by1-by0));
  const landRatio = Math.min(1, landArea / worldArea);
  const mntN = S.mountains.filter(m=>m.name), rivN = S.rivers.filter(r=>r.name);
  let t = '';
  t += '# 世界名称：' + S.worldName + '（种子 #' + seed + '）\n\n';
  t += '> 本地图由「地图生成模拟器 3D v1.4.0 · 饼干生成法」生成：' + shapeLabel() + '饼干，共捶击 ' +
       S.smashCount + ' 次' + (S.eatCount ? '，吃掉 ' + S.eatCount + ' 块' : '') + '，';
  t += S.driftAmp>0 ? '板块已漂移分离（幅度 ' + Math.round(S.driftAmp) + '）。\n\n' : '板块未漂移，为完整大陆。\n\n';
  t += '## 总览\n';
  t += '- 陆地占世界版图约 ' + Math.round(landRatio*100) + '%，其余为海洋，共 ' + named.length + ' 块有名陆地';
  if(S.lakes.length) t += '、' + S.lakes.length + ' 处内陆湖泊';
  if(S.archipelagos.length){
    const an = S.archipelagos.reduce((s,a)=>s+a.members.length,0);
    t += '、' + S.archipelagos.length + ' 处群岛（共 ' + an + ' 座小岛）';
  }
  t += '\n- 主要山脉 ' + mntN.length + ' 条，主要河流 ' + rivN.length + ' 条\n';
  const isles = named.filter(f=>f.area < cookieArea*0.02);
  if(isles.length) t += '- 小型岛屿 ' + isles.length + ' 座，适合安排航线与隐秘势力\n';
  t += '\n## 大陆与岛屿详情\n';
  named.forEach((f,i)=>{
    t += (i+1) + '. **' + f.name + '**（面积约 ' + (f.area/cookieArea*100).toFixed(1) + '%，' + (f.biome||'—') +
         '，地形为' + (f.landform||'丘陵') + '，平均海拔 ' + Math.round(f.topY - SEA_Y) + '）';
    const myPois = S.pois.filter(p=>p.frag===f.id);
    if(myPois.length) t += '：' + myPois.map(p=>p.type + '「' + p.name + '」').join('、');
    const adjNames = S.fragments.filter(o=>o.id!==f.id && f.adj.has(o.id) && o.name).map(o=>o.name);
    if(adjNames.length) t += '；邻接：' + adjNames.join('、');
    t += '\n';
  });
  if(S.archipelagos.length){
    t += '\n## 群岛\n';
    S.archipelagos.forEach(a=>{
      t += '- **' + a.name + '**：由 ' + a.members.length + ' 座小岛组成，合计面积约 ' +
           (a.area/cookieArea*100).toFixed(1) + '%（' + (a.biome||'—') + '）。岛礁密布、航道曲折\n';
    });
  }
  if(mntN.length){
    t += '\n## 山脉\n';
    mntN.forEach(m=>{ t += '- ' + m.name + '：沿主裂纹隆起，是天然的疆界与防线\n'; });
  }
  if(rivN.length){
    t += '\n## 河流\n';
    rivN.forEach(r=>{ t += '- ' + r.name + '：蜿蜒于裂谷之间，滋养沿岸文明\n'; });
  }
  if(S.lakes.length){
    t += '\n## 湖泊\n';
    S.lakes.forEach(l=>{ t += '- ' + l.name + '：内陆洼地积水成湖\n'; });
  }
  if(S.pois.length){
    t += '\n## 兴趣点\n';
    S.pois.forEach(p=>{ t += '- ' + p.type + '「' + p.name + '」：' + p.desc + '\n'; });
  }
  const lfT = {};
  for(const f of named) lfT[f.landform||'丘陵'] = (lfT[f.landform||'丘陵']||0)+1;
  const lfLine = LANDFORM_ORDER.filter(k=>lfT[k]).map(k=>k+' ' + lfT[k] + ' 处').join('、');
  if(lfLine){
    t += '\n## 地貌格局\n';
    t += '- 全图地貌：' + lfLine + '\n';
    const geo = S.geoLabels || [];
    if(geo.length){
      t += '\n## 地理实体\n';
      for(const g of geo) t += '- ' + g.text + '：' + pick(GEO_DESC[g.text.slice(2)] || ['地形险要，值得在地图上单独记一笔。']) + '\n';
    }
    const gorgeN = S.rivers.filter(r=>r.kind==='gorge').length;
    if(gorgeN) t += '- 另有峡谷 ' + gorgeN + ' 处、河流谷地 ' + S.rivers.filter(r=>r.kind==='river').length + ' 段\n';
    if(S.reefSpots && S.reefSpots.length) t += '- 热带浅海散布珊瑚礁 ' + S.reefSpots.length + ' 处\n';
  }
  t += '\n## 地势层次\n';
  const sorted = named.slice().sort((a,b)=>b.topY-a.topY);
  if(sorted.length>=2){
    const hi = sorted[0], lo = sorted[sorted.length-1];
    t += '- 最高处为 ' + hi.name + '（平均海拔 ' + Math.round(hi.topY-SEA_Y) + '），最低处为 ' +
         lo.name + '（' + Math.round(lo.topY-SEA_Y) + '）\n';
    t += '- 落差约 ' + Math.round(hi.topY - lo.topY) + '，' +
         (hi.topY-lo.topY > 60 ? '地势险峻，易形成孤立文明\n' : '地势平缓，利于交通与商贸\n');
  }
  t += '\n## 地缘与势力建议\n';
  if(named.length>=2){
    t += '- ' + named[0].name + ' 与 ' + named[1].name + ' 体量相近，';
    t += mntN.length ? '以' + mntN[0].name + '为界易形成对峙文明\n' : '之间无险可守，易爆发长期争霸\n';
  }
  if(S.rivers.length && named.length) t += '- ' + (rivN[0]?rivN[0].name:'河流') + '下游适合布局农耕大城，控制河道即控制粮道\n';
  if(isles.length) t += '- ' + isles[0].name + '等外岛远离大陆，适合安排海盗、流放者或隐世宗门\n';
  t += '\n## 给 AI 的续写提示\n';
  t += '以上是一份由饼干生成法制作的幻想世界地图设定（种子 #' + seed + '）。请基于这份地理框架帮我完善：' +
       '1) 各大陆的历史脉络与文明风格；2) 主要势力间的关系、冲突与贸易路线；3) 3-5 个可作为故事钩子的地点传说；' +
       '4) 一份适合跑团或小说开篇的大事件年表。请用中文，风格偏奇幻史诗。\n';
  document.getElementById('descText').value = t;
  document.getElementById('btnCopy').disabled = false;
  document.getElementById('btnShot').disabled = false;
}
function renderRegionList(){
  const box = document.getElementById('regionList');
  const cookieArea = S.cookieArea;
  const named = S.fragments.filter(f=>f.name).sort((a,b)=>b.area-a.area);
  box.innerHTML = '';
  if(!named.length && !S.archipelagos.length){ box.innerHTML = '<small style="color:#6a5a40">无命名区域</small>'; return; }
  for(const a of S.archipelagos){
    const div = document.createElement('div');
    div.className = 'rg';
    div.innerHTML = '<span>🏝 ' + a.name + '</span><small>' + a.members.length + ' 岛</small>';
    div.onclick = ()=>{
      const n = prompt('输入新名称：', a.name);
      if(n && n.trim()){
        a.name = n.trim();
        const ids = new Set(a.members);
        for(const f of S.fragments) if(ids.has(f.id)) f.arch = a.name;
        renderRegionList(); buildDesc(); buildTerrain();
      }
    };
    box.appendChild(div);
  }
  for(const f of named){
    const div = document.createElement('div');
    div.className = 'rg';
    div.innerHTML = '<span>' + (f.isLake?'💧 ':'🗺 ') + f.name + '</span><small>' +
      (f.area/cookieArea*100).toFixed(1) + '%</small>';
    div.onclick = ()=>{
      const n = prompt('输入新名称：', f.name);
      if(n && n.trim()){ f.name = n.trim(); renderRegionList(); buildDesc(); buildTerrain(); }
    };
    box.appendChild(div);
  }
}

/* ══════════════════════════════════════════════════════════
   十二、音效（Web Audio 实时合成，无音频文件）
   ══════════════════════════════════════════════════════════ */
let actx = null;
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function noiseBuf(dur){
  const n = Math.max(1, (actx.sampleRate*dur)|0);
  const b = actx.createBuffer(1, n, actx.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return b;
}
function crackSound(f){
  ensureAudio(); if(!actx) return;
  const t0 = actx.currentTime;
  const dur = 0.22 + f*0.3;
  const src = actx.createBufferSource(); src.buffer = noiseBuf(dur);
  const bp = actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 900 + (1-f)*1400; bp.Q.value = 0.7;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.34 + f*0.4, t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0+dur+0.02);
  const o = actx.createOscillator(), og = actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150 - f*60, t0);
  o.frequency.exponentialRampToValueAtTime(48, t0+0.2);
  og.gain.setValueAtTime(0.32*f+0.05, t0);
  og.gain.exponentialRampToValueAtTime(0.0001, t0+0.24);
  o.connect(og); og.connect(actx.destination);
  o.start(t0); o.stop(t0+0.26);
}
function eatSound(n){
  ensureAudio(); if(!actx) return;
  for(let i=0;i<Math.min(4,n);i++){
    const t0 = actx.currentTime + i*0.07;
    const src = actx.createBufferSource(); src.buffer = noiseBuf(0.05);
    const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.2,t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.055);
    src.connect(hp); hp.connect(g); g.connect(actx.destination);
    src.start(t0); src.stop(t0+0.07);
  }
}

/* ══════════════════════════════════════════════════════════
   十三、交互：射线拾取 / 蓄力 / 视角
   ══════════════════════════════════════════════════════════ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let charging = false, charge = 0, chargeStart = 0, chargeFrag = -1, chargeScreen = null;
let shake = 0;
const CHARGE_MS = 1450;

function toNDC(clientX, clientY){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  return ndc;
}
/* 射线拾取：命中碎块顶面 → 世界坐标 → 2D 设计坐标（2D 算法与 3D 呈现的唯一桥梁） */
function pickAt(clientX, clientY){
  if(S.phase!=='cookie') return null;
  ray.setFromCamera(toNDC(clientX, clientY), camera);
  const hits = ray.intersectObjects(fragGroup.children, false);
  if(!hits.length) return null;
  const h = hits[0];
  const id = h.object.userData.fragId;
  const fr = S.fragments.find(f=>f.id===id);
  if(!fr) return null;
  return { frag:fr, wx: h.point.x + CX, wz: h.point.z + CY };
}
function attachPointer(){
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', onPointerDown);
  dom.addEventListener('pointermove', onPointerMove);
  dom.addEventListener('pointerup', onPointerUp);
  dom.addEventListener('pointercancel', onPointerUp);
  dom.addEventListener('contextmenu', e=>e.preventDefault());
}
function onPointerDown(e){
  if(e.button!==undefined && e.button!==0) return;
  ensureAudio();
  if(S.phase!=='cookie') return;
  const hit = pickAt(e.clientX, e.clientY);
  if(!hit) return;                       // 空白区 → 交给 OrbitControls 旋转
  if(S.eatMode){ eatFragment(hit.frag.id); return; }
  charging = true; charge = 0; chargeStart = performance.now();
  chargeFrag = hit.frag.id; chargeScreen = { x:e.clientX, y:e.clientY };
  controls.enabled = false;
  document.getElementById('forceWrap').classList.add('on');
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch(err){}
}
function onPointerMove(e){
  // 力度由主循环按时间推进，此处仅用于命中高亮预留
  if(!charging) return;
}
function onPointerUp(e){
  if(!charging) return;
  charging = false;
  controls.enabled = true;
  document.getElementById('forceWrap').classList.remove('on');
  document.getElementById('forceBar').style.width = '0%';
  if(S.phase!=='cookie'){ charge = 0; return; }
  let target = pickAt(e.clientX, e.clientY);
  if(!target && chargeScreen) target = pickAt(chargeScreen.x, chargeScreen.y);
  if(target) smash(target.wx, target.wz, Math.max(0.12, charge));
  charge = 0;
}
/* 冲击波环 */
function spawnRing(px, py, f){
  const fr = fragmentAt(px, py);
  const base = fr ? surfaceYAt([px,py], fr) : SEA_Y;
  ringMesh.position.set(px-CX, base+3, py-CY);
  ringMesh.visible = true;
  ringT0 = performance.now();
  ringScale = 34 + f*150;
  ringMesh.material.opacity = 0.8;
}
/* 视角预设 */
const CAM_DIST = 820;
let camAnim = null;
function setView(name){
  currentView = name;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===name));
  controls.autoRotate = (name==='tour');
  if(name==='tour') return;
  let pos;
  if(name==='top')      pos = new THREE.Vector3(0.001, CAM_DIST*1.18, 0.001);
  else if(name==='low') pos = new THREE.Vector3(0, CAM_DIST*0.20, CAM_DIST*1.02);
  else                  pos = new THREE.Vector3(CAM_DIST*0.46, CAM_DIST*0.72, CAM_DIST*0.80);
  camAnim = { from: camera.position.clone(), to: pos, t0: performance.now(), dur: 950 };
  controls.target.set(0, 20, 0);
}

/* ══════════════════════════════════════════════════════════
   十四、界面绑定
   ══════════════════════════════════════════════════════════ */
const $ = id=>document.getElementById(id);
function addLog(msg){
  const box = $('log');
  const d = document.createElement('div');
  const t = new Date().toTimeString().slice(0,5);
  d.textContent = '[' + t + '] ' + msg;
  box.insertBefore(d, box.firstChild);
  while(box.children.length > 90) box.removeChild(box.lastChild);
}
let hintTO = null;
function setHint(txt){
  const h = $('hint');
  h.textContent = txt; h.style.opacity = '1';
  clearTimeout(hintTO);
  hintTO = setTimeout(()=>{ h.style.opacity = '0'; }, 4200);
}
function updateButtons(){
  const cookie = S.phase==='cookie';
  $('btnUndo').disabled = !(cookie && undoStack.length);
  $('btnFinish').disabled = !cookie;
  $('btnEat').disabled = !cookie;
  $('drift').disabled = !cookie;
}
let refreshPending = false;
function scheduleRefresh(){
  if(refreshPending) return;
  refreshPending = true;
  requestAnimationFrame(()=>{
    refreshPending = false;
    fractureAll();
    rebuildFragments();
    if(S.phase==='map'){
      buildTerrain();
      /* rebuildFragments() 会把碎块拆回独立 mesh（fragMerged=null）。
         观赏态下必须立刻重新合批，否则拖一次「强度 / 起伏 / 断口」滑块，
         draw call 就从 11 涨到 51（实测）。 */
      mergeFragments();
    }
  });
}

      } else {

  const bindSlider = (id, valId, fn)=>{

  bindSlider('relief','reliefVal', v=>{ reliefAmt = v; });

  $('btnNew').onclick = ()=>newCookie(Math.floor(Math.random()*1e9));

  $('btnNewDrop').onclick = e=>{

    needsDraw = true;
  };
  shapeMenu.querySelectorAll('.shapeOpt').forEach(el=>{

      closeShapeMenu();

  $('btnBrutal').onclick = ()=>{

  $('btnFinish').onclick = finalize;

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t, done));
    } else fallbackCopy(t, done);
