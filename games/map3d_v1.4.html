<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地图生成模拟器 3D · v1.4.0 / 余风清韵 &amp; WorkBuddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0d0b08;color:#e8dcc0;
    font-family:"Microsoft YaHei","微软雅黑",sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:#1a1410;border-bottom:1px solid #4a3a24;flex-shrink:0;flex-wrap:wrap;z-index:20;}
  header h1{font-size:17px;color:#e0c890;font-family:KaiTi,STKaiti,"楷体",serif;letter-spacing:2px;}
  header .ver{font-size:11px;color:#8a7a5a;}
  .tabs{display:flex;gap:6px;margin-left:auto;}
  .tab{padding:4px 12px;font-size:12px;border:1px solid #5a4630;border-radius:4px;
    background:#2a2015;color:#c8b490;cursor:pointer;}
  .tab.on{background:#5a4630;color:#ffe9b0;}
  .tab:disabled{opacity:.38;cursor:not-allowed;}
  #main{flex:1;display:flex;min-height:0;}
  #viewport{flex:1;position:relative;min-width:0;background:#0d0b08;overflow:hidden;}
  #viewport canvas{display:block;touch-action:none;}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .lbl{position:absolute;transform:translate(-50%,-50%);
    font-family:KaiTi,STKaiti,"楷体",serif;font-size:13px;color:#fff3d6;
    text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.9);white-space:nowrap;
    padding:1px 6px;border-radius:9px;background:rgba(20,14,8,.42);
    border:1px solid rgba(200,168,96,.35);
    opacity:0;transition:opacity .55s ease-out;}
  /* 标签淡入：finalize 后给 #labels 加 .ready 才显示（v1.3 动效） */
  #labels.ready .lbl{opacity:1;}
  .lbl.poi{font-size:11px;color:#ffe0a0;background:rgba(20,14,8,.55);}
  /* 地理实体标注（海峡 / 海湾 / 峡谷 / 珊瑚礁 …）：青蓝调，比政区名弱一档 */
  .lbl.geo{font-size:11px;color:#a8e0dc;background:rgba(12,26,30,.55);
    border-color:rgba(120,200,200,.32);padding:0 5px;border-radius:8px;}
  #labels.hide-poi .lbl.poi{display:none;}
  #labels.hide-sub .lbl.poi,#labels.hide-sub .lbl.geo,#labels.hide-sub .lbl.sub{display:none;}
  #labels.hide-geo .lbl.geo{display:none;}
  #hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:10;}
  .hudbox{background:rgba(26,20,16,.86);border:1px solid #4a3a24;border-radius:8px;
    padding:8px 10px;backdrop-filter:blur(6px);min-width:186px;}
  .hudbox h4{font-size:11px;color:#a08a5a;font-weight:normal;letter-spacing:1px;margin-bottom:6px;}
  .hudrow{display:flex;gap:5px;flex-wrap:wrap;}
  .hbtn{flex:1;min-width:38px;padding:5px 4px;font-size:11px;border:1px solid #5a4630;
    border-radius:5px;background:#2a2015;color:#c8b490;cursor:pointer;white-space:nowrap;}
  .hbtn.on{background:#6a5230;color:#ffe9b0;border-color:#8a6a3a;}
  .hbtn:hover{background:#3a2c1c;}
  .sld{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px;color:#a89060;}
  .sld input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;
    background:#4a3a24;border-radius:2px;outline:none;}
  .sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:#d0a860;cursor:pointer;border:1px solid #8a6a3a;}
  .sld .v{width:26px;text-align:right;color:#e0c890;font-variant-numeric:tabular-nums;}
  #forceWrap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:24px;
    background:rgba(26,20,16,.86);border:1px solid #4a3a24;backdrop-filter:blur(6px);
    opacity:0;transition:opacity .15s;pointer-events:none;}
  #forceWrap.on{opacity:1;}
  #forceWrap .lb{font-size:11px;color:#a89060;}
  #forceBarOuter{width:190px;height:11px;background:#14100b;border:1px solid #5a4630;
    border-radius:6px;overflow:hidden;}
  #forceBar{height:100%;width:0%;background:linear-gradient(90deg,#6a9a4a,#d0a838,#c04a28);}
  #forceVal{font-size:12px;color:#e0c890;width:36px;text-align:right;font-variant-numeric:tabular-nums;}
  #fpsVal{float:right;font-size:10px;font-weight:400;color:#8a7a5a;
    font-variant-numeric:tabular-nums;letter-spacing:0;}
  #drawVal{float:right;margin-right:9px;font-size:10px;font-weight:400;color:#6d6047;
    font-variant-numeric:tabular-nums;letter-spacing:0;}
  .hbtn:disabled{opacity:.38;cursor:not-allowed;}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:10;
    font-size:12px;color:#c8b490;background:rgba(26,20,16,.8);padding:5px 14px;
    border-radius:14px;border:1px solid #4a3a24;pointer-events:none;transition:opacity .4s;}
  #sidebar{width:322px;flex-shrink:0;background:#1a1410;border-left:1px solid #4a3a24;
    display:flex;flex-direction:column;padding:10px;gap:9px;overflow-y:auto;}
  .panel{background:#221a12;border:1px solid #4a3a24;border-radius:6px;padding:8px 10px;}
  .panel h3{font-size:12px;color:#c8a860;margin-bottom:6px;font-weight:normal;letter-spacing:1px;
    display:flex;align-items:center;gap:6px;}
  .panel h3 .tag{font-size:10px;color:#8a7a5a;border:1px solid #4a3a24;border-radius:3px;padding:0 4px;}
  #log{height:106px;overflow-y:auto;font-size:11.5px;line-height:1.65;color:#b8a888;}
  #log div{border-bottom:1px dashed #33281a;padding:1px 0;}
  #regionList{max-height:160px;overflow-y:auto;font-size:12px;}
  .rg{display:flex;justify-content:space-between;align-items:center;padding:3px 5px;
    border-radius:4px;cursor:pointer;color:#d8c8a0;}
  .rg:hover{background:#33281a;}
  .rg small{color:#8a7a5a;font-size:11px;}
  #descText{width:100%;height:126px;resize:vertical;background:#14100b;color:#c8b490;
    border:1px solid #4a3a24;border-radius:5px;padding:7px;font-size:11.5px;
    font-family:Consolas,monospace;line-height:1.55;}
  .btnrow{display:flex;gap:6px;margin-top:6px;}
  .btnrow button{flex:1;padding:6px;font-size:12px;border:1px solid #6a5230;border-radius:5px;
    background:#33260f;color:#e0c890;cursor:pointer;}
  .btnrow button:hover:not(:disabled){background:#4a3618;}
  .btnrow button:disabled{opacity:.4;cursor:not-allowed;}
  footer{display:flex;gap:7px;padding:9px 14px;background:#1a1410;border-top:1px solid #4a3a24;
    flex-shrink:0;flex-wrap:wrap;z-index:20;align-items:center;}
  footer button{padding:6px 13px;font-size:12.5px;border:1px solid #5a4630;border-radius:5px;
    background:#2a2015;color:#c8b490;cursor:pointer;}
  footer button:hover:not(:disabled){background:#3a2c1c;}
  footer button:disabled{opacity:.36;cursor:not-allowed;}
  footer button.on{background:#6a3018;color:#ffd8a0;border-color:#9a4a28;}
  footer button.prim{background:#4a3618;color:#ffe9b0;border-color:#8a6a3a;}
  /* 饼干形状自选下拉 */
  #newCookieGrp{position:relative;display:flex;}
  #newCookieGrp > button:first-child{border-radius:5px 0 0 5px;}
  #btnNewDrop{margin-left:-1px;border-radius:0 5px 5px 0;padding:6px 9px;}
  #shapeMenu{display:none;position:absolute;bottom:calc(100% + 6px);left:0;z-index:60;
    background:#2e2418;border:1px solid #8a6f4d;border-radius:9px;padding:5px;
    min-width:152px;box-shadow:0 10px 26px rgba(0,0,0,0.62);}
  .shapeOpt{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;
    color:#d8c8a0;white-space:nowrap;}
  .shapeOpt:hover{background:#4a3a24;}
  .shapeOpt.on{background:#5a4630;color:#ffe9b0;}
  #seedIn{width:76px;background:#14100b;color:#c8b490;border:1px solid #4a3a24;
    border-radius:4px;padding:5px 6px;font-size:12px;}
  #loadmask{position:fixed;inset:0;background:#0d0b08;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:12px;z-index:100;color:#c8a860;
    font-family:KaiTi,STKaiti,serif;font-size:16px;letter-spacing:3px;transition:opacity .5s;}
  #loadmask.hide{opacity:0;pointer-events:none;}
  #loadmask small{font-size:11px;color:#7a6a4a;letter-spacing:1px;font-family:"Microsoft YaHei",sans-serif;}
  .spin{width:26px;height:26px;border:2px solid #4a3a24;border-top-color:#d0a860;
    border-radius:50%;animation:sp .9s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #err{position:fixed;left:10px;bottom:10px;max-width:60%;background:#3a1212;color:#ffb0b0;
    border:1px solid #6a2020;border-radius:6px;padding:10px;font-size:12px;display:none;z-index:200;}
  @media (max-width:820px){
    #sidebar{display:none;}
    header h1{font-size:14px;}
    footer button{padding:6px 9px;font-size:11.5px;}
    #hud{left:8px;top:8px;}
    .hudbox{min-width:0;padding:6px 8px;}
    #forceBarOuter{width:110px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>地图生成模拟器 3D</h1>
    <span class="ver">v1.4.0 · Three.js r186</span>
    <div class="tabs">
      <button class="tab on" data-method="smash">✊ 捶击法</button>
      <button class="tab" data-method="shake" disabled title="v1.5 开放">📦 摇晃法</button>
      <button class="tab" data-method="meteor" disabled title="v1.5 开放">🌠 陨落法</button>
    </div>
  </header>

  <div id="main">
    <div id="viewport">
      <div id="labels"></div>
      <div id="hint">按住饼干蓄力，松手落锤</div>

      <div id="hud">
        <div class="hudbox">
          <h4>视角</h4>
          <div class="hudrow">
            <button class="hbtn on" data-view="iso">等距</button>
            <button class="hbtn" data-view="top">俯视</button>
            <button class="hbtn" data-view="low">平视</button>
            <button class="hbtn" data-view="tour">巡游</button>
          </div>
        </div>
        <div class="hudbox">
          <h4>立体化</h4>
          <div class="sld"><span>强度</span><input id="relief" type="range" min="0" max="100" value="42"><span class="v" id="reliefVal">42</span></div>
          <div class="sld"><span>起伏</span><input id="bumpy" type="range" min="0" max="100" value="55"><span class="v" id="bumpyVal">55</span></div>
          <div class="sld"><span>断口</span><input id="jag" type="range" min="0" max="100" value="70"><span class="v" id="jagVal">70</span></div>
        </div>
        <div class="hudbox">
          <h4>显示</h4>
          <div class="hudrow">
            <button class="hbtn on" data-tog="shadow">阴影</button>
            <button class="hbtn on" data-tog="water">水面</button>
            <button class="hbtn on" data-tog="mount">地貌</button>
            <button class="hbtn on" data-tog="label">标注</button>
          </div>
        </div>
        <div class="hudbox">
          <h4>画质<span id="drawVal">–</span><span id="fpsVal">–</span></h4>
          <div class="hudrow">
            <button class="hbtn on" data-q="auto">自动</button>
            <button class="hbtn" data-q="high">高</button>
            <button class="hbtn" data-q="mid">中</button>
            <button class="hbtn" data-q="low">低</button>
          </div>
        </div>
      </div>

      <div id="forceWrap">
        <span class="lb">捶击力度</span>
        <div id="forceBarOuter"><div id="forceBar"></div></div>
        <span id="forceVal">0%</span>
      </div>
    </div>

    <aside id="sidebar">
      <div class="panel">
        <h3>📜 操作日志</h3>
        <div id="log"></div>
      </div>
      <div class="panel">
        <h3>🗺 区域列表 <span class="tag">点击改名</span></h3>
        <div id="regionList"><small style="color:#6a5a40">完成生成后显示</small></div>
      </div>
      <div class="panel">
        <h3>🌍 世界观描述</h3>
        <textarea id="descText" readonly placeholder="点击「✨ 完成生成」后产出…"></textarea>
        <div class="btnrow">
          <button id="btnCopy" disabled>📋 复制描述</button>
          <button id="btnShot" disabled>🖼 导出截图</button>
        </div>
      </div>
      <div class="panel">
        <h3>🌊 板块漂移</h3>
        <div class="sld"><span>幅度</span><input id="drift" type="range" min="0" max="120" value="0"><span class="v" id="driftVal">关</span></div>
      </div>
    </aside>
  </div>

  <footer>
    <div id="newCookieGrp">
      <button id="btnNew">🍪 新饼干</button><button id="btnNewDrop" title="自己选饼干形状">▾</button>
      <div id="shapeMenu">
        <div class="shapeOpt on" data-shape="random">🎲 随机形状</div>
        <div class="shapeOpt" data-shape="round">🍪 圆形饼干</div>
        <div class="shapeOpt" data-shape="square">🍞 方形饼干</div>
        <div class="shapeOpt" data-shape="triangle">🔺 三角饼干</div>
        <div class="shapeOpt" data-shape="hexagon">⬡ 六边饼干</div>
        <div class="shapeOpt" data-shape="rhombus">🔶 菱形饼干</div>
        <div class="shapeOpt" data-shape="octagon">🛑 八边饼干</div>
        <div class="shapeOpt" data-shape="star">⭐ 星星饼干</div>
      </div>
    </div>
    <button id="btnUndo">↩ 撤销</button>
    <button id="btnBrutal">🔥 暴力</button>
    <button id="btnEat">🍽 吃板块</button>
    <button id="btnFinish" class="prim">✨ 完成生成</button>
    <span style="display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px;color:#8a7a5a;">
      种子 <input id="seedIn" type="number"> <button id="btnSeed">🎲 换</button>
    </span>
  </footer>
</div>

<div id="loadmask"><div class="spin"></div><div>正在唤醒世界…</div><small>Three.js r186 内联 · 首次编译着色器需数秒</small></div>
<div id="err"></div>

<!-- ─────────────────────────────────────────────────────────────────────
     Three.js r186 · 本体 + 本作用到的 addon，打包成 IIFE 后内联在这里
     为什么不用 ES 模块 + importmap：
       script type=module 在 file:// 协议下会被浏览器 CORS 拦掉（origin 'null'），
       本地双击打开就永远停在"正在唤醒世界…"。
       改成「传统 script + 内联包」→ 双击即跑、离线可跑、单文件零依赖。
     重新打包步骤见 设计方案.md 十七章「重新打包 Three.js」
     ───────────────────────────────────────────────────────────────────── -->

<script id="app">
(function(){
'use strict';
const { OrbitControls, CSS2DRenderer, CSS2DObject, RoomEnvironment } = THREE;

window.addEventListener('error', e=>{

/* 启动看门狗：无论什么原因卡住，8 秒后一定给出可读提示并放掉遮罩。

let booted = false;
function failBoot(msg){
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.innerHTML = msg;
  const m = document.getElementById('loadmask');
  if(m) m.classList.add('hide');
}
setTimeout(()=>{
  if(!booted) failBoot('⚠ 启动超时：页面脚本没有跑起来。<br>'
    + '<span style="color:#e8dcc0">常见原因：</span>浏览器不支持 WebGL2，或安全软件拦截了页面脚本。'
    + '可先用 Chrome / Edge 打开试试。');
}, 8000);

/* ══════════════════════════════════════════════════════════
   一、坐标系与常量
   2D 设计坐标 (x, y)  →  3D 世界 (x, y, z)
   x3 = x2 - CX ；z3 = y2 - CY ；高度用独立的 3D y（不取负）
   ══════════════════════════════════════════════════════════ */
const DW = 1100, DH = 760;
const CX = DW/2, CY = 400;
const R = 280;

const SEA_Y = 0;                    // 海平面高度
const BED_Y = -22;                  // 底板顶面
/* v1.3.5：底面原为 -24（海床高度），但水下那段完全被水面挡住，
   纯属白白多出 24 单位高的侧壁参与绘制与遮挡。现在只保留水线下方 7 单位。
   （v1.4.0 又删掉了 waterSide 侧壁圆柱，水下厚度改由「半透明水面 + 深色底板」表达。）
   既省了一半侧壁面积，也避免板块在浅水区互相插穿。 */
const GROUND_Y = -7;                // 碎块底面（水面下方一点点，水下由半透明水面 + 深色底板表达）
/* v1.3.5：150 是 v1.0 定的，当时默认强度是 1.0，150 对应"整块饼干立起来"。
   后来默认强度降到 0.42，但 RELIEF_MAX 没跟着改 —— 默认下最大板块顶面仍有 102，
   而水面在 0，于是每块大板块都在水上竖一面 100 单位的墙（用户说的"水两边的棕块"）。
   降到 62：默认强度下最大顶面约 46，最高档约 74，仍留有落差可玩性。 */
const RELIEF_MAX = 62;              // 立体化强度 100 时的最大顶面抬升（决定"错落"幅度）

const COOKIE_BASE = 0xc9a06a;       // 饼干基色
const COOKIE_DARK = 0x8a5f30;       // 烤斑
/* v1.3.3：这两个色原来偏亮（内芯 0xecd6ae 大面积铺开就是"白纸"），
   压暗一档之后侧壁才像岩体而不是彩纸；断口分色本身没变。 */
const RIND_COLOR  = 0x9a6b30;       // 外皮（原始轮廓断面）
const CORE_COLOR  = 0xd2ba91;       // 内芯（裂纹断面）—— 立体化的灵魂
const BOTTOM_COLOR= 0x5e4126;       // 底面

/* 气候带（biome）与地形类型（landform）是两套彼此独立的东西：
   一块地完全可以既是「火山」地形、又处在「草甸」气候下。
   但两个维度原来都用了「平原 / 丘陵」这两个词（v1.2 只有气候一个维度时没问题），
   v1.3 加入地形类型后就会打架，读起来像「丘陵地形 + 丘陵气候」。
   所以把气候侧的这两个名字换掉。 */
const BIOME_COLORS = {
  '雪原':0xb6ae9e, '沙漠':0xc9a05e, '草原':0x9a9752,
  '森林':0x63804a, '草甸':0xb09d6a, '荒原':0x95815a
};

/* ══════════════════════════════════════════════════════════
   v1.3 地形类型（landform）
   一块陆地的"性格"由四个量决定：相对海拔 / 起伏度 / 面积 / 邻接高差。
   海拔不再是唯一台词 —— 高原是"高而平"，丘陵是"低而皱"，平原是"低而平"，
   盆地是"自己低、四周高"。有了这套判据，山脉自然就稀有下来了
   （v1.2 是简单粗暴地把 40% 的裂纹都算成山脉，满地图全是山）。
   ══════════════════════════════════════════════════════════ */
const LANDFORM = {
  '火山': { color:0xb2705a, tint:0x8a5c46 },   // 相对海拔最高、最稀有
  '山脉': { color:0x9c8a62, tint:0x7d6a4c },
  '高原': { color:0xbda06e, tint:0x9c8258 },
  '丘陵': { color:0x9c8a62, tint:0x86754e },
  '盆地': { color:0x8f8f5c, tint:0x767a4a },
  '平原': { color:0xb6a876, tint:0x9d9161 },
  '岛屿': { color:0x94a06e, tint:0x7d8a5c }
};
const LANDFORM_ORDER = ['火山','山脉','高原','丘陵','盆地','平原','岛屿'];

/* 地貌物配色（不再只有"山"一种） */
const HILL_COLOR    = 0xab9769;   // 丘陵
const MESA_TOP      = 0xcbb384;   // 台地顶面（被风蚀平的浅色）
const MESA_CLIFF    = 0x8b6d4d;   // 台地 / 陡崖侧壁
const VOLCANO_ROCK  = 0x5b4941;
const VOLCANO_LAVA  = 0xd4603a;
const SAND_COLOR    = 0xe6d6a8;   // 沙滩
const REEF_COLORS   = [0x4f9e8a, 0x3f8f96, 0x5aa87e];  // 珊瑚礁

/* ══════════════════════════════════════════════════════════
   二、基础工具（照搬 v1.9）
   ══════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let seed = (Math.random()*1e9)|0;
let rng = mulberry32(seed);
function rand(a,b){ return a + (b-a)*rng(); }
function pick(arr){ return arr[(rng()*arr.length)|0]; }

const cross=(v,w)=>v[0]*w[1]-v[1]*w[0];
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function signedArea(poly){ let s=0; for(let i=0;i<poly.length;i++){ const a=poly[i],b=poly[(i+1)%poly.length]; s+=a[0]*b[1]-b[0]*a[1]; } return s/2; }
function centroid(poly){ let x=0,y=0; for(const p of poly){ x+=p[0]; y+=p[1]; } return [x/poly.length, y/poly.length]; }
function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if(((a[1]>p[1])!==(b[1]>p[1])) && (p[0] < (b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])) inside=!inside;
  }
  return inside;
}
function rayExit(p,d,poly){
  let best=null,bt=Infinity;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const e=[b[0]-a[0],b[1]-a[1]];
    const den=cross(d,e);
    if(Math.abs(den)<1e-12) continue;
    const ap=[a[0]-p[0],a[1]-p[1]];
    const t=cross(ap,e)/den, u=cross(ap,d)/den;
    if(t>1e-6 && u>=-1e-6 && u<=1+1e-6 && t<bt){ bt=t; best=[p[0]+d[0]*t,p[1]+d[1]*t]; }
  }
  return best;
}
function segInt(p,p2,a,b){
  const r=[p2[0]-p[0],p2[1]-p[1]], s=[b[0]-a[0],b[1]-a[1]];
  const den=cross(r,s);
  if(Math.abs(den)<1e-12) return null;
  const t=cross([a[0]-p[0],a[1]-p[1]],s)/den;
  return [p[0]+r[0]*t, p[1]+r[1]*t];
}
function clipHalf(poly, p, n){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const da=(a[0]-p[0])*n[0]+(a[1]-p[1])*n[1];
    const db=(b[0]-p[0])*n[0]+(b[1]-p[1])*n[1];
    if(da<=1e-9) out.push(a);
    if((da<=1e-9)!==(db<=1e-9)){
      const t=da/(da-db);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
    }

function voronoiCells(boundPoly, sites){
  const cells=[];
  for(let i=0;i<sites.length;i++){
    let cell = boundPoly;
    for(let j=0;j<sites.length;j++){
      if(i===j) continue;
      const si=sites[i], sj=sites[j];
      const mid=[(si[0]+sj[0])/2,(si[1]+sj[1])/2];
      const d=[sj[0]-si[0], sj[1]-si[1]];
      cell = clipHalf(cell, mid, d);
      if(!cell.length) break;
    }
    if(cell.length>=3) cells.push(cell);
  }
  return cells;
}
/* 2D→3D 关键改造：额外产出「每条边是否为内部断口」edgeFlags，
   这是侧壁分材质（外皮 / 内芯）的唯一依据 */
function buildPieces(cells){
  const edgeMap = new Map();
  const key = p=>p[0].toFixed(1)+','+p[1].toFixed(1);
  cells.forEach((cell,ci)=>{
    for(let i=0;i<cell.length;i++){
      const a=cell[i], b=cell[(i+1)%cell.length];
      const ka=key(a), kb=key(b);
      const ek = ka<kb ? ka+'|'+kb : kb+'|'+ka;
      let e = edgeMap.get(ek);
      if(!e){ e={ a: ka<kb?a:b, b: ka<kb?b:a, cells:[], pts:null, interior:false }; edgeMap.set(ek,e); }
      e.cells.push(ci);
    }
  });

  for(const e of edgeMap.values()){
    e.interior = e.cells.length===2;
    e.pts = e.interior ? midDisplace(e.a, e.b, 4, jag) : [e.a, e.b];
  }
  const polys = [], edgeFlags = [];
  for(const cell of cells){
    const poly=[], flags=[];
    for(let i=0;i<cell.length;i++){
      const a=cell[i], b=cell[(i+1)%cell.length];
      const ka=key(a), kb=key(b);
      const ek = ka<kb ? ka+'|'+kb : kb+'|'+ka;
      const e = edgeMap.get(ek);
      const pts = ka<kb ? e.pts : e.pts.slice().reverse();
      for(let k=0;k<pts.length-1;k++){ poly.push(pts[k]); flags.push(!!e.interior); }
    }
    polys.push(poly); edgeFlags.push(flags);
  }
  return { polys, edgeFlags, edgeMap };

function midDisplace(p0,p1,depth,rough){
  let pts=[p0,p1];
  for(let d=0;d<depth;d++){
    const np=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      const dx=b[0]-a[0], dy=b[1]-a[1];
      const len=Math.hypot(dx,dy)||1;
      const off=(rng()-0.5)*len*rough;
      np.push([(a[0]+b[0])/2 - dy/len*off, (a[1]+b[1])/2 + dx/len*off], b);
    }
    pts=np;
  }
  return pts;

/* ── 值噪声：顶面起伏与烤斑的随机基底 ── */
function hash2(x,y,s){
  let h = Math.imul(x,374761393) + Math.imul(y,668265263) + Math.imul(s,1274126177);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 4294967296;
}
function vnoise(x,y,s){
  const x0=Math.floor(x), y0=Math.floor(y);
  const fx=x-x0, fy=y-y0;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hash2(x0,y0,s), b=hash2(x0+1,y0,s), c=hash2(x0,y0+1,s), d=hash2(x0+1,y0+1,s);

  oct = oct||3;
  let v=0, amp=1, f=1, norm=0;
  for(let i=0;i<oct;i++){ v += vnoise(x*f, y*f, s+i*17)*amp; norm+=amp; amp*=0.5; f*=2; }
  return v/norm;
}

/* ══════════════════════════════════════════════════════════
   三、游戏状态
   ══════════════════════════════════════════════════════════ */
const cookieC = [CX, CY];
let fragId = 0;
const S = {
  phase:'cookie',
  fragments:[], cracks:[],
  smashCount:0, epicenter:null,
  driftAmp:0, worldName:'',
  mountains:[], rivers:[], lakes:[], pois:[], archipelagos:[],
  shape:'round', cookieArea:Math.PI*R*R, cookieR:R,
  method:'smash', eatMode:false, eatCount:0
};
const undoStack = [];
/* 默认强度 0.42（v1.3.3 由 0.62 下调）：低角度实测，0.62 时从水面往上
   有 20~120 单位高的垂直崖面，整个画面被"一排排高墙"占满；0.42 时陆地

let shapePick = 'random';
function shapeMenuSync(){
  const m = document.getElementById('shapeMenu');
  if(!m) return;
  m.querySelectorAll('.shapeOpt').forEach(o=>o.classList.toggle('on', o.dataset.shape === shapePick));
}
let showShadow = true, showWater = true, showMount = true, showLabel = true;
let currentView = 'iso';

/* ══════════════════════════════════════════════════════════
   四、饼干形状（照搬 v1.9，七种）
   ══════════════════════════════════════════════════════════ */
function discPoly(cx,cy,r,n){
  const pts=[];
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }
  return pts;
}
function squarePoly(cx,cy,r){
  const a = r*0.9, cr = r*0.3, pts = [];
  const arc = 7, edgeSegs = 5;
  const corners = [
    { c:[a-cr, -a+cr], a0:-Math.PI/2, a1:0 },
    { c:[a-cr,  a-cr], a0:0,          a1:Math.PI/2 },
    { c:[-a+cr, a-cr], a0:Math.PI/2,  a1:Math.PI },
    { c:[-a+cr,-a+cr], a0:Math.PI,    a1:Math.PI*1.5 }
  ];
  const edges = [
    [[a, -a+cr],[a, a-cr]], [[a-cr, a],[-a+cr, a]],
    [[-a, a-cr],[-a, -a+cr]], [[-a+cr, -a],[a-cr, -a]]
  ];
  for(let k=0;k<4;k++){
    const co = corners[k];
    for(let i=0;i<arc;i++){
      const t = co.a0 + (co.a1-co.a0)*(i/arc);
      pts.push([cx + co.c[0] + Math.cos(t)*cr, cy + co.c[1] + Math.sin(t)*cr]);
    }
    const e = edges[k];
    for(let i=0;i<edgeSegs;i++){
      const t = i/edgeSegs;
      const jx = e[0][0]===e[1][0] ? rand(-3,3) : 0;
      const jy = e[0][1]===e[1][1] ? rand(-3,3) : 0;
      pts.push([cx + e[0][0]+(e[1][0]-e[0][0])*t + jx, cy + e[0][1]+(e[1][1]-e[0][1])*t + jy]);
    }
  }
  return pts;
}
const SHAPES = {
  round:{label:'圆形', r:1}, square:{label:'方形', r:1},
  triangle:{label:'三角', r:1.22}, hexagon:{label:'六边', r:1.05},
  rhombus:{label:'菱形', r:1}, octagon:{label:'八边', r:1.02}, star:{label:'星星', r:1.1}
};
function shapeLabel(){ return (SHAPES[S.shape] || SHAPES.round).label; }
function ngonPoly(cx, cy, r, n, rot, ry){
  const segs = Math.max(4, Math.round(64/n)), pts = [];
  for(let i=0;i<n;i++){
    const a0 = rot + i/n*Math.PI*2, a1 = rot + (i+1)/n*Math.PI*2;
    const v0 = [Math.cos(a0)*r, Math.sin(a0)*r*(ry||1)];
    const v1 = [Math.cos(a1)*r, Math.sin(a1)*r*(ry||1)];
    const dx = v1[0]-v0[0], dy = v1[1]-v0[1];
    const len = Math.hypot(dx,dy)||1;
    for(let k=0;k<segs;k++){
      const t = k/segs;
      const x = v0[0]+dx*t, y = v0[1]+dy*t;
      const off = Math.sin(t*Math.PI)*rand(-3.5,3.5);
      pts.push([cx + x - dy/len*off, cy + y + dx/len*off]);
    }
  }
  return pts;
}
function starPoly(cx, cy, r, rot){
  const pts = [], verts = [];
  for(let i=0;i<10;i++){
    const a = rot + i/10*Math.PI*2, rr = i%2===0 ? r : r*0.45;
    verts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
  }
  for(let i=0;i<10;i++){
    const v0 = verts[i], v1 = verts[(i+1)%10];
    const dx = v1[0]-v0[0], dy = v1[1]-v0[1];
    const len = Math.hypot(dx,dy)||1;
    for(let k=0;k<6;k++){
      const t = k/6;
      const off = Math.sin(t*Math.PI)*rand(-3,3);
      pts.push([cx + v0[0]+dx*t - dy/len*off, cy + v0[1]+dy*t + dx/len*off]);
    }
  }
  return pts;
}
function cookiePoly(shape){
  const cx = cookieC[0], cy = cookieC[1];
  switch(shape){
    case 'square':   return squarePoly(cx, cy, R);
    case 'triangle': return ngonPoly(cx, cy, R*1.22, 3, -Math.PI/2);
    case 'hexagon':  return ngonPoly(cx, cy, R*1.05, 6, -Math.PI/2);
    case 'rhombus':  return ngonPoly(cx, cy, R, 4, 0, 0.62);
    case 'octagon':  return ngonPoly(cx, cy, R*1.02, 8, Math.PI/8);
    case 'star':     return starPoly(cx, cy, R*1.1, -Math.PI/2);
    default:         return discPoly(cx, cy, R, 72);
  }
}

/* ══════════════════════════════════════════════════════════
   五、碎块模型：2D 多边形 → 3D 立体块
     ① 基线高差 baseY   ② 顶面起伏 dome+noise   ③ 断口侧壁分色
   ══════════════════════════════════════════════════════════ */
function bounds2(poly){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of poly){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  return [x0,y0,x1,y1];
}
function makeFragment(poly, flags){
  const fr = {
    id:++fragId, poly, edgeFlags: flags||null,
    area:Math.abs(signedArea(poly)), centroid:null,
    name:null, biome:null, offset:[0,0], jitter:rand(0.7,1.3), adj:new Set(),
    isLake:false, animT0:null, animFrom:null, animDur:600,
    mesh:null
  };
  fr.centroid = centroid(poly);
  computeFragmentProfile(fr);
  return fr;
}
/* 计算立体参数
   关键：底面固定在海床（GROUND_Y），只有【顶面】高度随板块浮动 ——
   这样从低角度看到的是断口崖壁，而不是悬空的板块底。 */
function computeFragmentProfile(fr){
  const ratio = Math.min(1, fr.area / S.cookieArea);
  const c = fr.centroid;
  const epic = S.epicenter || cookieC;
  const dEpic = Math.hypot(c[0]-epic[0], c[1]-epic[1]) / S.cookieR;
  // 面积因子：大洲高、岛屿低（指数 <1 让大小板块落差更陡）
  const areaH = Math.pow(ratio, 0.28);
  const epicH = Math.max(0, 1 - dEpic*0.62);
  let h = areaH*0.60 + epicH*0.40 + (rng()-0.5)*0.16;   // 末项：微随机，避免高度过于规律
  if(fr.isMeteor) h = 1.15;
  fr.heightFactor = Math.min(1.15, Math.max(0.05, h));
  fr.topBase = 3 + fr.heightFactor * RELIEF_MAX * reliefAmt;   // 顶面基准高度（错落主来源）
  fr.dome    = 6 + bumpyAmt*20;                                 // 顶面中央鼓包
  /* v1.3.5：鼓包原为 8+bumpy*34（默认 26.7），它是在 topBase 之上再加一整块凸起 ——
     低角度看就是"墙的上缘又高出一大截"，是棕色挡板显得格外高的第二个来源。 */
  fr.noiseAmp = fr.area < S.cookieArea*0.01 ? 2.2 : (3.0 + bumpyAmt*20.0);
  fr.noiseSeed = (rng()*10000)|0;
  fr._surfPoly = null;      // 立体参数变了 → 表面采样缓存必须失效
  const bb = bounds2(fr.poly);
  fr.maxR = Math.max(24, Math.hypot(bb[2]-bb[0], bb[3]-bb[1])/2);
  fr.thick = fr.topBase - GROUND_Y;      // 板块总厚度（供描述/诊断）
  fr.topY  = fr.topBase;
}
function fractureAll(){ for(const fr of S.fragments) computeFragmentProfile(fr); }

function topYAt(p, fr, rel){
  const dx = p[0]-fr.centroid[0], dz = p[1]-fr.centroid[1];
  const d = Math.hypot(dx, dz);
  const u = Math.min(1, d / fr.maxR);
  const r = (rel === undefined || rel === null) ? 1 : rel;
  const dome = fr.dome * r * Math.cos(u*Math.PI*0.5);
  const nz = (fbm(p[0]*0.017, p[1]*0.017, fr.noiseSeed, 3) - 0.5) * 2 * fr.noiseAmp * r;
  const rim = -fr.noiseAmp*0.55 * r * Math.pow(u, 3);
  return fr.topY + dome + nz + rim;
}
const _tmpCol = new THREE.Color();
const _tmpCol2 = new THREE.Color();   // topColorAt 内部专用，避免覆盖调用方的 out
function topColorAt(p, fr, out){
  const inMap = S.phase==='map';
  if(inMap && fr.biome && BIOME_COLORS[fr.biome]) out.setHex(BIOME_COLORS[fr.biome]);
  else out.setHex(COOKIE_BASE);
  if(!inMap){
    const b1 = fbm(p[0]*0.012, p[1]*0.012, fr.noiseSeed+91, 3);
    const b2 = fbm(p[0]*0.062, p[1]*0.062, fr.noiseSeed+13, 2);
    const dark = Math.max(0, (0.56-b1)*2.0) + Math.max(0,(0.48-b2)*0.75);
    const k = Math.max(0, Math.min(1, 1 - dark));
    const dc = _tmpCol2.setHex(COOKIE_DARK);
    out.r = out.r*(1-k) + dc.r*k;
    out.g = out.g*(1-k) + dc.g*k;
    out.b = out.b*(1-k) + dc.b*k;
    const hi = Math.max(0, (b2-0.58)*1.6);
    out.r = Math.min(1.7, out.r*(1+hi*0.28));
    out.g = Math.min(1.7, out.g*(1+hi*0.25));
    out.b = Math.min(1.7, out.b*(1+hi*0.20));
  } else {
    const b1 = fbm(p[0]*0.02, p[1]*0.02, fr.noiseSeed+7, 2);
    const s = 0.86 + b1*0.3;
    out.r *= s; out.g *= s; out.b *= s;
  }
  return out;
}
function prepPolygon(poly, flags){
  const pts = [], fl = [];
  const n = poly.length;
  for(let i=0;i<n;i++){
    const p = poly[i], q = poly[(i+1)%n];
    if(Math.hypot(p[0]-q[0], p[1]-q[1]) > 1e-3){ pts.push(p); fl.push(flags ? !!flags[i] : false); }
  }
  if(pts.length < 3) return null;
  const v2 = pts.map(p=>new THREE.Vector2(p[0], p[1]));
  let faces;
  try { faces = THREE.ShapeUtils.triangulateShape(v2, []); }
  catch(e){ return null; }
  if(!faces || !faces.length) return null;
  return { pts, faces, flags: fl };
}
/* 多边形第 i 条边的单位方向（2D 设计坐标）。
   侧壁做"中段起浮"时用它把顶点朝【边的两侧】推，做出有起伏的岩壁轮廓 ——
   过去侧壁是一条笔直从上到下的板，低角度看就是一张立起来的彩纸。 */
function edgeDirX(pts, i){
  const a = pts[i], b = pts[(i+1)%pts.length];
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const l = Math.hypot(dx, dy) || 1;
  return -dy/l;
}
function edgeDirZ(pts, i){
  const a = pts[i], b = pts[(i+1)%pts.length];
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const l = Math.hypot(dx, dy) || 1;
  return dx/l;
}
function buildFragmentGeometry(fr){
  const prep = prepPolygon(fr.poly, fr.edgeFlags);
  if(!prep) return null;
  const { pts, faces, flags } = prep;
  const n = pts.length;

  const pos = [], col = [];
  const ys = new Array(n);
  for(let i=0;i<n;i++) ys[i] = topYAt(pts[i], fr);
  /* v1.3.3：顶面颜色只算一次并缓存 —— 侧壁顶部要用同一批颜色做衔接，
     这样棱线处不会出现"地表色 / 饼干色"的硬边。顺带省掉重复的 fbm 调用。 */
  const surfCol = new Array(n);
  for(let i=0;i<n;i++) surfCol[i] = topColorAt(pts[i], fr, new THREE.Color()).clone();
  // 缓存【真实渲染表面】(顶点 + 三角面 + 顶点高度)，供山体/河流/标注取高度。
  // 这是修「山脉浮空」的关键：topYAt 是解析曲面，而顶面网格只是多边形顶点上的
  // 线性插值，两者在非顶点处能差十几到几十单位 —— 山体按解析值摆必然浮空或陷地。

  //   必须 [f0,f2,f1] 反一下法线才朝上，否则整块顶面会被背面剔除
  //   （曾因此"看到的是碎块内部"）。同时 2D 设计坐标要减 CX/CY 让世界原点居中。
  for(const f of faces){
    const r = [f[0], f[2], f[1]];
    for(const vi of r){
      const sc = surfCol[vi];
      pos.push(pts[vi][0] - CX, ys[vi], pts[vi][1] - CY);
      col.push(sc.r, sc.g, sc.b);
    }
  }
  // ② 底面（固定在海底，法线朝下：保持原始绕序）
  const by = GROUND_Y;
  const bc = _tmpCol.setHex(BOTTOM_COLOR);
  const br = bc.r, bg = bc.g, bb2 = bc.b;
  for(const f of faces){
    for(const vi of f){
      pos.push(pts[vi][0] - CX, by, pts[vi][1] - CY);
      col.push(br, bg, bb2);
    }
  }
  // ③ 侧壁——断面分色（立体化的灵魂）
  //   崖壁纵切 3 段：顶亮底暗、越往下衰减越快（廉价 AO + 岩层感），
  //   另叠逐边微抖动，避免同一碎块相邻崖壁糊成一片。
  /* v1.3.4：低角度下"水面两边那两块棕色"的治理。
     实测那两块不是沙滩带、也不是水面的问题 —— 就是站在前排的板块，以几十到
     上百单位高的侧壁横贯画面，把后面所有板块的下半截全糊住。俯视图里一点
     棕块都没有、一低角度就冒出来，这就是侧壁的决定性证据。
     对策：别让侧壁是一条"从水线直落到底、颜色基本均匀"的竖直大板。 */
  /* 竖向 8 段。明暗曲线的顶端【往下压】：低角度真正占满屏幕的是侧壁上半段，
     过去那条 1.00→0.34 的单调变暗曲线在这段给的是最亮的饼干色，
     于是整条横带全在发光。 */
  const WSEG = 8;
  /* 静态明暗表已改为按墙高动态计算（见循环内的 kBotR）：
     固定表在低强度下合适、在高强度下压不住。 */
  const kBotBase = [0.72, 0.80, 0.78, 0.68, 0.56, 0.45, 0.35, 0.26, 0.18];
  const kBotAt = (s, kFloor)=>{
    const t = s/WSEG;
    /* 低强度 → 贴近原表；高强度 → 整体向下压到 kFloor */
    return kBotBase[s] * (1 - t*0.25) * (1 - kFloor/0.34*(1 - (1-t)*1.0)*0.85);
  };
  /* 侧壁顶端的水线切边：紧贴水面的第一段不再发棕，混向偏暗的水色，
     让水线处形成清晰的"水陆分界"，而不是棕色一路压进水里。 */
  const seaCut = new THREE.Color(0x123448);
  for(let i=0;i<n;i++){
    const j = (i+1)%n;
    const interior = !!flags[i];
    const c = _tmpCol.setHex(interior ? CORE_COLOR : RIND_COLOR);
    /* 逐边明暗差 ±16%：崖壁由此出现一道道竖向岩柱的明暗，不是一整片均匀色块。 */
    const edgeK = 0.84 + hash2(i*7.3, fr.noiseSeed, 55)*0.32;
    const cr = c.r*edgeK, cg = c.g*edgeK, cb = c.b*edgeK;
    const sA = surfCol[i], sB = surfCol[j];   // 这条边两端的地表色
    const ax=pts[i][0]-CX, az=pts[i][1]-CY, ay=ys[i];
    const bx=pts[j][0]-CX, bz=pts[j][1]-CY, byy=ys[j];
    /* 这条边的墙高（侧壁上缘到海床的距离）。
       墙越高，越要靠"颜色分层 + 明暗跨栏"去拆解它，
       否则一大片均色在高强度下必然读成"一整块米棕大板"。 */
    const wallH = ((ay+byy)*0.5) - GROUND_Y;
    const hk = Math.max(0, Math.min(1, (wallH - 30) / 110));
    /* 顶端向地表色的混合比：墙越高混得越多（0.30 → 0.72）。 */
    const mixTop = 0.30 + hk*0.42;
    /* 竖向明暗跨度：墙越高跨度越大（底部压得越暗）。 */
    const kFloor = 0.34 - hk*0.26;
    /* 水线切边厚度：墙越高，切边越厚（第 0 段一定切，第 1 段按 hk 递进）。 */
    const cut2 = hk*0.42;
    /* 中段起浮：整条边在水平方向朝外鼓一点，低角度看过去不再是直线刀刃，
       而是一圈有起伏的岩壁。凸出量按边随机，避免整圈同步鼓包。 */
    const jit = fr.jitter || 1;
    const bulge = (2.0 + hash2(i*3.7, 11, fr.noiseSeed)*5.5) * jit;
    const exd = edgeDirX(pts, i), ezd = edgeDirZ(pts, i);
    for(let s=0;s<WSEG;s++){
      const t0 = s/WSEG, t1 = (s+1)/WSEG;
      /* 鼓包形状：sin(πt) —— 上下两端归零，保证侧壁顶面/底面严丝合缝 */
      const o0 = Math.sin(t0*Math.PI) * bulge;
      const o1 = Math.sin(t1*Math.PI) * bulge;
      const a0 = ay + (by-ay)*t0,   a1 = ay + (by-ay)*t1;     // A 侧上下
      const b0 = byy + (by-byy)*t0, b1 = byy + (by-byy)*t1;   // B 侧上下
      const a0x=ax+exd*o0, a0z=az+ezd*o0, a1x=ax+exd*o1, a1z=az+ezd*o1;
      const b0x=bx+exd*o0, b0z=bz+ezd*o0, b1x=bx+exd*o1, b1z=bz+ezd*o1;
      /* 逐层扰动：同一条崖壁出现一道道横向的岩层明暗。 */
      const lk0 = 0.90 + hash2(i*5.3, s*7.1, fr.noiseSeed)*0.20;
      const lk1 = 0.90 + hash2(i*5.3, (s+1)*7.1, fr.noiseSeed)*0.20;
      const kA = kBotAt(s, kFloor), kB = kBotAt(s+1, kFloor);
      const k0 = Math.max(0.08, kA)*lk0, k1 = Math.max(0.08, kB)*lk1;
      /* 越往下越偏红棕（沉积层理）。 */
      const k0R = k0*(1 + (1-k0)*0.14), k0B = k0*(1 - (1-k0)*0.16);
      const k1R = k1*(1 + (1-k1)*0.14), k1B = k1*(1 - (1-k1)*0.16);
      /* 顶端第 0 段向地表色靠拢。比例 mixTop 随墙高自适应：
         墙矮时（0.30）保住"断面就是饼干皮色"的识别度；
         墙高时（0.72）必须更多地表色，否则一大块纯棕。 */
      const mA = Math.max(0, mixTop - s*0.30), mB = Math.max(0, mixTop - (s+1)*0.30);
      let cr0 = sA.r*mA + cr*k0R*(1-mA), cg0 = sA.g*mA + cg*k0*(1-mA), cb0 = sA.b*mA + cb*k0B*(1-mA);
      let cr1 = sB.r*mB + cr*k1R*(1-mB), cg1 = sB.g*mB + cg*k1*(1-mB), cb1 = sB.b*mB + cb*k1B*(1-mB);
      /* 水线切边：第 0 段整段、第 1 段按墙高递进，混向暗水色。
         高墙时把切边做厚，水线才不被一块棕面压掉。 */
      const cut0 = (s===0) ? 0.86 : (s===1 ? cut2 : 0);
      const cut1 = ((s+1)===1) ? 0.86 : ((s+1)===2 ? cut2 : 0);
      cr0 = cr0*(1-cut0) + seaCut.r*cut0; cg0 = cg0*(1-cut0) + seaCut.g*cut0; cb0 = cb0*(1-cut0) + seaCut.b*cut0;
      cr1 = cr1*(1-cut1) + seaCut.r*cut1; cg1 = cg1*(1-cut1) + seaCut.g*cut1; cb1 = cb1*(1-cut1) + seaCut.b*cut1;
      pos.push(a0x,a0,a0z,  b0x,b0,b0z,  b1x,b1,b1z);
      pos.push(a0x,a0,a0z,  b1x,b1,b1z,  a1x,a1,a1z);
      col.push(cr0,cg0,cb0,  cr0,cg0,cb0,  cr1,cg1,cb1);
      col.push(cr0,cg0,cb0,  cr1,cg1,cb1,  cr1,cg1,cb1);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ══════════════════════════════════════════════════════════
   六、Three.js 场景
   ══════════════════════════════════════════════════════════ */
const viewport = document.getElementById('viewport');
const labelsEl = document.getElementById('labels');
let scene, camera, renderer, labelRenderer, controls, pmrem, envRT;
let lightDir, lightRim, hemi;
let fragGroup, terrainGroup, waterMesh, bedMesh, ringMesh, ringT0 = 0, ringScale = 0;
/* v1.4.0 水体：水面（直角网格）+ 程序化法线贴图。
   waterSide 已于 v1.4.0 废弃（恒为 null），保留变量名只为兼容既有判空引用。 */
let waterSide = null, waterNdTex = null, skyRT = null;
let wPosAttr = null, wNrmAttr = null, wBase = null, wFade = null, wCount = 0;

/* ══════════════════════════════════════════════════════════
   画质档位
   最吃性能的三样东西：像素比 / 阴影 / 环境光照。
   WB 内置预览窗口、360 极速浏览器这类环境 GPU 余量小，
   原来 DPR 上限 2 + VSM 软阴影 + 每帧无条件渲染 = 直接卡成幻灯片。
   ══════════════════════════════════════════════════════════ */
const QUALITY = {
  /* 水面参数（v1.4.0 重定）：v1.3.1 曾把 watEnv 抬到 0.44~0.60、watRough 压到
     0.13~0.28，想让水"有反射"。实测副作用更大：反射贴图里带的是天空的
     水平渐变，低角度看正好是一条条横向亮带，与极坐标网格的同心带叠在一起，
     就是用户看到的"水面上一条条色带"。v1.4.0 水面改哑光，反射只作点缀，
     所以这里三档统一收敛到 watRough 0.40~0.46 / watEnv 0.26~0.34，
     档位差异只体现在水纹清晰度（normalScale）上。
     🔴 注意：applyQuality() 会覆盖材质构造函数里的值，改水面观感必须同时改这张表。 */
  high:{ label:'高', dpr:1.5,  shadow:true,  shadowSize:1536, env:true,  watRough:0.40, watEnv:0.34 },
  mid: { label:'中', dpr:1.0,  shadow:true,  shadowSize:1024, env:true,  watRough:0.42, watEnv:0.32 },
  low: { label:'低', dpr:0.72, shadow:false, shadowSize:512,  env:false, watRough:0.46, watEnv:0.26 }
};
/* 起步一律「中」（像素比 1.0 + PCF 1024 阴影）：
   先保证任何一个环境都不至于第一眼就是幻灯片；
   跑得动的话 autoAdapt() 会在几秒内自动升到「高」，跑不动就往「低」掉。 */
const START_TIER = 'mid';
const Q_BAD  = { high:28, mid:22, low:14 };   // 低于此值算"卡"（低档再卡也没得降了）
const Q_GOOD = { mid:56, low:46 };            // 高于此值算"富余"（高档已封顶）
const Q_PREV = { high:'mid', mid:'low' };     // 降档方向
const Q_NEXT = { low:'mid', mid:'high' };     // 升档方向
let curTier = START_TIER;
let autoQ = true;
let autoQArmedAt = 0;    // 自动调节的最早生效时间（避开启动期抖动）
function createRenderer(){
  // 单一封装：将来切 WebGPURenderer 只需改这里
  // 不开 preserveDrawingBuffer —— 它会让每帧多一次缓冲拷贝，明显掉帧。
  // 「导出截图」改成先同步 render 再 toDataURL，效果一样（见 bindUI）。
  const r = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  r.shadowMap.enabled = true;
  // r186 已移除 PCFSoftShadowMap；而 VSM 每帧要多跑两趟模糊，太贵 → 用 PCF
  r.shadowMap.type = THREE.PCFShadowMap;
  /* 阴影按需更新 —— v1.2 最大的性能项。
     平行光的 shadow map 是一个固定的正交深度图，只要「几何 / 可见性 / 物体位置」
     没变，相机怎么转都不用重画。默认 autoUpdate=true 时每帧都要把整个场景
     再渲染一遍到深度图（物体数翻倍），这是静止观赏时最大的一笔浪费。
     改成 false 后由 touchShadow() 在真正变化的地方显式打点。 */
  r.shadowMap.autoUpdate = false;
  r.shadowMap.needsUpdate = true;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 0.98;
  r.outputColorSpace = THREE.SRGBColorSpace;
  return r;
}
function applyQuality(tier){
  curTier = tier;
  const q = QUALITY[tier] || QUALITY.mid;

  onResize();                                    // 改像素比后必须重设尺寸
  lightDir.castShadow = q.shadow && showShadow;
  lightDir.shadow.mapSize.set(q.shadowSize, q.shadowSize);
  if(lightDir.shadow.map){                       // 强制重建 shadow map
    lightDir.shadow.map.dispose();
    lightDir.shadow.map = null;
  }
  scene.environment = q.env ? envRT.texture : null;
  scene.environmentIntensity = q.env ? 0.32 : 0.0;
  hemi.intensity = q.env ? 0.20 : 0.30;          // 关环境光时补一点，免得全黑
  if(waterMesh){
    waterMesh.material.roughness = q.watRough;
    waterMesh.material.envMapIntensity = q.watEnv;   // envMap 本身常驻，不随档位关
    waterMesh.material.needsUpdate = true;
  }
  if(waterNdTex){
    /* v1.4.0：法线强度整体下调（0.34/0.46/0.55 → 0.16/0.20/0.24）。
       旧值在高反射基调下用来"把光打碎成细闪"；现在水面已改哑光，
       再给这么大的法线扰动，反而会在平整的大水面上搓出成片的高频噪点。
       档位差异保留（低档最弱、省像素着色），只是整体收窄。 */
    const ns = (tier==='low') ? 0.16 : (tier==='mid' ? 0.20 : 0.24);
    waterMesh.material.normalScale.set(ns, ns);
  }
  document.querySelectorAll('[data-q]').forEach(b=>{
    b.classList.toggle('on', autoQ ? b.dataset.q==='auto' : b.dataset.q===tier);
  });
  // 低档强制不投影，把「阴影」开关一并置灰，免得按钮亮着却看不到阴影
  const sb = document.querySelector('[data-tog="shadow"]');
  if(sb){
    sb.disabled = !q.shadow;
    sb.title = q.shadow ? '' : '「低」画质档不投射阴影（为省性能）';
  }
  touchShadow();         // 档位变了（阴影开关/贴图尺寸）→ 重画
}
/* ══════════════════════════════════════════════════════════
   水体（v1.4.0 整体重做）
   ══════════════════════════════════════════════════════════ */
/* v1.4.0：水面从「极坐标网格」换成「直角网格」。
   极坐标的问题在结构上：14 圈摊在 1520 单位直径上，每圈宽 ~54 单位，
   颜色按圈分档、位移按圈采样 —— 低角度看天然就是一圈圈同心亮暗带。
   直角网格没有"以相机为圆心"的环状结构，从原理上消灭同心带。
   行列数取 96×96（9216 顶点），在 1670 单位上每格 ~17 单位，
   近处足够密、远处靠雾和暗角收掉。 */
const WATER_SPAN = 1670;        // 水面边长（略大于底板，避免露出底板方角）
const WATER_GRID = 96;          // 直角网格行列数（每边 96 段）
/* 程序化水纹法线贴图：几何只承担长波（波长几百单位），
   细密的水面光泽交给这张贴图 —— 否则光靠顶点位移，波长 50 单位的纹路
   需要上万个顶点才不闪烁，完全不划算。 */
function makeWaterNormalMap(size){
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  /* 相位与频率比都刻意取成"不整齐"的值（3 / 4.7 / 6.3 / 9.1 / 13.4），
     否则各分量会在贴图边界处对齐，平铺后形成一片肉眼可辨的方格。 */
  const H = new Float32Array(size*size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const u = x/size*Math.PI*2, v = y/size*Math.PI*2;
      H[y*size+x] = Math.sin(u*3.0 + v*1.7 + 0.9)*0.46
                  + Math.sin(v*4.7 - u*0.6 + 2.3)*0.36
                  + Math.sin((u*1.9 + v*1.1)*2.6 + 4.1)*0.22
                  + Math.sin((u*1.3 - v*2.2)*4.3 + 1.1)*0.14
                  + Math.sin((u*2.7 + v*3.1)*4.9 + 5.6)*0.09;
    }
  }
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const l = H[y*size + ((x-1+size)%size)], rr = H[y*size + ((x+1)%size)];
      const up = H[((y-1+size)%size)*size + x], dn = H[((y+1)%size)*size + x];
      const nx = (l-rr)*3.2, ny = (up-dn)*3.2, nz = 1;
      const inv = 1/Math.sqrt(nx*nx + ny*ny + 1);
      const i = (y*size+x)*4;
      img.data[i]   = (nx*inv*0.5 + 0.5)*255;
      img.data[i+1] = (ny*inv*0.5 + 0.5)*255;
      img.data[i+2] = (nz*inv*0.5 + 0.5)*255;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  /* 非整数 + 不等比（5.5 × 4.1）并整体转 34°：即便贴图本身还有微弱周期，
     叠上旋转与非整数平铺之后，网格感在视觉上就散了。 */
  tex.repeat.set(5.5, 4.1);
  tex.center.set(0.5, 0.5);
  tex.rotation = 0.60;
  /* 各向异性过滤：水面是大面积掠射视角，各向异性不足时远处水纹会糊成一片噪点。
     取设备上限与 8 的较小值（低端 GPU 只支持 1/2/4，three 会自行钳位）。 */
  tex.anisotropy = Math.min(8, (renderer && renderer.capabilities) ? renderer.capabilities.getMaxAnisotropy() : 4);
  tex.colorSpace = THREE.NoColorSpace;   // 法线贴图不能当颜色做 sRGB 转换
  return tex;
}
/* 程序化「黄昏天空」环境贴图（只给水面用）。
   等距圆柱贴图，纵向自上而下：天顶深蓝 → 中天蓝 → 地平线暖金 → 地面暗褐。
   水面反射出来的就是这个渐变。 */
function makeSkyEnv(){
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0.00, '#17304a');
  g.addColorStop(0.34, '#2a5178');
  g.addColorStop(0.46, '#5c82a0');
  g.addColorStop(0.505,'#d8bb8a');
  g.addColorStop(0.56, '#6a4c30');
  g.addColorStop(1.00, '#100c08');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
/* v1.4.0：直角网格水面。
   为什么推翻极坐标：同心环的环宽 ~54 单位，且颜色/位移都按环采样，
   低角度就是一条条同心带 —— 那是"一块块"的根源，加顶点数也治不好。
   这里改成行列等距的方形网格，颜色只做**径向连续暗角**（没有分档跳变），
   波幅在近岸衰减到 0，保证与板块侧壁接得住。 */
function buildWaterSurface(){
  const N = WATER_GRID + 1, half = WATER_SPAN/2, step = WATER_SPAN/WATER_GRID;
  const count = N*N;
  const pos = new Float32Array(count*3), nrm = new Float32Array(count*3), col = new Float32Array(count*3);
  const base = new Float32Array(count*2), fade = new Float32Array(count);
  /* 单一基色 + 远端压暗，不再用"三段插值"（三段之间必然有分档跳变）。 */
  const cNear = new THREE.Color(0x1d5f78);
  const cFar  = new THREE.Color(0x0b2338);
  const tmp = new THREE.Color();
  const R2 = (WATER_SPAN/2);
  let k = 0;
  for(let iz=0; iz<N; iz++){
    for(let ix=0; ix<N; ix++){
      const x = -half + ix*step, z = -half + iz*step;
      const r = Math.hypot(x, z) / R2;              // 0（中心）→ 1（边缘）
      /* 连续暗角：用 smoothstep 而不是分段常量，杜绝任何"档"。 */
      const t = Math.min(1, r*1.06);
      const s = t*t*(3 - 2*t);
      tmp.copy(cNear).lerp(cFar, s);
      /* 近岸（r 大）波幅衰减到 0：接板块侧壁处不会翘起来。 */
      fade[k] = 1 - Math.pow(Math.min(1, r*1.02), 4);
      base[k*2] = x; base[k*2+1] = z;
      pos[k*3] = x; pos[k*3+1] = 0; pos[k*3+2] = z;
      nrm[k*3+1] = 1;
      col[k*3] = tmp.r; col[k*3+1] = tmp.g; col[k*3+2] = tmp.b;
      k++;
    }
  }
  const tri = [];
  for(let iz=0; iz<WATER_GRID; iz++){
    for(let ix=0; ix<WATER_GRID; ix++){
      const a = iz*N + ix, b = a + 1, c = a + N, d = c + 1;
      tri.push(a, c, b);
      tri.push(b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  g.setIndex(tri);
  g.computeBoundingSphere();
  wPosAttr = g.attributes.position;
  wNrmAttr = g.attributes.normal;
  wBase = base; wFade = fade; wCount = count;
  return g;
}
/* 每帧更新水面顶点：只改 y 与法线，x/z 用预存的静态数组，省掉三角函数里的坐标重算 */
function updateWater(now){
  if(!wPosAttr) return;
  const t = now*0.001;
  const P = wPosAttr.array, Nn = wNrmAttr.array, B = wBase, F = wFade;
  /* v1.4.0：顶点位移只承担"近处波光"，不再承担结构感 ——
     幅度从 2.3/1.5/0.62 收到 1.1/0.7/0.3。旧值在低角度下会把水面顶成
     一道道的起伏，配合极坐标环就是"一块块"的帮凶。 */
  const AMP1 = 1.1, K1 = 0.0210, S1 = 1.05;
  const AMP2 = 0.7, K2 = 0.0285, S2 = 0.86;
  const AMP3 = 0.3, K3 = 0.0470, S3 = 1.75;
  for(let i=0;i<wCount;i++){
    const x = B[i*2], z = B[i*2+1], f = F[i];
    const p1 = x*K1 + t*S1;
    const p2 = z*K2 - t*S2;
    const p3 = (x*0.62 + z)*K3 + t*S3;
    P[i*3+1] = (Math.sin(p1)*AMP1 + Math.sin(p2)*AMP2 + Math.sin(p3)*AMP3) * f;
    /* 法线用解析导数算（比 computeVertexNormals 快得多，也不必每帧重遍历三角面）。
       忽略 fade 的梯度只是近似 —— 岸边那点偏差肉眼看不出来。 */
    const dx = (Math.cos(p1)*AMP1*K1 + Math.cos(p3)*AMP3*K3*0.62) * f;
    const dz = (Math.cos(p2)*AMP2*K2 + Math.cos(p3)*AMP3*K3) * f;
    const inv = 1/Math.sqrt(dx*dx + 1 + dz*dz);
    Nn[i*3] = -dx*inv; Nn[i*3+1] = inv; Nn[i*3+2] = -dz*inv;
  }
  wPosAttr.needsUpdate = true;
  wNrmAttr.needsUpdate = true;
}

  const bedGeo = new THREE.BoxGeometry(WATER_SPAN*0.82, 30, WATER_SPAN*0.82);

  bedMesh = new THREE.Mesh(bedGeo, bedMat);
