  $('btnShot').onclick = ()=>{
    try{
      // 关掉了 preserveDrawingBuffer（省一次逐帧缓冲拷贝），
      // 所以必须"先同步 render、再同步 toDataURL"，用异步 toBlob 会读到空帧。
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'map3d_' + (S.worldName||'world') + '_' + seed + '.png';
      a.click();
      addLog('🖼 截图已导出（不含标注文字：标注是 DOM 层，不在画布内）');
      needsDraw = true;
    }catch(err){ addLog('⚠ 截图失败：' + err.message); }
  };
}
function fallbackCopy(t, done){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ addLog('⚠ 复制失败，请手动选中文本'); }
  document.body.removeChild(ta);
}

/* ══════════════════════════════════════════════════════════
   十五、主循环与启动
   ══════════════════════════════════════════════════════════ */
/* ── v1.3 开场动效：地貌从海床"长"出来 + 天光渐亮 + 标注淡入 ──
   三件事同步起跑，1.1 秒内收完。"啪"一下全部出现太平淡，
   而且看不出地形是从水里升起的 —— 而"立体化"正是这个作品的命题。
   做法很省：只对 terrainGroup 做整体 y 缩放（以海平面为支点），
   不用给每个地貌物单独做动画，一帧的开销和静止时一样。 */
const BASE_LIGHT = 1.45, BASE_RIM = 0.50;
const GROW_MS = 1150, LIGHT_MS = 1000;
let growT0 = 0, lightT0 = 0;
function startWorldGrow(){
  const now = performance.now();
  growT0 = now; lightT0 = now;
  if(terrainGroup) terrainGroup.scale.set(1, 0.03, 1);
  if(lightDir) lightDir.intensity = BASE_LIGHT*0.22;
  if(lightRim) lightRim.intensity = BASE_RIM*0.22;
  if(labelsEl) labelsEl.classList.remove('ready');
  setTimeout(()=>{ if(labelsEl) labelsEl.classList.add('ready'); }, 520);
  needsDraw = true;
}
/* ── 渲染调度（性能核心）──────────────────────────────────────
   原来每帧无条件全量渲染（还带上 CSS2D 标注的 DOM 写入），
   空闲时也在烧 GPU —— 在 WB 内置窗口这类 GPU 余量小的环境里直接卡死。
   改成：
     · 有动静（拖拽 / 动画 / 蓄力 / 落锤抖屏）→ 每帧渲染
     · 完全静止 → 最多每 70ms 一帧（水面仍留微动，肉眼无差别；
       同时也是丢帧自愈的兜底）
     · 标注 DOM 每 2 帧更新一次，省掉一半 style 写入
     · 只统计"活跃帧"的帧率，避免空闲节流把 fps 拉低而误判降档
─────────────────────────────────────────────────────────────── */
let needsDraw = true;
let lastDraw = 0;
const IDLE_GAP = 300;      // v1.2：静止保底从 ~14fps 降到 ~3fps（只有交互/动画才逐帧画）
let labs = 0, fpsFrames = 0, fpsT0 = 0, lastActive = 0;
let badStreak = 0, goodStreak = 0, lastFps = 0;
let promoteBlockedUntil = 0;   // 刚降过档就禁止立刻升档，防止在两档之间来回跳
let drawCount = 0;         // 诊断用：累计真正渲染的帧数

/* 双向自适应：连续 3 个采样窗（约 2 秒）都卡就降一档，都富余就升一档。
   阈值上下留大间隔（22 ↔ 56），并且降档后 45 秒内禁止升档 ——
   否则会在两档之间来回横跳（低档 60fps → 升中档 → 中档 20fps → 又降回来）。 */
function autoAdapt(fps){
  const bad = Q_BAD[curTier], good = Q_GOOD[curTier];
  const now = performance.now();
  if(fps < bad){
    goodStreak = 0;
    if(++badStreak >= 3 && Q_PREV[curTier]){
      const next = Q_PREV[curTier];
      badStreak = 0;
      promoteBlockedUntil = now + 45000;
      applyQuality(next);
      addLog('⚙ 帧率偏低（' + Math.round(fps) + 'fps）→ 画质自动降到「' + QUALITY[next].label + '」');
    }
  } else if(good && fps > good && now > promoteBlockedUntil){
    badStreak = 0;
    if(++goodStreak >= 3 && Q_NEXT[curTier]){
      const next = Q_NEXT[curTier];
      goodStreak = 0;
      applyQuality(next);
      addLog('⚙ 帧率有余量（' + Math.round(fps) + 'fps）→ 画质自动升到「' + QUALITY[next].label + '」');
    }
  } else { badStreak = 0; goodStreak = 0; }
}

function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  let busy = false;

  // 蓄力：按时间推进（不依赖鼠标移动），力度条同步
  if(charging){
    busy = true;                       // 按住期间保持重绘，力度反馈才跟手
    charge = Math.min(1, (now-chargeStart)/CHARGE_MS);
    const fb = document.getElementById('forceBar');
    const fv = document.getElementById('forceVal');
    if(fb) fb.style.width = (charge*100).toFixed(0)+'%';
    if(fv) fv.textContent = Math.round(charge*100)+'%';
  }

  // 漂移 / 抛落动画
  for(const fr of S.fragments){
    if(fr.animT0!=null && fr.mesh){
      busy = true;
      const off = currentOffset(fr, now);
      fr.mesh.position.set(off[0], driftSink(fr), off[1]);
      renderer.shadowMap.needsUpdate = true;   // 漂移动画期间阴影跟随
    }
  }
  // 冲击波环
  if(ringMesh && ringMesh.visible){
    busy = true;
    const t = (now - ringT0)/480;
    if(t>=1) ringMesh.visible = false;
    else {
      const s = 22 + t*ringScale;
      ringMesh.scale.set(s, 1, s);
      ringMesh.material.opacity = (1-t)*0.8;
    }
  }
  // v1.3 开场：地貌升起 + 天光渐亮
  if(growT0){
    busy = true;
    const t = Math.min(1, (now-growT0)/GROW_MS);
    const e = 1 - Math.pow(1-t, 3);
    terrainGroup.scale.set(1, 0.03 + 0.97*e, 1);
    if(t >= 1){ terrainGroup.scale.set(1,1,1); growT0 = 0; }
  }
  if(lightT0){
    busy = true;
    const t = Math.min(1, (now-lightT0)/LIGHT_MS);
    const e = 0.22 + 0.78*(1 - Math.pow(1-t, 2));
    lightDir.intensity = BASE_LIGHT*e;
    lightRim.intensity = BASE_RIM*e;
    if(t >= 1) lightT0 = 0;
  }
  /* 水面：整块 mesh 上下平移换成真正的顶点波浪（三个正弦叠加，岸边衰减到 0），
     法线同步用解析导数重算，水纹贴图缓慢滚动 —— 静止时也能看出水在动。 */
  if(waterMesh && waterMesh.visible){
    updateWater(now);
    if(waterNdTex){
      waterNdTex.offset.x = (now*0.0000165) % 1;
      waterNdTex.offset.y = (now*0.0000115) % 1;
    }
  }
  // 相机动画
  if(camAnim){
    busy = true;
    const t = Math.min(1, (now-camAnim.t0)/camAnim.dur);
    const e = 1 - Math.pow(1-t, 3);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    if(t>=1) camAnim = null;
  }
  controls.update();          // 内部触发 'change' → needsDraw = true
  // 镜头抖动
  if(shake > 0.25){
    busy = true;
    camera.position.x += (Math.random()-0.5)*shake*0.6;
    camera.position.y += (Math.random()-0.5)*shake*0.6;
    camera.position.z += (Math.random()-0.5)*shake*0.6;
    shake *= 0.85;
  } else shake = 0;

  // ── 这一帧要不要画 ──
  const active = busy || needsDraw;
  if(!active && (now - lastDraw) < IDLE_GAP) return;
  needsDraw = false;
  lastDraw = now;

  // 标签分级显示：视角越平，越少标注，避免糊成一片
  if(labelRenderer && showLabel){
    const camY = camera.position.y;
    labelsEl.classList.toggle('hide-poi', camY < 380);
    labelsEl.classList.toggle('hide-sub', camY < 620);
  }

  renderer.render(scene, camera);
  drawCount++;
  if(labelRenderer && showLabel && (++labs & 1) === 0) labelRenderer.render(scene, camera);

  // ── 帧率统计 + 自动适配 ──
  //   关键：采样窗只在"活跃帧"上累加，且不能被偶发的空闲帧打断
  //   （之前每遇一个空闲帧就重置窗口，导致窗口永远凑不满 700ms，降档形同虚设）。
  if(active){
    fpsFrames++;
    lastActive = now;
    if(!fpsT0) fpsT0 = now;
    const span = now - fpsT0;
    if(span >= 700){
      const fps = fpsFrames*1000/span;
      lastFps = +fps.toFixed(1);
      const el = document.getElementById('fpsVal');
      if(el) el.textContent = Math.round(fps) + ' fps';
      const dc = document.getElementById('drawVal');
      if(dc) dc.textContent = renderer.info.render.calls + '×';
      fpsFrames = 0; fpsT0 = 0;
      if(autoQ && now > autoQArmedAt) autoAdapt(fps);
    }
  } else if(fpsT0 && now - lastActive > 600){
    fpsFrames = 0; fpsT0 = 0;      // 确实没在动了，重新开始采样
  }
}

function boot(){
  try{
    // 能力检测：three r163+ 只支持 WebGL2，没有就直接给可读提示，不要死等
    const probe = document.createElement('canvas');
    const gl2 = probe.getContext('webgl2');
    if(!gl2){
      failBoot('⚠ 这个浏览器不支持 WebGL2，跑不了 3D。<br>'
        + '<span style="color:#e8dcc0">建议用较新的 Chrome / Edge / 360极速浏览器（极速模式），'
        + '并确认没有关闭"硬件加速"。</span>');
      return;
    }
    initThree();
    bindUI();
    attachPointer();
    newCookie(seed);
    // 自动降档等渲染稳定后再判断，避开启动期的卡顿干扰
    autoQArmedAt = performance.now() + 3000;
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) needsDraw = true; });
    addLog('🤖 3D 版启动 · Three.js r186（单文件内联）· 画质「'
      + QUALITY[curTier].label + '」· 立体化 ' + Math.round(reliefAmt*100));
    loop();
    // 调试 / 自动化测试接口
    window.__MG = {
      S, camera, renderer, scene, controls, fragGroup, terrainGroup,
      /* v1.4.0：把水面相关对象也暴露出来，方便单独隔离调试 */
      get waterMesh(){ return waterMesh; }, get waterSide(){ return waterSide; },
      get bedMesh(){ return bedMesh; }, get ringMesh(){ return ringMesh; },
      SEA_Y, BED_Y, GROUND_Y, WATER_SPAN, WATER_GRID,
      pickAt, smash, finalize, newCookie, applyDrift, setView, rebuildFragments, buildTerrain,
      get charge(){ return charge; },
      get charging(){ return charging; },
      get tier(){ return curTier; },
      get autoQ(){ return autoQ; },
      get shapePick(){ return shapePick; },
      setShape: k=>{ shapePick = k; shapeMenuSync(); },
      surfaceYAt, edgeGap, topYAt, fragmentAt, mergeFragments,
      buildLandforms, classifyLandforms, landStats, buildReefs,
      startWorldGrow, LANDFORM,
      get landforms(){ const o={}; for(const f of S.fragments) if(f.landform) o[f.landform]=(o[f.landform]||0)+1; return o; },
      get geoLabels(){ return S.geoLabels || []; },
      get reefSpots(){ return S.reefSpots || []; },
      get terrainStat(){ const m = terrainGroup.children.find(o=>o.userData && o.userData.kind==='mount'); return m ? m.userData.mntStat : null; },
      QUALITY, quality: applyQuality,
      get draws(){ return drawCount; },
      perf: ()=>({ tier:curTier, autoQ, dpr:+renderer.getPixelRatio().toFixed(2),
        canvas:[renderer.domElement.width, renderer.domElement.height],
        shadow:lightDir.castShadow, shadowMap:[lightDir.shadow.mapSize.x, lightDir.shadow.mapSize.y],
        env:!!scene.environment, idleGap:IDLE_GAP,
        merged:!!fragMerged, fragMeshCount:fragGroup.children.length,
        calls:renderer.info.render.calls, tris:renderer.info.render.triangles,
        shadowAuto:renderer.shadowMap.autoUpdate,
        armed: performance.now() > autoQArmedAt,
        badStreak, goodStreak, lastFps,
        fps:(document.getElementById('fpsVal')||{}).textContent || '' }),
      chargeInfo: ()=>({ charging, charge:+charge.toFixed(3), chargeStart:+chargeStart.toFixed(1),
        bar: document.getElementById('forceBar').style.width,
        val: document.getElementById('forceVal').textContent }),
      info: ()=>{
        const c = renderer.domElement;
        const r = c.getBoundingClientRect();
        return {
          phase:S.phase, frags:S.fragments.length, cracks:S.cracks.length,
          hitMode:S.eatMode, drift:S.driftAmp, relief:reliefAmt,
          canvasCss:[r.left, r.top, r.width, r.height],
          canvasPx:[c.width, c.height],
          fragMeshes:fragGroup.children.length,
          camPos:camera.position.toArray().map(v=>Math.round(v)),
          target:controls.target.toArray().map(v=>Math.round(v)),
          regions:S.fragments.filter(f=>f.name).length,
          labels:document.querySelectorAll('#labels .lbl').length
        };
      },
      probe: (cx, cy)=>{          // 从网页坐标打一条射线，报告命中情况
        const hits = (()=>{ ray.setFromCamera(toNDC(cx,cy), camera); return ray.intersectObjects(fragGroup.children, false); })();
        return { client:[cx,cy], ndc:[+ndc.x.toFixed(3), +ndc.y.toFixed(3)],
          hitCount:hits.length, dist: hits.length? +hits[0].distance.toFixed(1): null,
          fragId: hits.length? hits[0].object.userData.fragId : null,
          point: hits.length? hits[0].point.toArray().map(v=>+v.toFixed(1)) : null };
      }
    };
    setTimeout(()=>{
      booted = true;                    // 告诉看门狗：起来了
      $('loadmask').classList.add('hide');
      setView('iso');
    }, 420);
  }catch(err){
    failBoot('⚠ 启动失败：' + (err && err.message ? err.message : err));
    throw err;
  }
}
boot();
})();
</script>
