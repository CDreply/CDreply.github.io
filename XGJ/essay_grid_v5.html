<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文作文模拟 v5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e6e2d8;font-family:"KaiTi","STKaiti","FangSong","SimSun",serif;display:flex;justify-content:center;padding:20px 12px}

/* 主卡片 */
.card{background:#fff;width:1280px;max-width:100%;box-shadow:0 4px 24px rgba(0,0,0,.18);border-radius:4px;position:relative;padding:16px 24px 10px;border:1px solid #ccc}

/* 顶部标题行 + 内嵌工具栏 */
.top-row{display:flex;align-items:center;margin-bottom:8px;gap:0}
.top-label{font-size:13px;font-weight:bold;color:#111;letter-spacing:2px;white-space:nowrap;padding-right:16px;border-right:2px solid #ddd;margin-right:16px;line-height:1}
.tb-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:4px;flex:1}
.tb-inline textarea{width:320px;height:38px;border:1px solid #c9c3b5;border-radius:5px;padding:6px 10px;
  font-size:13px;font-family:"FangSong","KaiTi",serif;resize:none;line-height:1.7;color:#333;background:#fafaf5;transition:border-color .2s}
.tb-inline textarea:focus{outline:none;border-color:#4a90d9;box-shadow:0 0 0 2px rgba(74,144,217,.1)}
.tb-inline button{padding:6px 18px;border:none;border-radius:5px;font-size:13px;cursor:pointer;font-weight:500;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;transition:all .15s}
.bf{background:#4a90d9;color:#fff}.bf:hover{background:#357abd}
.bc{background:#f0f0f0;color:#666}.bc:hover{background:#e0e0e0}
.bp{background:#27ae60;color:#fff}.bp:hover{background:#1e8449}
.tb-inline .mini-stats{display:flex;gap:14px;font-size:12px;color:#999}
.tb-inline .mini-stats b{color:#c0392b;font-size:13px}

/* 分隔线 */
.divider{height:1.5px;background:#222;margin-bottom:0}

/* 三栏格子区 */
.cols-wrap{position:relative}
.cols-flex{display:flex;gap:0}
.col-block{flex:1;display:flex;flex-direction:column;border-left:1.5px solid #bbb;min-width:0}
.col-block:first-child{border-left:none}

/* 每栏表格 */
table.gt{border-collapse:collapse;table-layout:fixed;width:100%}
table.gt td{width:100%;height:26px;border:1px solid #cec6ae;text-align:center;vertical-align:middle;
  font-size:15px;font-family:"KaiTi","STKaiti","FangSong",serif;color:#1a1a1a;padding:0;cursor:text;
  background:#fffef8;outline:none;line-height:26px;user-select:none;position:relative}
table.gt td.filled{color:#1a1a1a}
table.gt td.active{background:#dbe8fd}
table.gt td.active::after{content:'';position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;border:2px solid #4a90d9;pointer-events:none}
/* 间隔行样式 */
table.gt tr.gap-row td{height:6px;background:#f5f0e1;border:none;padding:0}
/* 每5行加深分隔线 */

/* 底部统计栏 */
.footer-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:5px 18px;
  border-top:1px solid #ddd;background:#fbf8ef;font-size:12px;color:#666;border-radius:0 0 3px 3px}
.footer-bar .wc{font-weight:bold;font-size:17px}
.footer-bar .wc.red{color:#c0392b}.footer-bar .wc.green{color:#27ae60}
.footer-bar .wcl{color:#aaa;font-size:11px;margin-left:3px}
.footer-bar .gi{color:#aaa;font-size:11px}

/* 打印样式（仅用于图片打印模式） */
@page{size:A4 landscape;margin:0}
@media print{
  .tb-inline,.footer-bar,.bp,.bf,.bc,#pb,.mini-stats{display:none!important}
}
@media(max-width:1320px){.card{width:100%}}
@media(max-width:900px){
  .top-row{flex-direction:column;align-items:flex-start;gap:8px}
  .tb-inline textarea{width:100%}
  .cols-flex{flex-direction:column}
  .col-block{border-left:none;border-top:1.5px solid #bbb}
}
@media(max-width:600px){.tb-inline .mini-stats{display:none}}
</style>
</head>
<body>

<!-- 答题卡 -->
<div class="card">

  <!-- 标题 + 工具栏 -->
  <div class="top-row">
    <div class="top-label">六、写作（60分）</div>
    <div class="tb-inline">
      <textarea id="pb" placeholder="粘贴作文内容 → 点击「填入格子」自动分布…"></textarea>
      <button class="bf" onclick="doFill()">填入格子</button>
      <button class="bc" onclick="doClear()">清空</button>
      <button class="bp" onclick="doPrint()">导出试卷</button>
      <div class="mini-stats">
        <span>不含标点 <b id="sc">0</b> 字</span>
        <span>已用 <b id="su">0</b>/<b id="sa">0</b></span>
        <span id="wcLine" style="color:#c0392b"></span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 三栏格子区 -->
  <div class="cols-wrap">
    <div class="cols-flex" id="colsFlex"></div>
  </div>

  <!-- 底部统计 -->
  <div class="footer-bar">
    <div><span class="wc red" id="wc">0</span><span class="wcl">字（不含标点）</span></div>
    <div class="gi" id="gi">已用 0 格 / 共 0 格</div>
  </div>

</div>

<script>
"use strict";
const COLS = 20;
const COLS_COUNT = 3;
const ROWS_PER_COL = 22;
const TOTAL = COLS * ROWS_PER_COL * COLS_COUNT;

// 标点集合（不计入字数）
const PUNCT = new Set('，。、；：？！「」『』（）【】《》“”‘’．…—～·,.;:?!()[]"\'-—……');
function isPunct(ch){ return PUNCT.has(ch) || /\s/.test(ch); }

let gridData = new Array(TOTAL).fill('');  // 每格字符
let cellEls = [];                          // 所有td DOM引用
let activeIdx = -1;

// ==================== 初始化 ====================
function init(){
  const flex = document.getElementById('colsFlex');
  flex.innerHTML = '';
  cellEls = [];

  for(let col = 0; col < COLS_COUNT; col++){
    const block = document.createElement('div');
    block.className = 'col-block';
    const tbl = document.createElement('table');
    tbl.className = 'gt';
    tbl.id = 'gt' + col;

    for(let r = 0; r < ROWS_PER_COL; r++){
      const tr = document.createElement('tr');
      tr.className = 'data-row' + ( (r+1)%5===0 && r < ROWS_PER_COL-1 ? ' sep-below' : '' );
      for(let k = 0; k < COLS; k++){
        const idx = col * (ROWS_PER_COL*COLS) + r * COLS + k;
        const td = document.createElement('td');
        td.setAttribute('data-idx', idx);
        td.contentEditable = true;
        td.oninput = () => onCellInput(td, idx);
        td.onclick = () => setActive(idx);
        td.onkeydown = (e) => onCellKey(td, idx, e);
        tr.appendChild(td);
        cellEls.push(td);
      }
      tbl.appendChild(tr);
      // 每行后插入间隔行（最后一行除外）
      if(r < ROWS_PER_COL - 1){
        const gap = document.createElement('tr');
        gap.className = 'gap-row';
        const gapTd = document.createElement('td');
        gapTd.setAttribute('colspan', COLS);
        gap.appendChild(gapTd);
        tbl.appendChild(gap);
      }
    }
    block.appendChild(tbl);
    flex.appendChild(block);
  }

  document.getElementById('sa').textContent = TOTAL;
  redrawAll();
  upAll();

  // 监听文本框实时更新工具栏统计
  document.getElementById('pb').addEventListener('input', upTool);
}

// ==================== 重绘所有格子内容 ====================
function redrawAll(){
  for(let i = 0; i < TOTAL; i++){
    const td = cellEls[i];
    const ch = gridData[i];
    td.textContent = ch || '';
    td.className = ch ? 'filled' : '';
    if(i === activeIdx) td.classList.add('active');
  }
}

// ==================== 单元格交互 ====================
function setActive(idx){
  activeIdx = idx;
  cellEls.forEach((td, i) => td.classList.toggle('active', i === idx));
}

function onCellInput(td, idx){
  const t = (td.textContent || '').replace(/\n/g, '');
  if(t.length > 1){
    // 多字符输入：第一个留本格，其余往后填
    td.textContent = t[0];
    gridData[idx] = t[0];
    let rest = t.slice(1);
    for(let j = 0; j < rest.length && idx+j+1 < TOTAL; j++){
      if(!gridData[idx+j+1]){
        gridData[idx+j+1] = rest[j];
        cellEls[idx+j+1].textContent = rest[j];
      }
    }
  } else {
    gridData[idx] = t || '';
  }
  // 自动跳下一格
  if(t.length === 1 && idx < TOTAL - 1){
    setTimeout(()=>{ try{cellEls[idx+1].focus(); placeCaret(cellEls[idx+1])}catch(e){} }, 0);
  }
  redrawAll();
  upAll(); upTool();
}

function onCellKey(td, idx, e){
  if(e.key === 'Backspace'){
    if(!td.textContent && idx > 0){
      e.preventDefault();
      gridData[idx-1] = '';
      cellEls[idx-1].textContent = '';
      cellEls[idx-1].focus();
      setTimeout(()=>placeCaret(cellEls[idx-1]), 0);
    }
  }
  if(e.key === 'Enter'){
    // 换行分段：跳到下一行开头
    e.preventDefault();
    const row = Math.floor(idx / COLS);
    const nextRowStart = (row + 1) * COLS;
    if(nextRowStart < TOTAL){
      cellEls[nextRowStart].focus();
      placeCaret(cellEls[nextRowStart]);
      setActive(nextRowStart);
    }
  }
  if(e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); cellEls[idx-1].focus(); placeCaret(cellEls[idx-1]); }
  if(e.key === 'ArrowRight' && idx < TOTAL-1){ e.preventDefault(); cellEls[idx+1].focus(); placeCaret(cellEls[idx+1]); }
  if(e.key === 'ArrowUp' && idx >= COLS){ e.preventDefault(); cellEls[idx-COLS].focus(); placeCaret(cellEls[idx-COLS]); }
  if(e.key === 'ArrowDown' && idx + COLS < TOTAL){ e.preventDefault(); cellEls[idx+COLS].focus(); placeCaret(cellEls[idx+COLS]); }
}

function placeCaret(el){
  el.focus();
  try{
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }catch(e){}
}

// ==================== 填入/清空 ====================
// 标题判定：仅首段（第一个非空段落）且字数 < 9 时视为标题，自动居中
// 若首段字数 >= 9，则视为正文，从第一格（第0格，不缩进）开始填入
const TITLE_MAX_LEN = 16;

function doFill(){
  const raw = document.getElementById('pb').value;
  // 按换行分段（单换行或空行均视为分段）
  const paragraphs = raw.split(/\n/);
  let fillIdx = 0;
  let isFirstPara = true;  // 标记是否为第一个非空段落

  gridData.fill('');

  for(let p = 0; p < paragraphs.length; p++){
    const para = paragraphs[p].replace(/\s/g, '');
    if(!para) continue;

    // 确保 fillIdx 对齐到行开头
    const rowStart = Math.floor(fillIdx / COLS) * COLS;
    if(fillIdx > rowStart){
      fillIdx = rowStart + COLS;  // 跳到下一行开头
    } else {
      fillIdx = rowStart;
    }
    if(fillIdx >= TOTAL) break;

    if(isFirstPara && para.length < TITLE_MAX_LEN){
      // === 首段 且 字数 < 9：视为标题，居中填入 ===
      const startOffset = Math.floor((COLS - para.length) / 2);
      const startPos = fillIdx + startOffset;
      for(let i = 0; i < para.length && startPos + i < TOTAL; i++){
        gridData[startPos + i] = para[i];
      }
      fillIdx = fillIdx + COLS;  // 跳到下一行

    } else if(isFirstPara && para.length >= TITLE_MAX_LEN){
      // === 首段 但 字数 >= 9：不是标题，从本行第0格开始填（不缩进）===
      for(let i = 0; i < para.length && fillIdx < TOTAL; i++){
        gridData[fillIdx] = para[i];
        fillIdx++;
      }
      if(fillIdx < TOTAL){
        const currentRow = Math.floor(fillIdx / COLS);
        fillIdx = (currentRow + 1) * COLS;
      }

    } else {
      // === 非首段（正文段落）：首行缩进2格 ===
      fillIdx += 2;
      if(fillIdx >= TOTAL) break;

      for(let i = 0; i < para.length && fillIdx < TOTAL; i++){
        gridData[fillIdx] = para[i];
        fillIdx++;
      }
      if(fillIdx < TOTAL){
        const currentRow = Math.floor(fillIdx / COLS);
        fillIdx = (currentRow + 1) * COLS;
      }
    }

    isFirstPara = false;  // 处理完第一个非空段落后，后续均为正文
  }

  redrawAll(); upAll(); upTool();
}

function doClear(){
  gridData.fill('');
  document.getElementById('pb').value = '';
  redrawAll(); upAll(); upTool();
}

// ==================== 打印试卷（Canvas绘制→图片→打印） ====================
function doPrint(){
  // 取消焦点框
  activeIdx = -1;
  cellEls.forEach(td => td.classList.remove('active'));

  // ---- Canvas 参数（按实际内容计算，不预设 A4 尺寸）----
  const DPI = 150;  // 输出分辨率

  // 页面参数（mm → px）
  const PAGE_W_mm = 297, PAGE_H_mm = 210;  // A4 横版
  const MARGIN_mm = 8;                      // 统一边距
  const PAGE_W_px = Math.round(PAGE_W_mm / 25.4 * DPI);   // ≈1753
  const PAGE_H_px = Math.round(PAGE_H_mm / 25.4 * DPI);   // ≈1239
  const PAD = Math.round(MARGIN_mm / 25.4 * DPI);          // ≈47px

  // 可绘图区域
  const DRAW_W = PAGE_W_px - PAD * 2;

  // 格子尺寸（在可绘图区域内均匀分布）
  const COL_SEP = 2;  // 栏间分隔线宽
  const GRID_W = DRAW_W;
  const CELL_W = Math.floor((GRID_W - COL_SEP * (COLS_COUNT - 1)) / (COLS * COLS_COUNT));
  const CELL_H = Math.round(CELL_W * 0.85);
  const GAP_H = Math.max(3, Math.round(CELL_H * 0.18));   // 间隔行
  const FONT_SZ = Math.max(10, Math.round(CELL_H * 0.58)); // 字号
  const HEADER_H = Math.round(FONT_SZ * 2.6);

  // 三栏实际宽度
  const ACTUAL_GRID_W = CELL_W * COLS * COLS_COUNT + COL_SEP * (COLS_COUNT - 1);
  const START_X = PAD + Math.floor((DRAW_W - ACTUAL_GRID_W) / 2);

  // 内容总高度
  const COL_H = ROWS_PER_COL * CELL_H + (ROWS_PER_COL - 1) * GAP_H;
  const CONTENT_H = PAD + HEADER_H + 2 + COL_H + PAD;

  // ---- Canvas：精确匹配内容高度（不填满整页）----
  const CV_W = PAGE_W_px;
  const CV_H = CONTENT_H;  // ← 关键：不用PAGE_H_px，用实际高度
  const cv = document.createElement('canvas');
  cv.width = CV_W;
  cv.height = CV_H;
  const ctx = cv.getContext('2d');

  // ===== 白底 =====
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, CV_W, CV_H);

  let cy = PAD;

  // ===== 标题 =====
  ctx.font = 'bold ' + FONT_SZ + 'px "SimSun", "FangSong", "KaiTi", serif';
  ctx.fillStyle = '#111';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u516D\u3001\u5199\u4F5C\uFF0860\u5206\uFF09', START_X, cy + HEADER_H * 0.45);
  cy += HEADER_H;

  // ===== 分隔线 =====
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(START_X, cy);
  ctx.lineTo(START_X + ACTUAL_GRID_W, cy);
  ctx.stroke();
  cy += 2;

  // ===== 三栏格子 =====
  for(let col = 0; col < COLS_COUNT; col++){
    const cx_col = START_X + col * (COLS * CELL_W + COL_SEP);

    // 栏分隔竖线
    if(col > 0){
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx_col - COL_SEP, cy);
      ctx.lineTo(cx_col - COL_SEP, cy + COL_H);
      ctx.stroke();
    }

    for(let r = 0; r < ROWS_PER_COL; r++){
      const ry = cy + r * (CELL_H + GAP_H);

      for(let k = 0; k < COLS; k++){
        const rx = cx_col + k * CELL_W;
        const idx = col * (ROWS_PER_COL * COLS) + r * COLS + k;

        // 格子背景+边框
        ctx.fillStyle = '#fffefa';
        ctx.fillRect(rx, ry, CELL_W, CELL_H);
        ctx.strokeStyle = '#c9c3a8';
        ctx.lineWidth = 0.7;
        ctx.strokeRect(rx + 0.35, ry + 0.35, CELL_W - 0.7, CELL_H - 0.7);

        // 文字
        const ch = gridData[idx];
        if(ch){
          ctx.fillStyle = '#1a1a1a';
          ctx.font = FONT_SZ + 'px "SimSun", "FangSong", "KaiTi", serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ch, rx + CELL_W / 2, ry + CELL_H / 2);
        }
      }

      // 间隔行
      if(r < ROWS_PER_COL - 1){
        ctx.fillStyle = '#f3efe0';
        ctx.fillRect(cx_col, ry + CELL_H, COLS * CELL_W, GAP_H);
      }
    }
  }

  // ===== 导出图片 → 新窗口（强制单页打印） =====
  try{
    const imgURL = cv.toDataURL('image/png', 1.0);
    const win = window.open('', '_blank');
    win.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>\u4F5C\u6587\u8BD5\u5377</title>' +
      '<style>' +
      '*{margin:0;padding:0;box-sizing:border-box}' +
      '@page{size:A4 landscape;margin:0}' +
      'html{width:100%;height:100%}' +
      'body{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;' +
      'background:#fff;overflow:hidden}' +
      'img{width:auto;height:auto;max-width:100vw;max-height:100vh;' +
      'display:block;object-fit:contain}' +
      '@media print{' +
      'html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden!important}' +
      'body{display:flex!important;align-items:center!important;justify-content:center!important}' +
      'img{max-width:100%!important;max-height:100vh!important;' +
      'width:auto!important;height:auto!important;page-break-inside:avoid;' +
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '}</style>' +
      '</head><body>' +
      '<img src="' + imgURL + '"/>' +
      '</body></html>'
    );
    win.document.close();
  } catch(e){
    alert('\u6253\u5370\u5931\u8D25\uFF1A' + e.message);
  }
}

// ==================== 统计 ====================
function upAll(){
  let chars = 0, used = 0;
  for(let i = 0; i < TOTAL; i++){
    if(gridData[i]){
      used++;
      if(!isPunct(gridData[i])) chars++;
    }
  }
  const wcEl = document.getElementById('wc');
  wcEl.textContent = chars;
  wcEl.className = 'wc ' + (chars >= 800 ? 'green' : 'red');
  document.getElementById('gi').textContent = '已用 ' + used + ' 格 / 共 ' + TOTAL + ' 格';

  // 工具栏行内统计
  const wl = document.getElementById('wcLine');
  if(chars >= 800){ wl.textContent = '✓ 达标'; wl.style.color = '#27ae60'; }
  else { wl.textContent = '差 ' + Math.max(0, 800 - chars) + ' 字'; wl.style.color = '#c0392b'; }
}

function upTool(){
  const raw = document.getElementById('pb').value;
  const text = raw.replace(/\s/g, '');
  let ch = 0;
  for(const c of text) if(!isPunct(c)) ch++;
  document.getElementById('sc').textContent = ch;
  let u = 0;
  for(let i = 0; i < TOTAL; i++) if(gridData[i]) u++;
  document.getElementById('su').textContent = u;
}

init();
</script>
</body>
</html>
