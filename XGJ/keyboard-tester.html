<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键盘测试小工具 v2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #12121f;
  --bg2:       #1a1a2e;
  --bg3:       #1e1e38;
  --border:    #2e2e50;
  --border2:   #3a3a5a;
  --accent:    #7c83ff;
  --accent2:   #56d0c0;
  --green-bg:  #132b22;
  --green-bd:  #276644;
  --green-tx:  #4fd4a0;
  --text:      #d4d4e8;
  --muted:     #7070a0;
  --muted2:    #505070;
  --key-h:     42px;
  --key-w:     42px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
  user-select: none;
  overflow-x: hidden;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.topbar-title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-title h1 {
  font-size: 16px;
  font-weight: 500;
  color: #fff;
}
.topbar-title span {
  font-size: 12px;
  color: var(--muted);
}
.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* ── Layout toggle ── */
.layout-tabs {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.layout-tab {
  padding: 6px 14px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: transparent;
  border-radius: 0;
  transition: background 0.15s, color 0.15s;
}
.layout-tab.active {
  background: var(--accent);
  color: #fff;
}
.layout-tab:hover:not(.active) { color: #fff; }

/* ── Main layout ── */
.main {
  display: flex;
  gap: 0;
  height: calc(100vh - 57px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 14px;
  gap: 14px;
  overflow-y: auto;
}
.sidebar-section { display: flex; flex-direction: column; gap: 8px; }
.sidebar-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted2);
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* stat cards */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.stat-card {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
}
.stat-value {
  font-size: 20px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
}
.stat-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}

/* progress */
.prog-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
}
.progress-bar {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

/* key info */
.key-info-panel {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px;
  min-height: 86px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.key-big {
  font-size: 22px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
}
.key-details { display: flex; flex-direction: column; gap: 3px; }
.key-detail-row {
  display: flex;
  gap: 6px;
  font-size: 11px;
}
.kdr-label { color: var(--muted); min-width: 46px; }
.kdr-val   { color: var(--text); word-break: break-all; }
.kdi-placeholder {
  color: var(--muted2);
  font-size: 11px;
  text-align: center;
  padding: 10px 0;
}

/* nkro */
.nkro-badge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 11px;
  color: var(--muted);
}
.nkro-num {
  font-size: 18px;
  font-weight: 500;
  color: var(--accent);
}

/* sidebar buttons */
.sb-btn {
  width: 100%;
  padding: 7px;
  font-size: 12px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.sb-btn:hover { background: var(--border2); color: #fff; }
.sb-btn.primary { border-color: var(--accent); color: var(--accent); }
.sb-btn.primary:hover { background: var(--accent); color: #fff; }

/* ── Center panel ── */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 16px 20px;
  gap: 12px;
}

/* ── Keyboard wrap ── */
.keyboard-outer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
}
.keyboard-wrap {
  background: #0d0d1e;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 16px 14px;
  display: inline-block;
}
.kb-row {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
  justify-content: flex-start;
}

/* ── Keys ── */
.key {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-bottom: 3px solid var(--border);
  border-radius: 6px;
  color: #c0c0d8;
  font-size: 11px;
  height: var(--key-h);
  min-width: var(--key-w);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px 4px;
  text-align: center;
  cursor: default;
  transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.08s;
  line-height: 1.2;
  position: relative;
  flex-shrink: 0;
}
.key .sk { font-size: 9px;  color: var(--muted); line-height: 1; }
.key .mk { font-size: 11px; line-height: 1; }
.key .fn-hint {
  position: absolute;
  bottom: 2px;
  right: 3px;
  font-size: 8px;
  color: #4a90c4;
  opacity: 0.8;
}

/* Pressed */
.key.pressed {
  background: var(--accent);
  border-color: #9ca3ff;
  border-bottom-color: #5560bb;
  color: #fff;
  transform: translateY(1px);
}
/* Tested */
.key.tested {
  background: var(--green-bg);
  border-color: var(--green-bd);
  color: var(--green-tx);
}
.key.tested .sk { color: #2e9a6a; }
.key.tested.pressed {
  background: var(--accent);
  border-color: #9ca3ff;
  color: #fff;
}
/* Fn-active (when Fn key is held) */
.key.fn-highlight {
  background: #1a2a3e;
  border-color: #4a90c4;
  color: #7ac8f0;
}

/* special widths - 104 */
.kw-bs  { min-width: 86px; }
.kw-tab { min-width: 66px; }
.kw-caps{ min-width: 78px; }
.kw-ent { min-width: 90px; }
.kw-shl { min-width: 104px; }
.kw-shr { min-width: 110px; }
.kw-ctl { min-width: 62px; }
.kw-alt { min-width: 56px; }
.kw-spc { min-width: 280px; }
.kw-win { min-width: 50px; font-size: 14px; }
.kw-ctx { min-width: 44px; }
.kw-del { min-width: 62px; }

/* 61 key board special */
.kw-spc61 { min-width: 220px; }
.kw-shl61 { min-width: 124px; }
.kw-shr61 { min-width: 124px; }
.kw-bs61  { min-width: 74px; }

/* Gap helpers */
.gap    { min-width: 16px; flex-shrink: 0; }
.gap-sm { min-width: 6px;  flex-shrink: 0; }
.spacer { min-width: 46px; flex-shrink: 0; }

/* ── History ── */
.history-area {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 50px;
  max-height: 90px;
  overflow-y: auto;
}
.history-area-label {
  font-size: 10px;
  color: var(--muted2);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.history-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.pill {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  color: var(--text);
  animation: pop 0.12s ease;
}
@keyframes pop {
  from { transform: scale(0.75); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

/* ── Fn mapping panel (61 layout) ── */
.fn-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  display: none;
}
.fn-panel.visible { display: block; }
.fn-panel-title {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
}
.fn-table {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 4px 8px;
}
.fn-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
}
.fn-combo {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 1px 6px;
  color: #7ac8f0;
  font-size: 10px;
  white-space: nowrap;
}
.fn-arrow { color: var(--muted2); font-size: 10px; }
.fn-result { color: var(--text); font-size: 10px; }
.fn-tested-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted2);
  flex-shrink: 0;
}
.fn-tested-dot.done { background: var(--green-tx); }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    <h1>⌨ 沉答简单键盘测试</h1>
    <span>按下按键开始 · 绿=已测 · 紫=当前按下</span>
  </div>
  <div class="topbar-actions">
    <div class="layout-tabs">
      <button class="layout-tab active" id="tab-104" onclick="switchLayout('104')">104 全键盘</button>
      <button class="layout-tab" id="tab-61" onclick="switchLayout('61')">61 紧凑键盘</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">测试统计</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-value" id="tested-count">0</div>
          <div class="stat-label">已测键</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-count">0</div>
          <div class="stat-label">总键数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="press-count">0</div>
          <div class="stat-label">按键次数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pct">0%</div>
          <div class="stat-label">完成度</div>
        </div>
      </div>
      <div>
        <div class="prog-row">
          <span>进度</span>
          <span id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">按键信息</div>
      <div class="key-info-panel" id="key-info">
        <div class="kdi-placeholder">按下任意键查看详情</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">NKRO / 无冲测试</div>
      <div class="nkro-badge">
        <span>同时按下</span>
        <span class="nkro-num" id="nkro">0</span>
        <span>键</span>
      </div>
      <div style="font-size:10px;color:var(--muted);line-height:1.5;">
        同时按多键，数字若能正常增加则支持全键无冲（NKRO）

　　 （F2、F3、PRTSC等部分自定义按键被系统先行使用本页面无法识别是正常现象，请以实际使用为准，本页面仅供参考）
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">操作</div>
      <button class="sb-btn primary" onclick="resetAll()">重置测试</button>
      <button class="sb-btn" onclick="clearHistory()">清空记录</button>
    </div>
  </div>

  <!-- Center -->
  <div class="center">
    <div class="keyboard-outer">
      <div class="keyboard-wrap" id="keyboard"></div>
    </div>

    <!-- Fn mapping panel (61 only) -->
    <div class="fn-panel" id="fn-panel">
      <div class="fn-panel-title">
        Fn 组合键参考（绿点=已触发）&nbsp;·&nbsp;
        <span style="color:var(--muted2);font-size:10px;">注：部分键盘 Fn 由硬件处理，浏览器无法捕获</span>
      </div>
      <div class="fn-table" id="fn-table"></div>
    </div>

    <!-- History -->
    <div class="history-area">
      <div class="history-area-label">
        <span>按键记录</span>
        <span style="cursor:pointer;color:var(--muted)" onclick="clearHistory()">清空</span>
      </div>
      <div class="history-pills" id="history"></div>
    </div>
  </div>
</div>

<script>
// ── 104 Layout ──────────────────────────────────────────────────
const LAYOUT_104 = [
  // Fn row
  [ {c:'Escape',l:'Esc'}, 'gap',
    {c:'F1',l:'F1'},{c:'F2',l:'F2'},{c:'F3',l:'F3'},{c:'F4',l:'F4'}, 'gap-sm',
    {c:'F5',l:'F5'},{c:'F6',l:'F6'},{c:'F7',l:'F7'},{c:'F8',l:'F8'}, 'gap-sm',
    {c:'F9',l:'F9'},{c:'F10',l:'F10'},{c:'F11',l:'F11'},{c:'F12',l:'F12'}, 'gap',
    {c:'PrintScreen',l:'PrtSc'},{c:'ScrollLock',l:'ScrLk'},{c:'Pause',l:'Pause'},
  ],
  // Number row
  [ {c:'Backquote',s:'~',m:'`'},
    {c:'Digit1',s:'!',m:'1'},{c:'Digit2',s:'@',m:'2'},{c:'Digit3',s:'#',m:'3'},
    {c:'Digit4',s:'$',m:'4'},{c:'Digit5',s:'%',m:'5'},{c:'Digit6',s:'^',m:'6'},
    {c:'Digit7',s:'&',m:'7'},{c:'Digit8',s:'*',m:'8'},{c:'Digit9',s:'(',m:'9'},
    {c:'Digit0',s:')',m:'0'}, {c:'Minus',s:'_',m:'-'},{c:'Equal',s:'+',m:'='},
    {c:'Backspace',l:'⌫ Backspace',w:'kw-bs'},
    'gap',
    {c:'Insert',l:'Ins'},{c:'Home',l:'Home'},{c:'PageUp',l:'PgUp'},
    'gap',
    {c:'NumLock',l:'NumLk'},{c:'NumpadDivide',l:'/'},{c:'NumpadMultiply',l:'×'},{c:'NumpadSubtract',l:'−'},
  ],
  // QWERTY
  [ {c:'Tab',l:'Tab ⇥',w:'kw-tab'},
    {c:'KeyQ',l:'Q'},{c:'KeyW',l:'W'},{c:'KeyE',l:'E'},{c:'KeyR',l:'R'},
    {c:'KeyT',l:'T'},{c:'KeyY',l:'Y'},{c:'KeyU',l:'U'},{c:'KeyI',l:'I'},
    {c:'KeyO',l:'O'},{c:'KeyP',l:'P'},
    {c:'BracketLeft',s:'{',m:'['},{c:'BracketRight',s:'}',m:']'},{c:'Backslash',s:'|',m:'\\'},
    'gap',
    {c:'Delete',l:'Del',w:'kw-del'},{c:'End',l:'End'},{c:'PageDown',l:'PgDn'},

    {c:'Numpad7',l:'7'},{c:'Numpad8',l:'8'},{c:'Numpad9',l:'9'},{c:'NumpadAdd',l:'+',h:'numpad-add'},
  ],
  // ASDF
  [ {c:'CapsLock',l:'Caps ⇪',w:'kw-caps'},
    {c:'KeyA',l:'A'},{c:'KeyS',l:'S'},{c:'KeyD',l:'D'},{c:'KeyF',l:'F'},
    {c:'KeyG',l:'G'},{c:'KeyH',l:'H'},{c:'KeyJ',l:'J'},{c:'KeyK',l:'K'},
    {c:'KeyL',l:'L'},{c:'Semicolon',s:':',m:';'},{c:'Quote',s:'"',m:"'"},
    {c:'Enter',l:'Enter ↵',w:'kw-ent'},
    'gap',
    'spacer','spacer','spacer',
    'gap',
    {c:'Numpad4',l:'4'},{c:'Numpad5',l:'5'},{c:'Numpad6',l:'6'},{c:'__numpad-add-filler'},
  ],
  // ZXCV
  [ {c:'ShiftLeft',l:'⇧ Shift',w:'kw-shl'},
    {c:'KeyZ',l:'Z'},{c:'KeyX',l:'X'},{c:'KeyC',l:'C'},{c:'KeyV',l:'V'},
    {c:'KeyB',l:'B'},{c:'KeyN',l:'N'},{c:'KeyM',l:'M'},
    {c:'Comma',s:'<',m:','},{c:'Period',s:'>',m:'.'},{c:'Slash',s:'?',m:'/'},
    {c:'ShiftRight',l:'Shift ⇧',w:'kw-shr'},
    'gap',
    'spacer',{c:'ArrowUp',l:'▲'},'spacer',
    'gap',
    {c:'Numpad1',l:'1'},{c:'Numpad2',l:'2'},{c:'Numpad3',l:'3'},{c:'NumpadEnter',l:'Enter',h:'numpad-ent'},
  ],
  // Bottom
  [ {c:'ControlLeft',l:'Ctrl',w:'kw-ctl'},{c:'MetaLeft',l:'⊞',w:'kw-win'},{c:'AltLeft',l:'Alt',w:'kw-alt'},
    {c:'Space',l:'',w:'kw-spc'},
    {c:'AltRight',l:'Alt',w:'kw-alt'},{c:'MetaRight',l:'⊞',w:'kw-win'},{c:'ContextMenu',l:'☰',w:'kw-ctx'},{c:'ControlRight',l:'Ctrl',w:'kw-ctl'},
    'gap',
    {c:'ArrowLeft',l:'◀'},{c:'ArrowDown',l:'▼'},{c:'ArrowRight',l:'▶'},
    'gap',
    {c:'Numpad0',l:'0',w:'kw-bs'},{c:'NumpadDecimal',l:'·'},{c:'__numpad-ent2'},
  ],
];

// ── 61 Layout ──────────────────────────────────────────────────
// Standard 61-key (GH60/Anne Pro style)
// Fn key itself usually has no keycode — use a virtual placeholder
const LAYOUT_61 = [
  // Number row
  [ {c:'Escape',l:'Esc'},
    {c:'Digit1',s:'!',m:'1'},{c:'Digit2',s:'@',m:'2'},{c:'Digit3',s:'#',m:'3'},
    {c:'Digit4',s:'$',m:'4'},{c:'Digit5',s:'%',m:'5'},{c:'Digit6',s:'^',m:'6'},
    {c:'Digit7',s:'&',m:'7'},{c:'Digit8',s:'*',m:'8'},{c:'Digit9',s:'(',m:'9'},
    {c:'Digit0',s:')',m:'0'}, {c:'Minus',s:'_',m:'-'},{c:'Equal',s:'+',m:'='},
    {c:'Backspace',l:'⌫',w:'kw-bs61'},
  ],
  // QWERTY
  [ {c:'Tab',l:'Tab',w:'kw-tab'},
    {c:'KeyQ',l:'Q'},{c:'KeyW',l:'W'},{c:'KeyE',l:'E'},{c:'KeyR',l:'R'},
    {c:'KeyT',l:'T'},{c:'KeyY',l:'Y'},{c:'KeyU',l:'U'},{c:'KeyI',l:'I'},
    {c:'KeyO',l:'O'},{c:'KeyP',l:'P'},
    {c:'BracketLeft',s:'{',m:'['},{c:'BracketRight',s:'}',m:']'},{c:'Backslash',s:'|',m:'\\'},
  ],
  // ASDF
  [ {c:'CapsLock',l:'Caps',w:'kw-caps'},
    {c:'KeyA',l:'A'},{c:'KeyS',l:'S'},{c:'KeyD',l:'D'},{c:'KeyF',l:'F'},
    {c:'KeyG',l:'G'},{c:'KeyH',l:'H'},{c:'KeyJ',l:'J'},{c:'KeyK',l:'K'},
    {c:'KeyL',l:'L'},{c:'Semicolon',s:':',m:';'},{c:'Quote',s:'"',m:"'"},
    {c:'Enter',l:'Enter',w:'kw-ent'},
  ],
  // ZXCV
  [ {c:'ShiftLeft',l:'⇧ Shift',w:'kw-shl61'},
    {c:'KeyZ',l:'Z'},{c:'KeyX',l:'X'},{c:'KeyC',l:'C'},{c:'KeyV',l:'V'},
    {c:'KeyB',l:'B'},{c:'KeyN',l:'N'},{c:'KeyM',l:'M'},
    {c:'Comma',s:'<',m:','},{c:'Period',s:'>',m:'.'},{c:'Slash',s:'?',m:'/'},
    {c:'ShiftRight',l:'Shift ⇧',w:'kw-shr61'},
  ],
  // Bottom
  [ {c:'ControlLeft',l:'Ctrl',w:'kw-ctl'},{c:'MetaLeft',l:'⊞',w:'kw-win'},{c:'AltLeft',l:'Alt',w:'kw-alt'},
    {c:'Space',l:'',w:'kw-spc61'},
    {c:'AltRight',l:'Alt',w:'kw-alt'},
    {c:'__Fn',l:'Fn',w:'kw-win'},   // virtual Fn key
    {c:'ContextMenu',l:'☰',w:'kw-ctx'},{c:'ControlRight',l:'Ctrl',w:'kw-ctl'},
  ],
];

// Fn combo reference for 61-key boards (common mapping)
const FN_COMBOS_61 = [
  {combo:'Fn+`',  result:'~',      code:'Backquote'},
  {combo:'Fn+1',  result:'F1',     code:'F1'},
  {combo:'Fn+2',  result:'F2',     code:'F2'},
  {combo:'Fn+3',  result:'F3',     code:'F3'},
  {combo:'Fn+4',  result:'F4',     code:'F4'},
  {combo:'Fn+5',  result:'F5',     code:'F5'},
  {combo:'Fn+6',  result:'F6',     code:'F6'},
  {combo:'Fn+7',  result:'F7',     code:'F7'},
  {combo:'Fn+8',  result:'F8',     code:'F8'},
  {combo:'Fn+9',  result:'F9',     code:'F9'},
  {combo:'Fn+0',  result:'F10',    code:'F10'},
  {combo:'Fn+-',  result:'F11',    code:'F11'},
  {combo:'Fn+=',  result:'F12',    code:'F12'},
  {combo:'Fn+BS', result:'Del',    code:'Delete'},
  {combo:'Fn+W',  result:'▲ Up',   code:'ArrowUp'},
  {combo:'Fn+A',  result:'◀ Left', code:'ArrowLeft'},
  {combo:'Fn+S',  result:'▼ Down', code:'ArrowDown'},
  {combo:'Fn+D',  result:'▶ Right',code:'ArrowRight'},
  {combo:'Fn+P',  result:'PrtSc',  code:'PrintScreen'},
  {combo:'Fn+[',  result:'Home',   code:'Home'},
  {combo:'Fn+]',  result:'End',    code:'End'},
  {combo:'Fn+\\', result:'PgUp',   code:'PageUp'},
  {combo:'Fn+;',  result:'PgDn',   code:'PageDown'},
  {combo:'Fn+Ins',result:'Insert', code:'Insert'},
];

// ── State ─────────────────────────────────────────────────────
let currentLayout = '104';
const codeMap = {};
const allKeys = new Set();
const testedKeys = new Set();
const pressedKeys = new Set();
let pressCount = 0;
const historyItems = [];
const MAX_HIST = 60;

// ── Build keyboard ─────────────────────────────────────────────
function buildKeyboard(layout) {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  Object.keys(codeMap).forEach(k => delete codeMap[k]);
  allKeys.clear();

  const rows = layout === '61' ? LAYOUT_61 : LAYOUT_104;

  rows.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'kb-row';

    row.forEach(key => {
      if (key === 'gap')    { const g=document.createElement('div'); g.className='gap';    rowDiv.appendChild(g); return; }
      if (key === 'gap-sm') { const g=document.createElement('div'); g.className='gap-sm'; rowDiv.appendChild(g); return; }
      if (key === 'spacer') { const g=document.createElement('div'); g.className='spacer'; rowDiv.appendChild(g); return; }
      if (typeof key === 'string') return;
      // skip layout placeholder entries like __numpad-add-filler
      if (key.c && key.c.startsWith('__') && key.c !== '__Fn') {
        const g = document.createElement('div');
        g.style.minWidth = '46px';
        g.style.height = 'var(--key-h)';
        rowDiv.appendChild(g);
        return;
      }

      const div = document.createElement('div');
      div.className = 'key' + (key.w ? ' ' + key.w : '');
      div.dataset.key = key.c;

      if (key.s && key.m) {
        div.innerHTML = `<span class="sk">${key.s}</span><span class="mk">${key.m}</span>`;
      } else {
        div.innerHTML = `<span class="mk">${key.l || key.c}</span>`;
      }

      // Fn-hint for 61 keys that have Fn combos
      if (layout === '61') {
        const hint = getFnHintForKeyCode(key.c);
        if (hint) {
          const h = document.createElement('span');
          h.className = 'fn-hint';
          h.textContent = hint;
          div.appendChild(h);
        }
      }

      // Virtual Fn key
      if (key.c === '__Fn') {
        div.id = 'virtual-fn-key';
        rowDiv.appendChild(div);
        return;
      }

      const effectiveCode = key.h === 'numpad-ent' ? 'NumpadEnter' :
                            key.h === 'numpad-add' ? 'NumpadAdd' :
                            (key.c && !key.c.startsWith('__')) ? key.c : null;
      if (effectiveCode) {
        if (!codeMap[effectiveCode]) codeMap[effectiveCode] = [];
        codeMap[effectiveCode].push(div);
        allKeys.add(effectiveCode);
      }

      rowDiv.appendChild(div);
    });

    kb.appendChild(rowDiv);
  });

  updateStats();
}

function getFnHintForKeyCode(code) {
  const map = {
    'Digit1':'F1','Digit2':'F2','Digit3':'F3','Digit4':'F4',
    'Digit5':'F5','Digit6':'F6','Digit7':'F7','Digit8':'F8',
    'Digit9':'F9','Digit0':'F10','Minus':'F11','Equal':'F12',
    'Backspace':'Del','KeyW':'↑','KeyA':'←','KeyS':'↓','KeyD':'→',
  };
  return map[code] || null;
}

// ── Fn combo panel ─────────────────────────────────────────────
function buildFnPanel() {
  const t = document.getElementById('fn-table');
  t.innerHTML = '';
  FN_COMBOS_61.forEach(fc => {
    const row = document.createElement('div');
    row.className = 'fn-row';
    row.dataset.fncode = fc.code;
    const tested = testedKeys.has(fc.code);
    row.innerHTML = `
      <div class="fn-tested-dot${tested?' done':''}"></div>
      <span class="fn-combo">${fc.combo}</span>
      <span class="fn-arrow">→</span>
      <span class="fn-result">${fc.result}</span>
    `;
    t.appendChild(row);
  });
}

function updateFnDots() {
  document.querySelectorAll('[data-fncode]').forEach(row => {
    const code = row.dataset.fncode;
    const dot = row.querySelector('.fn-tested-dot');
    if (dot) dot.className = 'fn-tested-dot' + (testedKeys.has(code) ? ' done' : '');
  });
}

// ── Layout switch ──────────────────────────────────────────────
function switchLayout(l) {
  currentLayout = l;
  document.getElementById('tab-104').className = 'layout-tab' + (l==='104'?' active':'');
  document.getElementById('tab-61').className  = 'layout-tab' + (l==='61'?' active':'');
  testedKeys.clear();
  pressedKeys.clear();
  pressCount = 0;
  historyItems.length = 0;
  document.getElementById('history').innerHTML = '';
  document.getElementById('key-info').innerHTML = '<div class="kdi-placeholder">按下任意键查看详情</div>';
  document.getElementById('nkro').textContent = '0';
  buildKeyboard(l);
  const fp = document.getElementById('fn-panel');
  if (l === '61') { fp.classList.add('visible'); buildFnPanel(); }
  else fp.classList.remove('visible');
  updateStats();
}

// ── Stats ──────────────────────────────────────────────────────
function updateStats() {
  const total = allKeys.size;
  const tested = testedKeys.size;
  const pct = total > 0 ? Math.round(tested / total * 100) : 0;
  document.getElementById('tested-count').textContent = tested;
  document.getElementById('total-count').textContent = total;
  document.getElementById('press-count').textContent = pressCount;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${tested} / ${total}`;
}

// ── Key events ────────────────────────────────────────────────
function dispKey(e) {
  if (e.key === ' ') return 'Space';
  if (e.key.length === 1) return e.key.toUpperCase();
  return e.key;
}

document.addEventListener('keydown', e => {
  e.preventDefault();
  const code = e.code;
  pressCount++;
  pressedKeys.add(code);

  if (allKeys.has(code) && !testedKeys.has(code)) testedKeys.add(code);

  (codeMap[code] || []).forEach(el => {
    el.classList.add('pressed');
    if (allKeys.has(code)) el.classList.add('tested');
  });

  updateStats();
  if (currentLayout === '61') updateFnDots();
  document.getElementById('nkro').textContent = pressedKeys.size;

  // Info panel
  const kd = dispKey(e);
  const mods = [e.ctrlKey&&'Ctrl', e.shiftKey&&'Shift', e.altKey&&'Alt', e.metaKey&&'Meta'].filter(Boolean);
  document.getElementById('key-info').innerHTML = `
    <div class="key-big">${kd === 'Space' ? '⎵' : kd}</div>
    <div class="key-details">
      <div class="key-detail-row"><span class="kdr-label">key</span><span class="kdr-val">${e.key === ' ' ? 'Space' : e.key}</span></div>
      <div class="key-detail-row"><span class="kdr-label">code</span><span class="kdr-val">${e.code}</span></div>
      <div class="key-detail-row"><span class="kdr-label">keyCode</span><span class="kdr-val">${e.keyCode}</span></div>
      <div class="key-detail-row"><span class="kdr-label">修饰键</span><span class="kdr-val">${mods.length ? mods.join('+') : '无'}</span></div>
    </div>
  `;

  // History
  const hist = document.getElementById('history');
  const pill = document.createElement('div');
  pill.className = 'pill';
  pill.textContent = kd === 'Space' ? '⎵' : kd;
  hist.insertBefore(pill, hist.firstChild);
  historyItems.unshift(kd);
  if (historyItems.length > MAX_HIST) {
    historyItems.pop();
    if (hist.lastChild) hist.removeChild(hist.lastChild);
  }
});

document.addEventListener('keyup', e => {
  e.preventDefault();
  pressedKeys.delete(e.code);
  document.getElementById('nkro').textContent = pressedKeys.size;
  (codeMap[e.code] || []).forEach(el => el.classList.remove('pressed'));
});

// ── Reset / clear ─────────────────────────────────────────────
function resetAll() {
  testedKeys.clear();
  pressedKeys.clear();
  pressCount = 0;
  historyItems.length = 0;
  document.querySelectorAll('.key').forEach(el => el.classList.remove('pressed','tested'));
  document.getElementById('key-info').innerHTML = '<div class="kdi-placeholder">按下任意键查看详情</div>';
  document.getElementById('history').innerHTML = '';
  document.getElementById('nkro').textContent = '0';
  if (currentLayout === '61') updateFnDots();
  updateStats();
}

function clearHistory() {
  document.getElementById('history').innerHTML = '';
  historyItems.length = 0;
}

// ── Init ──────────────────────────────────────────────────────
buildKeyboard('104');
window.addEventListener('keydown', e => e.preventDefault(), {capture: true});
</script>
</body>
</html>
