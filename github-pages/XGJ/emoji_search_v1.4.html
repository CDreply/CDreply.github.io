<html lang="zh-CN">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: white;
      font-size: 2.2rem;
      margin-bottom: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    /* 搜索区域 */
    .search-box {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .search-row {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    .input-side, .output-side {
      flex: 1;
      min-height: 140px;
      border-radius: 16px;
      padding: 20px;
    }
    .input-side {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      transition: border-color 0.3s;
    }
    .input-side:focus-within { border-color: #667eea; }
    .output-side {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border: 2px solid #dee2e6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .side-label {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .input-side textarea {
      width: 100%;
      height: 80px;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      resize: none;
      outline: none;
      color: #333;
    }
    .input-side textarea::placeholder { color: #adb5bd; }
    .emoji-result { font-size: 4.5rem; line-height: 1.2; text-align: center; }
    .emoji-meaning { font-size: 0.95rem; color: #6c757d; margin-top: 8px; text-align: center; }
    /* 分类标签 */
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.3);
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.5); transform: translateY(-2px); }
    .tab-btn.active { background: white; color: #667eea; font-weight: 600; }
    /* emoji列表 */
    .emoji-grid {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .emoji-section { margin-bottom: 25px; }
    .emoji-section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 1.1rem;
      color: #495057;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e9ecef;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .emoji-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .emoji-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      background: #f8f9fa;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .emoji-item:hover {
      background: #e9ecef;
      transform: scale(1.08);
      border-color: #667eea;
    }
    .emoji-item .emoji { font-size: 2.2rem; margin-bottom: 4px; }
    .emoji-item .text { font-size: 0.75rem; color: #6c757d; text-align: center; }
    .no-result { text-align: center; padding: 40px; color: #6c757d; }
    .no-result .icon { font-size: 3rem; margin-bottom: 10px; }
    @media (max-width: 600px) {
      .search-row { flex-direction: column; }
      .emoji-list { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }

</head>

</div>

  symbols: {title: "💝 符号", icon: "💝"},
};

let currentCategory = "all";

function renderEmojiList(filter = "") {
  const grid = document.getElementById("emojiGrid");
  let data = emojiData;
  
  if (currentCategory !== "all") {
    data = data.filter(e => e.category === currentCategory);
  }
  
  if (filter) {
    const q = filter.toLowerCase().trim();
    data = data.filter(e => 
      e.text.toLowerCase().includes(q) ||
      e.keywords.some(k => k.toLowerCase().includes(q))
    );
  }
  
  if (data.length === 0) {
    grid.innerHTML = `
      <div class="no-result">
        <div class="icon">🔍</div>
        <p>没有找到匹配的表情</p>
        <p style="font-size:0.85rem;margin-top:8px;">试试其他关键词吧</p>
      </div>
    `;
    return;
  }
  
  let html = "";
  if (!filter) {
    // 按分类显示
    const cats = currentCategory === "all" 
      ? ["emotion","people","animals","food","nature","objects","symbols"]
      : [currentCategory];
    
    cats.forEach(cat => {
      const catData = emojiData.filter(e => e.category === cat);
      if (catData.length === 0) return;
      const catInfo = categoryNames[cat];
      html += `
        <div class="emoji-section">
          <div class="section-title">${catInfo.icon} ${catInfo.title}</div>
          <div class="emoji-list">
            ${catData.map(e => `
              <div class="emoji-item" data-emoji="${e.emoji}" data-text="${e.text}" title="${e.text}">
                <span class="emoji">${e.emoji}</span>
                <span class="text">${e.text}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    });
  } else {
    // 搜索结果不分组
    html = `
      <div class="emoji-section">
        <div class="section-title">🔍 搜索结果 (${data.length}个)</div>
        <div class="emoji-list">
          ${data.map(e => `
            <div class="emoji-item" data-emoji="${e.emoji}" data-text="${e.text}" title="${e.text}">
              <span class="emoji">${e.emoji}</span>
              <span class="text">${e.text}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }
  
  grid.innerHTML = html;
  
  // 点击复制
  document.querySelectorAll(".emoji-item").forEach(item => {
    item.addEventListener("click", () => {
      const emoji = item.dataset.emoji;
      navigator.clipboard.writeText(emoji).then(() => {
        const orig = item.querySelector(".emoji").textContent;
        item.querySelector(".emoji").textContent = "✅";
        item.style.borderColor = "#28a745";
        setTimeout(() => {
          item.querySelector(".emoji").textContent = orig;
          item.style.borderColor = "transparent";
        }, 600);
      });
    });
  });
}

  if (!match) {
    match = emojiData.find(e =>
      e.text.toLowerCase().includes(q) ||
      e.keywords.some(k => k.toLowerCase().includes(q))
    );
  }
  if (match) return { emoji: match.emoji, text: match.text };

  return { emoji: q, text: q };
}

// 多关键词搜索（空格分隔，各匹配后横向拼接）
function search(query) {
  const resultEl = document.getElementById("emojiResult");
  const meaningEl = document.getElementById("emojiMeaning");

  if (!query.trim()) {
    resultEl.textContent = "❓";
    meaningEl.textContent = "输入描述获取表情";
    return;
  }

  const parts = query.trim().split(/\s+/);

  if (parts.length === 1) {
    const result = matchKeyword(parts[0].toLowerCase());
    resultEl.textContent = result.emoji;
    meaningEl.textContent = result.text;
  } else {
    const emojis = parts.map(p => matchKeyword(p.toLowerCase()).emoji);
    resultEl.textContent = emojis.join(" ");
    meaningEl.textContent = "";
  }
}

// 输入监听
const searchInput = document.getElementById("searchInput");
let searchTimeout;
searchInput.addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value;
  searchTimeout = setTimeout(() => {
    search(q);
    renderEmojiList(q);
  }, 150);
});

// 分类标签
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.dataset.category;
    searchInput.value = "";
    document.getElementById("emojiResult").textContent = "❓";
    document.getElementById("emojiMeaning").textContent = "输入描述获取表情";
    renderEmojiList();
  });
});

// 初始渲染
renderEmojiList();
</script>
